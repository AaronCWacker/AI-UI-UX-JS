<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<title>🌲 Minnesota Deep Driver — Burrow + Night Vision</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#05070a;color:#fff;font-family:Inter,system-ui,Segoe UI,Arial,sans-serif}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #hud{position:fixed;inset:0;pointer-events:none}
  .top{position:absolute;left:10px;right:10px;top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .chip{pointer-events:auto;background:rgba(5,10,16,.72);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.14);
        border-radius:12px;padding:8px 10px;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
  button{color:#fff;background:#111b28;border:1px solid #31506d;border-radius:10px;padding:7px 10px;font-weight:700;cursor:pointer}
  button:hover{filter:brightness(1.18)}
  #readout{position:absolute;left:12px;bottom:12px;min-width:270px;max-width:430px}
  #legend{position:absolute;right:12px;bottom:12px;max-width:360px}
  .bar{height:7px;background:#17202b;border-radius:99px;overflow:hidden;margin-top:4px}
  .bar i{display:block;height:100%;width:50%;background:linear-gradient(90deg,#8ef,#fff)}
  .kbd{display:inline-block;min-width:18px;padding:1px 5px;border:1px solid #607084;border-bottom-width:3px;border-radius:5px;text-align:center;margin:0 1px;background:#16202b}
  #scan{position:absolute;inset:0;opacity:0;mix-blend-mode:screen;
    background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 4px)}
  #reticle{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:28px;text-shadow:0 0 8px #fff}
  #toast{position:absolute;left:50%;top:16%;transform:translateX(-50%);background:rgba(0,0,0,.7);border:1px solid #789;
    border-radius:12px;padding:10px 14px;opacity:0;transition:opacity .25s}
  #touch{position:absolute;left:12px;right:12px;bottom:120px;display:none;justify-content:space-between}
  .pad{pointer-events:auto;display:grid;grid-template-columns:repeat(3,52px);gap:5px}
  .pad button{width:52px;height:52px;font-size:20px;padding:0}
  @media(max-width:820px){
    #legend{display:none}
    #touch{display:flex}
    .chip{font-size:11px}
  }
</style>
</head>
<body>
<div id="hud">
  <div class="top">
    <div class="chip"><b>🌲 Minnesota Deep Driver</b> <span id="modeTxt">SURFACE</span></div>
    <div class="chip">
      <button id="bBurrow">🛠️ B Burrow</button>
      <button id="bVision">🌙 N Vision</button>
      <button id="bCam">🎥 C Camera</button>
      <button id="bRec">⏺ Record</button>
    </div>
    <div class="chip" id="visionTxt">💡 Headlights</div>
  </div>

  <div id="readout" class="chip">
    <div><b id="materialTxt">Surface: Glacial Till</b></div>
    <div>Speed <span id="speedTxt">0</span> km/h · Depth <span id="depthTxt">0.0</span> m · Temp <span id="tempTxt">8</span>°C</div>
    <div>Integrity <span id="hpTxt">100</span>%</div>
    <div class="bar"><i id="hpBar"></i></div>
    <div style="margin-top:6px">Find: <span id="findTxt">—</span></div>
  </div>

  <div id="legend" class="chip">
    <b>Controls</b><br>
    <span class="kbd">W</span><span class="kbd">S</span> throttle ·
    <span class="kbd">A</span><span class="kbd">D</span> steer ·
    <span class="kbd">Q</span><span class="kbd">E</span> underground strafe<br>
    <span class="kbd">Z</span><span class="kbd">X</span> drill down/up ·
    <span class="kbd">B</span> burrow · <span class="kbd">N</span> vision ·
    <span class="kbd">C</span> camera · mouse drag look
  </div>

  <div id="scan"></div><div id="reticle">＋</div><div id="toast"></div>

  <div id="touch">
    <div class="pad">
      <span></span><button data-k="KeyW">▲</button><span></span>
      <button data-k="KeyA">◀</button><button data-k="KeyS">▼</button><button data-k="KeyD">▶</button>
      <button data-k="KeyQ">Q</button><button data-k="KeyB">⛏️</button><button data-k="KeyE">E</button>
    </div>
    <div class="pad">
      <span></span><button data-k="KeyX">X</button><span></span>
      <button data-k="KeyZ">Z</button><button data-k="KeyN">🌙</button><button data-k="KeyC">🎥</button>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/controls/OrbitControls.js';

const clamp=THREE.MathUtils.clamp, lerp=THREE.MathUtils.lerp;
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x86b7d8);
scene.fog=new THREE.FogExp2(0x8eb0be,0.0065);

const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.05,1200);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

const hemi=new THREE.HemisphereLight(0xcfeaff,0x403829,1.65); scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff0d0,2.8); sun.position.set(-60,100,40);
sun.castShadow=true; sun.shadow.mapSize.set(2048,2048); scene.add(sun);

// ---------- procedural Minnesota-ish surface ----------
function h2(x,z){
  return 3.1*Math.sin(x*.045)+2.0*Math.cos(z*.055)+1.2*Math.sin((x+z)*.09)+
         .7*Math.cos(Math.hypot(x,z)*.08);
}
const groundGeo=new THREE.PlaneGeometry(340,340,140,140);
groundGeo.rotateX(-Math.PI/2);
for(const p of groundGeo.attributes.position.array ? [groundGeo.attributes.position] : []){
  for(let i=0;i<p.count;i++){
    const x=p.getX(i), z=p.getZ(i);
    p.setY(i,h2(x,z));
  }
}
groundGeo.computeVertexNormals();
const groundMat=new THREE.MeshStandardMaterial({color:0x587a3f,roughness:.94,metalness:0});
const ground=new THREE.Mesh(groundGeo,groundMat); ground.receiveShadow=true; scene.add(ground);

// lakes
for(const [x,z,sx,sz] of [[-55,-35,34,22],[68,52,28,20],[-90,70,18,12]]){
  const g=new THREE.CircleGeometry(1,48); g.rotateX(-Math.PI/2);
  const m=new THREE.MeshPhysicalMaterial({color:0x2b6787,roughness:.18,metalness:.05,transparent:true,opacity:.82});
  const lake=new THREE.Mesh(g,m); lake.scale.set(sx,1,sz); lake.position.set(x,h2(x,z)+.15,z); scene.add(lake);
}

// trees
const treeGroup=new THREE.Group(); scene.add(treeGroup);
const trunkG=new THREE.CylinderGeometry(.18,.25,2.4,6);
const crownG=new THREE.ConeGeometry(1.1,3.8,8);
const trunkM=new THREE.MeshStandardMaterial({color:0x5d4227});
const crownM=new THREE.MeshStandardMaterial({color:0x214d2b});
for(let i=0;i<260;i++){
  const x=THREE.MathUtils.randFloatSpread(310),z=THREE.MathUtils.randFloatSpread(310);
  if(Math.hypot(x+55,z+35)<35 || Math.hypot(x-68,z-52)<28) continue;
  const y=h2(x,z);
  const t=new THREE.Mesh(trunkG,trunkM), c=new THREE.Mesh(crownG,crownM);
  t.position.set(x,y+1.2,z); c.position.set(x,y+3.1,z);
  t.castShadow=c.castShadow=true; treeGroup.add(t,c);
}

// ---------- voxel geology volume ----------
const VS=3, NX=42, NY=18, NZ=42;
const VX0=-NX*VS/2, VZ0=-NZ*VS/2, TOP=-1.0;
const vox=new Map();
const typeColor={
  0:0x5b4a38, // till
  1:0x8b6d4c, // clay
  2:0xd6c48f, // sand
  3:0x9aa6a7, // limestone
  4:0x666a72, // granite
  5:0x6b302f, // iron formation
  6:0x2a6f8f, // aquifer
  7:0x9f4b2f  // hot rock
};
function layerType(yIndex,x,z){
  const depth=(NY-1-yIndex);
  if(depth<2) return 0;
  if(depth<5) return ((Math.sin(x*.5)+Math.cos(z*.42))>0.8)?2:1;
  if(depth<8) return 3;
  if(depth<13){
    const iron=Math.sin(x*.23+z*.17)>0.72;
    return iron?5:4;
  }
  if(depth<16) return (Math.sin(x*.31-z*.2)>0.74)?6:4;
  return 7;
}
function key(ix,iy,iz){return ix+"|"+iy+"|"+iz}
for(let ix=0;ix<NX;ix++) for(let iz=0;iz<NZ;iz++) for(let iy=0;iy<NY;iy++){
  const wx=VX0+ix*VS+VS*.5,wz=VZ0+iz*VS+VS*.5;
  const surface=h2(wx,wz);
  const wy=TOP-(NY-1-iy)*VS;
  if(wy < surface-1.5) vox.set(key(ix,iy,iz),layerType(iy,ix,iz));
}

// caves: carve 4 wandering tubes
for(let c=0;c<4;c++){
  let cx=THREE.MathUtils.randInt(8,NX-9), cz=THREE.MathUtils.randInt(8,NZ-9), cy=THREE.MathUtils.randInt(4,12);
  for(let s=0;s<40;s++){
    cx=clamp(cx+THREE.MathUtils.randInt(-1,1),3,NX-4);
    cz=clamp(cz+THREE.MathUtils.randInt(-1,1),3,NZ-4);
    cy=clamp(cy+THREE.MathUtils.randInt(-1,1),2,NY-4);
    for(let dx=-2;dx<=2;dx++)for(let dy=-1;dy<=1;dy++)for(let dz=-2;dz<=2;dz++)
      if(dx*dx+dy*dy+dz*dz<5.5) vox.delete(key(cx+dx,cy+dy,cz+dz));
  }
}

const cubeGeo=new THREE.BoxGeometry(VS*.96,VS*.96,VS*.96);
const instByType={};
const rayVoxMeshes=[];
function rebuildVoxels(){
  for(const t in instByType){scene.remove(instByType[t]); instByType[t].geometry.dispose(); instByType[t].material.dispose();}
  rayVoxMeshes.length=0;
  const buckets=Array.from({length:8},()=>[]);
  for(const [k,t] of vox){const [ix,iy,iz]=k.split('|').map(Number);buckets[t].push([ix,iy,iz]);}
  const M=new THREE.Matrix4();
  for(let t=0;t<8;t++){
    const arr=buckets[t]; if(!arr.length) continue;
    const mat=new THREE.MeshStandardMaterial({
      color:typeColor[t],roughness:t===6?.25:.96,metalness:t===5?.18:0,
      transparent:t===6,opacity:t===6?.62:1
    });
    const mesh=new THREE.InstancedMesh(cubeGeo.clone(),mat,arr.length);
    mesh.userData.type=t;
    arr.forEach(([ix,iy,iz],i)=>{
      const wx=VX0+ix*VS+VS*.5, wz=VZ0+iz*VS+VS*.5, wy=TOP-(NY-1-iy)*VS;
      M.makeTranslation(wx,wy,wz); mesh.setMatrixAt(i,M);
    });
    mesh.instanceMatrix.needsUpdate=true; mesh.castShadow=false; mesh.receiveShadow=true;
    scene.add(mesh); instByType[t]=mesh; rayVoxMeshes.push(mesh);
  }
}
rebuildVoxels();

// ---------- vehicle ----------
const rover=new THREE.Group(); scene.add(rover);
const bodyM=new THREE.MeshStandardMaterial({color:0xd96c29,metalness:.65,roughness:.3});
const darkM=new THREE.MeshStandardMaterial({color:0x16191d,metalness:.4,roughness:.38});
const glassM=new THREE.MeshPhysicalMaterial({color:0x74a9c4,transparent:true,opacity:.45,roughness:.12,metalness:.25});
const body=new THREE.Mesh(new THREE.BoxGeometry(3.5,1.1,6.3),bodyM); body.position.y=1.2; body.castShadow=true; rover.add(body);
const cab=new THREE.Mesh(new THREE.BoxGeometry(3.0,1.5,2.7),glassM); cab.position.set(0,2.15,.2); rover.add(cab);
const drill=new THREE.Mesh(new THREE.ConeGeometry(1.25,4,18),new THREE.MeshStandardMaterial({color:0xb6c2c9,metalness:.9,roughness:.18}));
drill.rotation.x=Math.PI/2; drill.position.set(0,.95,-4.85); rover.add(drill);
for(const sx of [-1.85,1.85]) for(const sz of [-2.1,2.1]){
  const w=new THREE.Mesh(new THREE.CylinderGeometry(.72,.72,.5,18),darkM); w.rotation.z=Math.PI/2; w.position.set(sx,.72,sz); rover.add(w);
}
const headL=new THREE.SpotLight(0xe9f5ff,140,80,.42,.45,1.1),headR=headL.clone();
headL.position.set(-1.1,1.7,-3.0);headR.position.set(1.1,1.7,-3.0);rover.add(headL,headR);
const targL=new THREE.Object3D(),targR=new THREE.Object3D();targL.position.set(-1.1,1,-16);targR.position.set(1.1,1,-16);rover.add(targL,targR);headL.target=targL;headR.target=targR;

const state={pos:new THREE.Vector3(0,h2(0,0)+.2,35),yaw:0,pitch:0,speed:0,burrow:false,vision:0,cam:0,hp:100,recording:false};
rover.position.copy(state.pos);
const visions=[
  ["💡 Headlights","head"],
  ["🌘 Low Light","low"],
  ["🟢 Green NV","green"],
  ["🔥 Thermal","thermal"],
  ["💎 Mineral Scan","mineral"],
  ["👁️ Deep Vision","deep"]
];
const cams=["CHASE","COCKPIT","DRILL","ORBIT"];
const orbit=new OrbitControls(camera,renderer.domElement); orbit.enabled=false; orbit.enableDamping=true;

function applyVision(){
  const mode=visions[state.vision][1];
  const scan=document.getElementById('scan');
  scan.style.opacity=(mode==="green"||mode==="thermal"||mode==="deep")?".46":"0";
  renderer.domElement.style.filter="none";
  scene.overrideMaterial=null;
  if(mode==="head"){hemi.intensity=state.burrow?.22:1.65; sun.intensity=state.burrow?.05:2.8; scene.fog.color.set(state.burrow?0x08090a:0x8eb0be);}
  if(mode==="low"){hemi.intensity=.45;sun.intensity=.2;scene.fog.color.set(0x111820);renderer.domElement.style.filter="brightness(1.45) contrast(1.25) saturate(.7)";}
  if(mode==="green"){hemi.intensity=.28;sun.intensity=.08;scene.fog.color.set(0x031006);renderer.domElement.style.filter="grayscale(1) sepia(1) hue-rotate(55deg) saturate(5) brightness(1.45) contrast(1.35)";}
  if(mode==="thermal"){hemi.intensity=.35;sun.intensity=.05;scene.fog.color.set(0x08000b);renderer.domElement.style.filter="contrast(1.65) saturate(3.1) hue-rotate(250deg)";}
  if(mode==="mineral"){hemi.intensity=.5;sun.intensity=.08;scene.fog.color.set(0x091019);renderer.domElement.style.filter="contrast(1.35) saturate(1.75) brightness(1.15)";}
  if(mode==="deep"){hemi.intensity=.75;sun.intensity=.12;scene.fog.color.set(0x06101c);renderer.domElement.style.filter="contrast(1.6) saturate(2.3) brightness(1.22)";}
  document.getElementById("visionTxt").textContent=visions[state.vision][0];
}

function toast(s){
  const e=document.getElementById("toast");e.textContent=s;e.style.opacity=1;
  clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,1100);
}

// ---------- particles ----------
const dust=[];
function puff(pos,color=0xb59b78,count=12){
  for(let i=0;i<count;i++){
    const m=new THREE.Mesh(new THREE.IcosahedronGeometry(.08+Math.random()*.12,0),
      new THREE.MeshBasicMaterial({color,transparent:true,opacity:.9}));
    m.position.copy(pos).add(new THREE.Vector3().randomDirection().multiplyScalar(Math.random()*1.5));
    m.userData.v=new THREE.Vector3().randomDirection().multiplyScalar(1+Math.random()*4);
    m.userData.life=.6+Math.random()*.8;scene.add(m);dust.push(m);
  }
}
function spark(pos,count=10){
  puff(pos,0xffb347,count);
}

// tunnel rings left behind
const tunnels=[];
function addTunnelMark(pos){
  if(tunnels.length>100){scene.remove(tunnels.shift())}
  const m=new THREE.Mesh(new THREE.TorusGeometry(2.35,.08,5,18),
    new THREE.MeshBasicMaterial({color:0x6f8897,transparent:true,opacity:.28}));
  m.position.copy(pos);m.rotation.y=-state.yaw;m.rotation.x=Math.PI/2+state.pitch;
  scene.add(m);tunnels.push(m);
}

// ---------- digging ----------
let digClock=0;
function worldToIndex(x,y,z){
  const ix=Math.floor((x-VX0)/VS),iz=Math.floor((z-VZ0)/VS);
  const iy=Math.round(NY-1-(TOP-y)/VS);
  return [ix,iy,iz];
}
function digAt(p,r=3.4){
  const [cx,cy,cz]=worldToIndex(p.x,p.y,p.z);
  let removed=0, hardest=0, found=-1;
  const rad=Math.ceil(r/VS)+1;
  for(let dx=-rad;dx<=rad;dx++)for(let dy=-rad;dy<=rad;dy++)for(let dz=-rad;dz<=rad;dz++){
    const ix=cx+dx,iy=cy+dy,iz=cz+dz;
    if(ix<0||iy<0||iz<0||ix>=NX||iy>=NY||iz>=NZ) continue;
    const wx=VX0+ix*VS+VS*.5, wz=VZ0+iz*VS+VS*.5, wy=TOP-(NY-1-iy)*VS;
    if(new THREE.Vector3(wx,wy,wz).distanceTo(p)<r){
      const k=key(ix,iy,iz);
      if(vox.has(k)){
        const t=vox.get(k);hardest=Math.max(hardest,t);if(t===5||t===6)found=t;
        vox.delete(k);removed++;
      }
    }
  }
  if(removed){
    rebuildVoxels();
    if(hardest>=4)spark(p,Math.min(20,removed));
    else puff(p,0xa58d71,Math.min(16,removed));
    addTunnelMark(p);
    if(found===5){toast("💎 Mesabi-style iron formation exposed"); document.getElementById("findTxt").textContent="Iron formation";}
    if(found===6){toast("💧 Fractured aquifer pocket opened"); document.getElementById("findTxt").textContent="Aquifer";}
  }
}

const keys={};
addEventListener("keydown",e=>{
  keys[e.code]=true;
  if(!e.repeat){
    if(e.code==="KeyB")toggleBurrow();
    if(e.code==="KeyN"){state.vision=(state.vision+1)%visions.length;applyVision();toast(visions[state.vision][0])}
    if(e.code==="KeyC"){state.cam=(state.cam+1)%cams.length;orbit.enabled=state.cam===3;toast("🎥 "+cams[state.cam])}
  }
});
addEventListener("keyup",e=>keys[e.code]=false);

document.querySelectorAll("[data-k]").forEach(b=>{
  const code=b.dataset.k;
  const down=e=>{e.preventDefault(); if(code==="KeyB")toggleBurrow();else if(code==="KeyN"){state.vision=(state.vision+1)%visions.length;applyVision()}else if(code==="KeyC"){state.cam=(state.cam+1)%cams.length;orbit.enabled=state.cam===3}else keys[code]=true};
  const up=e=>{e.preventDefault();keys[code]=false};
  b.addEventListener("pointerdown",down);b.addEventListener("pointerup",up);b.addEventListener("pointercancel",up);
});

function toggleBurrow(){
  state.burrow=!state.burrow;
  document.getElementById("modeTxt").textContent=state.burrow?"BURROW":"SURFACE";
  if(state.burrow){
    state.pos.y=Math.min(state.pos.y,h2(state.pos.x,state.pos.z)-2.2);
    state.pitch=-.12; toast("🛠️ Drill engaged — descend with Z");
  }else{
    state.pos.y=h2(state.pos.x,state.pos.z)+.2; state.pitch=0; toast("🚙 Surface drive");
  }
  applyVision();
}
document.getElementById("bBurrow").onclick=toggleBurrow;
document.getElementById("bVision").onclick=()=>{state.vision=(state.vision+1)%visions.length;applyVision()};
document.getElementById("bCam").onclick=()=>{state.cam=(state.cam+1)%cams.length;orbit.enabled=state.cam===3;toast("🎥 "+cams[state.cam])};

// mouse drag steering/look
let drag=false,lastX=0,lastY=0,lookYaw=0,lookPitch=0;
renderer.domElement.addEventListener("pointerdown",e=>{if(state.cam!==3){drag=true;lastX=e.clientX;lastY=e.clientY}});
addEventListener("pointerup",()=>drag=false);
addEventListener("pointermove",e=>{
  if(!drag)return;
  lookYaw+=(e.clientX-lastX)*.004;lookPitch=clamp(lookPitch+(e.clientY-lastY)*.003,-.65,.65);
  lastX=e.clientX;lastY=e.clientY;
});

// ---------- recording ----------
let mediaRecorder=null, recChunks=[];
async function toggleRecord(){
  if(!state.recording){
    const canvas=renderer.domElement;
    const stream=canvas.captureStream(60);
    let mime="video/webm;codecs=vp9";
    if(MediaRecorder.isTypeSupported("video/mp4")) mime="video/mp4";
    else if(MediaRecorder.isTypeSupported("video/webm;codecs=vp8")) mime="video/webm;codecs=vp8";
    mediaRecorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:10_000_000});
    recChunks=[];
    mediaRecorder.ondataavailable=e=>{if(e.data.size)recChunks.push(e.data)};
    mediaRecorder.onstop=()=>{
      const blob=new Blob(recChunks,{type:mediaRecorder.mimeType});
      const ext=mediaRecorder.mimeType.includes("mp4")?"mp4":"webm";
      const a=document.createElement("a");a.href=URL.createObjectURL(blob);
      const d=new Date(), pad=n=>String(n).padStart(2,"0");
      a.download=`MN-Deep-Driver--${pad(d.getHours())}-${pad(d.getMinutes())}-${pad(d.getSeconds())}--${pad(d.getMonth()+1)}-${pad(d.getDate())}-${String(d.getFullYear()).slice(-2)}.${ext}`;
      a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000);
      toast(ext==="mp4"?"🎬 MP4 saved":"🎬 Browser saved WebM (MP4 unsupported here)");
    };
    mediaRecorder.start(500);state.recording=true;document.getElementById("bRec").textContent="⏹ Stop";
    toast("⏺ Recording 3D canvas");
  }else{
    mediaRecorder.stop();state.recording=false;document.getElementById("bRec").textContent="⏺ Record";
  }
}
document.getElementById("bRec").onclick=toggleRecord;

// ---------- update ----------
const clock=new THREE.Clock();
const fwd=new THREE.Vector3(),right=new THREE.Vector3();
function materialAtDepth(d){
  if(d<4)return["Glacial Till",0];
  if(d<13)return["Clay / Sand",1];
  if(d<22)return["Limestone",3];
  if(d<38)return["Granite + Iron Formation",4];
  if(d<47)return["Fractured Aquifer",6];
  return["Deep Hot Rock",7];
}
function update(dt){
  const accel=state.burrow?11:24, max=state.burrow?24:74;
  const throttle=(keys.KeyW?1:0)-(keys.KeyS?1:0);
  state.speed+=throttle*accel*dt;
  state.speed*=Math.pow(.965,dt*60);
  state.speed=clamp(state.speed,-max*.42,max);
  const steer=(keys.KeyA?1:0)-(keys.KeyD?1:0);
  state.yaw+=steer*dt*(state.burrow?.75:1.25)*(0.35+Math.abs(state.speed)/max);
  if(state.burrow){
    state.pitch+=((keys.KeyZ?1:0)-(keys.KeyX?1:0))*dt*.65;
    state.pitch=clamp(state.pitch,-.72,.55);
  }else state.pitch=lerp(state.pitch,0,.12);

  fwd.set(-Math.sin(state.yaw)*Math.cos(state.pitch),Math.sin(-state.pitch),-Math.cos(state.yaw)*Math.cos(state.pitch));
  right.set(Math.cos(state.yaw),0,-Math.sin(state.yaw));
  const metersPerSec=state.speed/3.6;
  state.pos.addScaledVector(fwd,metersPerSec*dt);
  if(state.burrow)state.pos.addScaledVector(right,((keys.KeyE?1:0)-(keys.KeyQ?1:0))*7*dt);

  state.pos.x=clamp(state.pos.x,-154,154);state.pos.z=clamp(state.pos.z,-154,154);
  const surf=h2(state.pos.x,state.pos.z)+.25;
  if(!state.burrow)state.pos.y=lerp(state.pos.y,surf,.35);
  else{
    state.pos.y=Math.min(state.pos.y,surf-1.7);
    state.pos.y=Math.max(state.pos.y,-52);
    digClock-=dt;
    if(Math.abs(state.speed)>2 && digClock<=0){
      const tip=state.pos.clone().addScaledVector(fwd,5.4).add(new THREE.Vector3(0,.9,0));
      digAt(tip,3.8);digClock=.12;
    }
  }

  rover.position.copy(state.pos);
  rover.rotation.order="YXZ";rover.rotation.y=state.yaw;rover.rotation.x=state.pitch;

  // particles
  for(let i=dust.length-1;i>=0;i--){
    const p=dust[i];p.userData.life-=dt;p.position.addScaledVector(p.userData.v,dt);p.userData.v.multiplyScalar(.96);p.material.opacity=clamp(p.userData.life,0,1);
    if(p.userData.life<=0){scene.remove(p);dust.splice(i,1)}
  }

  // camera
  const lookBase=state.pos.clone().add(new THREE.Vector3(0,1.6,0));
  if(state.cam===0){
    const desired=lookBase.clone().add(new THREE.Vector3(0,5.2,0)).addScaledVector(fwd,-13).addScaledVector(right,Math.sin(lookYaw)*5);
    camera.position.lerp(desired,.1);camera.lookAt(lookBase.clone().addScaledVector(fwd,7).add(new THREE.Vector3(0,-lookPitch*3,0)));
  }else if(state.cam===1){
    camera.position.lerp(lookBase.clone().addScaledVector(fwd,-.2),.28);
    camera.lookAt(camera.position.clone().addScaledVector(fwd,20).addScaledVector(right,lookYaw*2).add(new THREE.Vector3(0,-lookPitch*6,0)));
  }else if(state.cam===2){
    camera.position.lerp(state.pos.clone().add(new THREE.Vector3(0,1.2,0)).addScaledVector(fwd,-3.2),.28);
    camera.lookAt(camera.position.clone().addScaledVector(fwd,24));
  }else{
    orbit.target.lerp(lookBase,.15);orbit.update();
  }

  // dynamic darkness underground
  if(state.burrow && state.vision===0){hemi.intensity=.16;sun.intensity=.01}
  headL.intensity=headR.intensity=(state.vision===0||state.vision===1)?150:45;

  const depth=Math.max(0,surf-state.pos.y);
  const [matName]=materialAtDepth(depth);
  document.getElementById("speedTxt").textContent=Math.abs(state.speed).toFixed(0);
  document.getElementById("depthTxt").textContent=depth.toFixed(1);
  document.getElementById("tempTxt").textContent=(8+depth*2.1).toFixed(0);
  document.getElementById("materialTxt").textContent=(state.burrow?"Layer: ":"Surface: ")+matName;
  document.getElementById("hpTxt").textContent=state.hp.toFixed(0);
  document.getElementById("hpBar").style.width=state.hp+"%";
}

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.04);
  update(dt);
  renderer.render(scene,camera);
}
applyVision(); animate();

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
