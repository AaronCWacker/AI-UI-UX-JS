<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>🏭 All AI (...)</title>
  <meta name="application-name" content="All AI" />
  <meta name="theme-color" content="#2563EB" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2064%2064%22%3E%20%3Crect%20x=%223%22%20y=%223%22%20width=%2258%22%20height=%2258%22%20rx=%2216%22%20fill=%22%23FFF1F8%22/%3E%20%3Cpath%20d=%22M18.5%2020.5c-2.8-3.8%200-9.1%204.8-9.1%201.9%200%203.6.9%204.7%202.3%201.5-2.4%204.2-4%207.2-4%203.4%200%206.3%201.9%207.7%204.8%205%20.2%209%204.3%209%209.4%200%201.7-.4%203.2-1.2%204.6%202.1%202%203.4%204.8%203.4%207.9%200%206-4.9%2010.9-10.9%2010.9H25c-6.7%200-12.2-5.5-12.2-12.2%200-3%201.1-5.7%202.9-7.8-.6-1.2-.9-2.5-.9-3.9%200-1.2.2-2.3.7-3.3%201%20.4%202%20.5%203%20.4z%22%20fill=%22%23F472B6%22%20stroke=%22%239D174D%22%20stroke-width=%222.5%22%20stroke-linejoin=%22round%22/%3E%20%3Cpath%20d=%22M22.5%2022.4c2.2-3.7%206.4-5.6%2010.5-4.7M35.2%2017.1c3.2-2.3%207.8-2.1%2010.8.9M19.7%2030.1c2.6%201.5%205.9%201.5%208.4.1M41.4%2030.1c2.5%201.3%205.5.9%207.7-.9%22%20fill=%22none%22%20stroke=%22%239D174D%22%20stroke-width=%222.1%22%20stroke-linecap=%22round%22/%3E%20%3Ccircle%20cx=%2226.7%22%20cy=%2231.2%22%20r=%226.5%22%20fill=%22%23FFFFFF%22/%3E%20%3Ccircle%20cx=%2239.3%22%20cy=%2231.2%22%20r=%226.5%22%20fill=%22%23FFFFFF%22/%3E%20%3Ccircle%20cx=%2228.6%22%20cy=%2232.5%22%20r=%222.6%22%20fill=%22%23111827%22/%3E%20%3Ccircle%20cx=%2241.2%22%20cy=%2232.5%22%20r=%222.6%22%20fill=%22%23111827%22/%3E%20%3Ccircle%20cx=%2227.6%22%20cy=%2231.4%22%20r=%22.9%22%20fill=%22%23FFFFFF%22/%3E%20%3Ccircle%20cx=%2240.2%22%20cy=%2231.4%22%20r=%22.9%22%20fill=%22%23FFFFFF%22/%3E%20%3Cpath%20d=%22M27.2%2040.6c1.8%202.4%204%203.6%206.8%203.6s5-1.2%206.8-3.6%22%20fill=%22none%22%20stroke=%22%237F1D1D%22%20stroke-width=%222.6%22%20stroke-linecap=%22round%22/%3E%20%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #F7F7F5; --bg2: #FFF; --ink: #1A1A1A; --ink2: #444; --muted: #888;
      --faint: #C8C8C0; --line: #E4E4DE; --line2: #EEEEEA;
      --accent: #2563EB; --accent-bg: #EFF6FF;
      --green: #16A34A; --green-bg: #F0FDF4;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
      --shadow: 0 2px 6px rgba(0,0,0,0.07);
      --r: 8px; --r-sm: 6px;
      --pad: 12px;
      --max: 1600px;
      --font: 'DM Sans', system-ui, -apple-system, sans-serif;
      --fs: 13px; /* user-adjustable base font size */
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; }
    html { height: 100%; -webkit-text-size-adjust: 100%; }
    body { min-height: 100%; background: var(--bg); color: var(--ink); font: var(--fs)/1.45 var(--font); -webkit-font-smoothing: antialiased; }
    .shell { display: flex; flex-direction: column; min-height: 100vh; }
    .row { max-width: var(--max); margin: 0 auto; width: 100%; padding-left: var(--pad); padding-right: var(--pad); }

    /* ═══ TOPBAR ═══ */
    .topbar { position: sticky; top: 0; z-index: 50; background: var(--bg2); border-bottom: 1px solid var(--line); box-shadow: var(--shadow-sm); }
    .topbar-main { display: flex; align-items: center; gap: 5px; padding-top: 5px; padding-bottom: 5px; flex-wrap: wrap; }
    .logo { font: 700 15px/1 var(--font); color: var(--ink); white-space: nowrap; display: flex; align-items: center; gap: 3px; }
    .logo-e { font-size: 17px; }
    .brand-brain { width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .brand-brain svg { width: 24px; height: 24px; display: block; }
    .brand-factory { font-size: 18px; line-height: 1; margin-left: -2px; }
    .repo-link { font: 700 15px/1 var(--font); color: var(--ink); cursor: pointer; padding: 2px 4px; border-radius: 4px; text-decoration: none; }
    .repo-link:hover { background: var(--accent-bg); color: var(--accent); }
    .brand-on { font: 600 11px/1 var(--font); color: var(--muted); padding: 0 2px; }
    .sep { color: var(--faint); font-weight: 300; margin: 0 1px; }
    .domain-link { font: 600 11px/1 var(--font); color: var(--accent); cursor: pointer; padding: 2px 5px; border-radius: 4px; text-decoration: none; }
    .domain-link:hover { background: var(--accent-bg); }
    .app-count { font: 600 11px/1 var(--font); color: var(--muted); padding: 2px 6px; background: var(--line2); border-radius: 5px; white-space: nowrap; }
    .spacer { flex: 1; min-width: 4px; }

    .tb { display: inline-flex; align-items: center; justify-content: center; gap: 2px; padding: 3px 7px; border: 1px solid var(--line); border-radius: 5px; background: var(--bg2); color: var(--ink2); font: 600 11px/1.1 var(--font); cursor: pointer; text-decoration: none; white-space: nowrap; transition: all .12s; min-height: 26px; }
    .tb:hover { border-color: var(--accent); color: var(--accent); }
    .tb.new-b { border-color: #BBF7D0; color: var(--green); background: var(--green-bg); }
    .tb.new-b:hover { background: #DCFCE7; }
    .tb .tbl { display: inline; }

    .clock-area { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
    .clock { font: 600 11px/1 var(--font); color: var(--ink2); white-space: nowrap; padding: 2px 5px; background: var(--line2); border-radius: 5px; cursor: default; }
    .timer-btns { display: flex; gap: 2px; }
    .timer-b { padding: 2px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg2); font: 600 10px/1.2 var(--font); color: var(--ink2); cursor: pointer; }
    .timer-b:hover { border-color: var(--accent); color: var(--accent); }
    .timer-b.running { border-color: #F87171; color: #DC2626; background: #FEF2F2; animation: pulse .8s infinite alternate; }
    @keyframes pulse { to { opacity: .7; } }
    .timer-overlay { display: none; position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,.55); justify-content: center; align-items: center; }
    .timer-overlay.show { display: flex; }
    .timer-card { background: #fff; border-radius: 14px; padding: 28px 36px; text-align: center; box-shadow: 0 12px 40px rgba(0,0,0,.2); }
    .timer-card h2 { font-size: 48px; margin-bottom: 8px; }
    .timer-card p { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
    .timer-card button { padding: 8px 24px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg2); font: 600 14px var(--font); cursor: pointer; }

    .util-btns { display: flex; gap: 2px; }

    /* ═══ FONT-SIZE CONTROL ═══ */
    .fs-ctrl { display: flex; align-items: center; gap: 2px; padding: 2px 4px; background: var(--line2); border-radius: 5px; }
    .fs-ctrl button { padding: 2px 6px; border: none; background: transparent; font: 700 13px/1 var(--font); color: var(--ink2); cursor: pointer; border-radius: 3px; }
    .fs-ctrl button:hover { background: var(--bg2); color: var(--accent); }
    .fs-ctrl span { font: 600 10px/1 var(--font); color: var(--muted); padding: 0 3px; min-width: 26px; text-align: center; }

    /* ═══ BOOKMARK BAR ═══ */
    .bm-bar { display: flex; gap: 6px; padding-top: 5px; padding-bottom: 5px; overflow-x: auto; border-bottom: 1px solid var(--line); background: var(--bg2); scrollbar-width: thin; align-items: stretch; }
    .bm-bar::-webkit-scrollbar { height: 4px; }
    .bm-bar::-webkit-scrollbar-thumb { background: var(--faint); border-radius: 2px; }
    .bm-group { display: flex; align-items: center; gap: 3px; padding: 0 5px 0 0; border-right: 1px solid var(--line2); flex-shrink: 0; }
    .bm-group:last-child { border-right: none; }
    .bm-glabel { font: 700 9px/1 var(--font); color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding-right: 3px; white-space: nowrap; align-self: center; }
    .bm-btn { display: inline-flex; align-items: center; justify-content: center; gap: 3px; padding: 4px 7px; border: 1px solid var(--line); border-radius: 5px; background: var(--bg); text-decoration: none; color: var(--ink2); font: 700 11px/1 var(--font); cursor: pointer; transition: all .12s; flex-shrink: 0; min-height: 28px; }
    .bm-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); transform: translateY(-1px); }
    .bm-emoji { font-size: 13px; line-height: 1; }
    .bm-favicon { width: 14px; height: 14px; border-radius: 2px; display: block; }
    .bm-letter { font: 700 11px/1 var(--font); }

    /* ═══ RECENTS ═══ */
    .recents-bar { display: flex; align-items: center; gap: 5px; padding-top: 4px; padding-bottom: 4px; overflow-x: auto; border-bottom: 1px solid var(--line2); background: var(--bg); scrollbar-width: none; }
    .recents-bar::-webkit-scrollbar { display: none; }
    .rlabel { font: 600 9px/1 var(--font); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; white-space: nowrap; flex-shrink: 0; }
    .rchip { display: inline-flex; align-items: center; padding: 2px 7px; border-radius: 4px; background: var(--bg2); border: 1px solid var(--line); font: 400 11px/1.2 var(--font); color: var(--ink2); cursor: pointer; white-space: nowrap; text-decoration: none; flex-shrink: 0; }
    .rchip:hover { border-color: var(--accent); color: var(--accent); }

    /* ═══ SEARCH ═══ */
    .search-row { display: flex; gap: 6px; align-items: center; padding-top: 6px; padding-bottom: 5px; }
    .search-input { flex: 1; min-width: 0; padding: 6px 10px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--bg2); font: 400 var(--fs)/1.3 var(--font); color: var(--ink); outline: none; }
    .search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(37,99,235,.1); }
    .search-input::placeholder { color: var(--faint); }
    .sort-sel { padding: 6px 6px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--bg2); font: 400 11px/1.3 var(--font); color: var(--ink2); cursor: pointer; outline: none; }
    .refresh-b { padding: 6px 8px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--bg2); font: 600 11px/1 var(--font); color: var(--ink2); cursor: pointer; }
    .refresh-b:hover { border-color: var(--accent); color: var(--accent); }
    .refresh-b.spin { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ═══ CLUSTERS ═══ */
    .cluster-bar { display: flex; gap: 3px; flex-wrap: wrap; padding-top: 4px; padding-bottom: 5px; }
    .cb { display: inline-flex; align-items: center; gap: 2px; padding: 3px 7px; border: 1px solid var(--line); border-radius: 5px; background: var(--bg2); font: 500 11px/1.1 var(--font); color: var(--ink2); cursor: pointer; white-space: nowrap; transition: all .12s; }
    .cb:hover { border-color: var(--accent); color: var(--accent); }
    .cb.act { background: var(--accent); border-color: var(--accent); color: #fff; }
    .cb .cc { font-size: 10px; opacity: .6; }

    /* ═══ VIEW SWITCH ═══ */
    .view-bar { display: flex; gap: 4px; padding-top: 2px; padding-bottom: 6px; align-items: center; }
    .vb { display: inline-flex; align-items: center; gap: 3px; padding: 4px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg2); font: 600 11px/1 var(--font); color: var(--ink2); cursor: pointer; }
    .vb:hover { border-color: var(--accent); color: var(--accent); }
    .vb.act { background: var(--ink); border-color: var(--ink); color: #fff; }
    .view-hint { font: 400 10px/1.3 var(--font); color: var(--muted); margin-left: auto; }

    /* ═══ GRAPH VIEW ═══ */
    .graph-wrap { display: none; position: relative; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg2); overflow: hidden; }
    .graph-wrap.show { display: block; }
    .graph-wrap canvas { display: block; width: 100%; touch-action: none; cursor: grab; }
    .graph-wrap canvas:active { cursor: grabbing; }
    .graph-toolbar { position: absolute; top: 6px; right: 6px; display: flex; gap: 4px; z-index: 5; }
    .graph-toolbar button { padding: 4px 8px; border: 1px solid var(--line); border-radius: 5px; background: rgba(255,255,255,.92); font: 600 10px/1 var(--font); color: var(--ink2); cursor: pointer; }
    .graph-toolbar button:hover { border-color: var(--accent); color: var(--accent); }
    .graph-legend { position: absolute; bottom: 6px; left: 6px; display: flex; flex-wrap: wrap; gap: 4px; max-width: 70%; z-index: 5; }
    .graph-legend span { font: 600 9px/1 var(--font); padding: 2px 6px; border-radius: 99px; color: #fff; opacity: .88; white-space: nowrap; }

    /* ═══ TREEMAP VIEW ═══ */
    .treemap-wrap { display: none; position: relative; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg2); overflow: hidden; height: 560px; }
    .treemap-wrap.show { display: block; }
    .tm-cluster { position: absolute; border: 2px solid var(--bg2); overflow: hidden; }
    .tm-cluster-label { position: absolute; top: 2px; left: 4px; font: 700 10px/1.2 var(--font); color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.35); pointer-events: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 92%; }
    .tm-app { position: absolute; border: 1px solid rgba(255,255,255,.5); background: rgba(255,255,255,.14); cursor: pointer; overflow: hidden; transition: background .12s; }
    .tm-app:hover { background: rgba(255,255,255,.32); }
    .tm-app-label { font: 600 9px/1.2 var(--font); color: #fff; padding: 2px 4px; text-shadow: 0 1px 1px rgba(0,0,0,.4); pointer-events: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ═══ TIMELINE VIEW ═══ */
    .timeline-wrap { display: none; }
    .timeline-wrap.show { display: block; }
    .tl-grp { position: relative; padding-left: 16px; margin-bottom: 10px; border-left: 2px solid var(--line); }
    .tl-grp::before { content: ''; position: absolute; left: -6px; top: 3px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); border: 2px solid var(--bg2); }
    .tl-grp-h { font: 700 12px/1.2 var(--font); color: var(--ink); padding-bottom: 5px; }
    .tl-grp-h .gc { font: 400 10px/1 var(--font); color: var(--muted); }
    .tl-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 5px; }

    /* ═══ MINIMAL NODE POPOVER (graph + treemap) ═══ */
    .node-pop { position: fixed; z-index: 300; background: var(--bg2); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.15); padding: 8px; min-width: 160px; max-width: 220px; }
    .node-pop .np-title { font: 700 12px/1.3 var(--font); color: var(--ink); margin-bottom: 6px; word-break: break-word; }
    .node-pop .np-meta { font: 400 10px/1.3 var(--font); color: var(--muted); margin-bottom: 6px; }
    .node-pop .np-acts { display: flex; gap: 4px; }
    .node-pop .np-btn { flex: 1; text-align: center; padding: 5px 0; border: 1px solid var(--line); border-radius: 5px; background: var(--bg); font: 600 11px/1 var(--font); color: var(--ink2); cursor: pointer; text-decoration: none; }
    .node-pop .np-btn:hover { border-color: var(--accent); color: var(--accent); }
    .node-pop .np-btn.play { border-color: #BBF7D0; color: var(--green); background: var(--green-bg); }

    /* ═══ MAIN ═══ */
    .main { flex: 1; padding-bottom: 24px; padding-top: 6px; }
    .result-info { font: 400 11px/1.3 var(--font); color: var(--muted); padding: 3px 0 6px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .result-info strong { color: var(--ink); }

    .grp { margin-bottom: 8px; }
    .grp-h { display: flex; align-items: center; gap: 5px; padding: 4px 0 3px; font: 700 12px/1.2 var(--font); color: var(--ink); border-bottom: 1px solid var(--line2); margin-bottom: 5px; }
    .grp-h .gc { font: 400 10px/1 var(--font); color: var(--muted); background: var(--line2); padding: 1px 6px; border-radius: 99px; }

    /* ═══ TILES (simplified) ═══ */
    .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 6px; }
    .tile { display: flex; flex-direction: column; gap: 5px; padding: 8px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg2); transition: border-color .12s, box-shadow .12s; min-width: 0; position: relative; }
    .tile:hover { border-color: #CCC; box-shadow: var(--shadow); }
    .t-head { display: flex; align-items: flex-start; gap: 5px; min-width: 0; }
    .t-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; margin-top: 4px; }
    .t-name { font: 700 var(--fs)/1.25 var(--font); color: var(--ink); word-break: break-word; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; flex: 1; min-width: 0; }
    .t-new { flex-shrink: 0; font: 700 9px/1 var(--font); color: #fff; background: var(--accent); padding: 2px 5px; border-radius: 99px; white-space: nowrap; }
    .t-when { font: 400 10px/1.2 var(--font); color: var(--muted); }
    .t-acts { display: flex; gap: 4px; }
    .t-btn { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 3px; padding: 5px 0; border: 1px solid var(--line); border-radius: 5px; background: var(--bg); font: 600 11px/1 var(--font); color: var(--ink2); cursor: pointer; transition: all .12s; text-decoration: none; white-space: nowrap; }
    .t-btn:hover { border-color: var(--accent); color: var(--accent); }
    .t-btn.play { border-color: #BBF7D0; color: var(--green); background: var(--green-bg); }
    .t-btn.play:hover { background: #DCFCE7; }

    .empty-s { padding: 30px 12px; text-align: center; color: var(--muted); font-size: 13px; border: 1px dashed var(--line); border-radius: var(--r); }

    /* ═══ HISTORY ═══ */
    .hist-toggle { display: flex; align-items: center; gap: 5px; padding: 8px 0 4px; cursor: pointer; font: 600 12px/1.2 var(--font); color: var(--accent); border: none; background: none; }
    .hist-toggle:hover { text-decoration: underline; }
    .hist-wrap { display: none; padding-bottom: 12px; }
    .hist-wrap.open { display: block; }
    .hist-list { display: flex; flex-direction: column; gap: 3px; }
    .hist-item { display: flex; align-items: center; gap: 6px; font: 400 11px/1.3 var(--font); color: var(--ink2); padding: 3px 6px; border-radius: 5px; background: var(--bg2); border: 1px solid var(--line2); }
    .hist-item .htime { font: 600 10px/1 var(--font); color: var(--muted); white-space: nowrap; flex-shrink: 0; }
    .hist-item .hname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hist-item a { color: var(--accent); text-decoration: none; font-weight: 600; flex-shrink: 0; }

    /* ═══ TOAST ═══ */
    .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 7px 16px; border-radius: 7px; font: 600 12px/1.3 var(--font); box-shadow: var(--shadow); z-index: 999; opacity: 0; pointer-events: none; transition: opacity .2s; }
    .toast.show { opacity: 1; }

    /* ═══ RESPONSIVE ═══ */
    @media (max-width: 768px) {
      :root { --pad: 8px; }
      .topbar-main { gap: 3px; }
      .tb .tbl { display: none; }
      .clock { font-size: 10px; }
      .tiles { grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 5px; }
      .tile { padding: 6px; }
      .bm-glabel { display: none; }
      .bm-group { padding-right: 4px; gap: 2px; }
    }
    @media (max-width: 380px) {
      .tiles { grid-template-columns: 1fr 1fr; gap: 4px; }
      .t-btn { font-size: 10px; padding: 4px 0; }
      .clock-area { width: 100%; justify-content: space-between; }
    }
  </style>
</head>
<body>
<div class="shell">

  <!-- ═══ TOPBAR ═══ -->
  <header class="topbar">
    <div class="topbar-main row">

/* ══════════════════════════════════════════════════════════════
   RECENCY — walk the Commits API (not the Contents API, which has
   no dates) to find when each visible file was last touched.

   Anonymous GitHub API calls are capped at 60/hour, and this repo
   has hundreds of files, so we can't just ask "when was file X
   last changed?" per file. Instead we:
     1. Pull a couple pages of the repo's commit list (cheap: 2
        calls covers ~200 commits).
     2. Walk those commits newest → oldest, fetching each commit's
        full detail (which includes changed files) until every
        currently-visible file has a date OR we hit a fetch budget.
     3. Cache the result in localStorage for 30 min so repeat
        visits/reloads don't re-spend the budget.
   Anything not resolved within the budget is treated as "older
   than what we scanned" and falls back to alphabetical order.
   ══════════════════════════════════════════════════════════════ */
const COMMIT_CACHE_KEY = 'ygg-commit-cache-v1';
const COMMIT_CACHE_TTL = 30*60*1000;   // 30 min
const MAX_COMMIT_LIST_PAGES = 2;       // 2 * 100 = up to 200 commits considered
const MAX_COMMIT_DETAIL_FETCHES = 45;  // hard cap on expensive per-commit calls
const NEW_BADGE_WINDOW = 7*24*60*60*1000; // 🆕 badge if touched within 7 days

function loadCommitCache(){
  try{
    const cached = JSON.parse(localStorage.getItem(COMMIT_CACHE_KEY)||'null');
    if(cached && Date.now()-cached.ts < COMMIT_CACHE_TTL){
      S.commitDates = new Map(cached.data);
      S.commitsLoaded = true;
      return true;
    }
  }catch{}
  return false;
}

async function loadCommitRecency(force=false){
  if(S.commitsLoading) return;
  if(!force && loadCommitCache()) return;

  S.commitsLoading = true;
  const btn = $('btnRefreshRecency'); if(btn) btn.classList.add('spin');
  try{
    const dates = new Map();
    const wanted = new Set(S.apps.map(a=>a.name));
    let detailFetches = 0;

    outer:
    for(let page=1; page<=MAX_COMMIT_LIST_PAGES; page++){
      const res = await fetch(`${CFG.commitsApi}?per_page=100&page=${page}`,{headers:{Accept:'application/vnd.github+json'}});
      if(!res.ok){
        if(res.status===403) toast('⚠️ GitHub rate limit hit — showing partial recency');
        break;
      }
      const commits = await res.json();
      if(!Array.isArray(commits) || !commits.length) break;

      for(const c of commits){
        if(wanted.size===0 || detailFetches>=MAX_COMMIT_DETAIL_FETCHES) break outer;
        const detRes = await fetch(c.url,{headers:{Accept:'application/vnd.github+json'}});
        detailFetches++;
        if(!detRes.ok){ if(detRes.status===403) break outer; continue; }
        const det = await detRes.json();
        const when = det.commit?.committer?.date || det.commit?.author?.date || c.commit?.committer?.date;
        for(const f of (det.files||[])){
          if(wanted.has(f.filename) && !dates.has(f.filename)){
            dates.set(f.filename, when);
            wanted.delete(f.filename);
          }
        }
      }
    }

    S.commitDates = dates;
    S.commitsLoaded = true;
    try{ localStorage.setItem(COMMIT_CACHE_KEY, JSON.stringify({ts:Date.now(), data:[...dates.entries()]})); }catch{}
  }catch(err){
    console.warn('commit recency fetch failed', err);
    toast('⚠️ Could not load recency data');
  }finally{
    S.commitsLoading = false;
    if(btn) btn.classList.remove('spin');
  }
}

function fmtRelative(iso){
  if(!iso) return '';
  const ms = Date.now() - new Date(iso).getTime();
  const day = 24*60*60*1000;
  if(ms < 60*60*1000) return 'just now';
  if(ms < day) return `${Math.floor(ms/(60*60*1000))}h ago`;
  if(ms < 30*day) return `${Math.floor(ms/day)}d ago`;
  if(ms < 365*day) return `${Math.floor(ms/(30*day))}mo ago`;
  return `${Math.floor(ms/(365*day))}y ago`;
}

      const img = document.createElement('img');

      img.referrerPolicy = 'no-referrer';
      img.onerror = () => {
        const em = document.createElement('span'); em.className = 'bm-emoji'; em.textContent = emoji;
        a.replaceChild(em, img);
      };
      a.appendChild(img);
      const ltr = document.createElement('span'); ltr.className = 'bm-letter'; ltr.textContent = letter;
      a.appendChild(ltr);
      g.appendChild(a);
    }
    bar.appendChild(g);
  }

function updateClock(){
  const now=new Date();
  const days=['SUN','MON','TUE','WED','THU','FRI','SAT'];
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const pad=n=>String(n).padStart(2,'0');
  const h=now.getHours(),h12=h%12||12,ampm=h>=12?'PM':'AM';
  $('clock').textContent=`${days[now.getDay()]} ${months[now.getMonth()]} ${now.getDate()} ${pad(h12)}:${pad(now.getMinutes())}:${pad(now.getSeconds())} ${ampm}`;
}

let timerInt=null,timerBtn=null,timerStart=null;
document.querySelectorAll('.timer-b').forEach(btn=>{
  btn.addEventListener('click',()=>{
    if(timerInt&&timerBtn===btn){clearInterval(timerInt);timerInt=null;btn.classList.remove('running');btn.textContent=btn.dataset.orig;return;}
    if(timerInt){clearInterval(timerInt);timerBtn.classList.remove('running');timerBtn.textContent=timerBtn.dataset.orig;}
    const secs=parseInt(btn.dataset.sec);
    btn.dataset.orig=btn.textContent;timerBtn=btn;timerStart=new Date();let rem=secs;

async function fetchApps(){
  const res=await fetch(CFG.api,{headers:{Accept:'application/vnd.github+json'}});
  if(!res.ok) throw new Error(`GitHub API ${res.status}`);
  const files=await res.json();
  S.apps=files.filter(f=>f.type==='file'&&/\.(html|py)$/i.test(f.name)&&!CFG.exclude.has(f.name)).map(f=>{
    const ext=f.name.toLowerCase().endsWith('.py')?'py':'html';
    const display=cleanName(f.name),tokens=tokenize(f.name);
    return{name:f.name,ext,display,tokens,color:hashColor(display),size:f.size||0};
  });
  loadCommitCache(); // pick up any still-fresh cached recency without spending a request
  render();
}

function buildClusterBar(){
  const bar=$('clusterBar');bar.innerHTML='';
  for(const c of CLUSTERS){
    const cnt=c.id==='all'?S.apps.length:S.apps.filter(a=>matchCluster(a,c.id)).length;
    if(c.id!=='all'&&cnt===0)continue;
    const b=document.createElement('button');b.className=`cb${S.cluster===c.id?' act':''}`;
    b.innerHTML=`${c.emoji}${c.label}<span class="cc">${cnt}</span>`;
    b.onclick=()=>{S.cluster=c.id;render();};bar.appendChild(b);
  }
}

function buildRecents(){
  const bar=$('recentsBar');bar.innerHTML='<span class="rlabel">Recent</span>';
  const names=S.recents.filter(n=>S.apps.some(a=>a.name===n));
  const show=names.length?names.slice(0,5):S.apps.slice(0,5).map(a=>a.name);
  for(const nm of show){
    const app=S.apps.find(a=>a.name===nm);if(!app)continue;
    const a=document.createElement('a');a.className='rchip';a.textContent=app.display;
    a.href=playUrl(app);a.target='_blank';a.rel='noopener';
    a.onclick=()=>saveRecent(app.name);bar.appendChild(a);
  }
}

function buildHistory(){
  const list=$('histList');list.innerHTML='';
  $('histCount').textContent=`(${S.history.length})`;
  for(const h of S.history.slice(0,50)){
    const app=S.apps.find(a=>a.name===h.name);
    const d=new Date(h.ts);const pad=n=>String(n).padStart(2,'0');
    const timeStr=`${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours()%12||12)}:${pad(d.getMinutes())} ${d.getHours()>=12?'PM':'AM'}`;
    const div=document.createElement('div');div.className='hist-item';
    div.innerHTML=`<span class="htime">${timeStr}</span><span class="hname">${escH(h.name)}</span>${app?`<a href="${playUrl(app)}" target="_blank" rel="noopener">▶</a>`:''}`;
    list.appendChild(div);
  }
}

function filterApps(){
  const q=S.search.trim().toLowerCase();
  return S.apps.filter(a=>{
    if(!matchCluster(a,S.cluster))return false;
    if(q&&!a.name.toLowerCase().includes(q)&&!a.display.toLowerCase().includes(q))return false;
    return true;
  });
}

function sortApps(apps){
  if(S.sort==='newest'){
    return [...apps].sort((a,b)=>{
      const da=S.commitDates.get(a.name), db=S.commitDates.get(b.name);
      if(da&&db) return new Date(db)-new Date(da);
      if(da&&!db) return -1;
      if(!da&&db) return 1;
      return a.display.localeCompare(b.display);
    });
  }
  return[...apps].sort((a,b)=>{
    if(S.sort==='az')return a.display.localeCompare(b.display);
    if(S.sort==='za')return b.display.localeCompare(a.display);
    return a.display.localeCompare(b.display);
  });
}

function groupByFirst(apps){
  const m=new Map();
  for(const a of apps){const w=a.tokens[0]||'misc';if(!m.has(w))m.set(w,[]);m.get(w).push(a);}
  return[...m.entries()].sort((a,b)=>b[1].length-a[1].length||a[0].localeCompare(b[0]));
}

function render(){
  const filtered=filterApps(),sorted=sortApps(filtered);S.filtered=sorted;
  $('appCount').textContent=`📦 ${S.apps.length}`;
  document.title = `🏭 All AI (${S.apps.length})`;
  const resolvedCount = S.sort==='newest' ? sorted.filter(a=>S.commitDates.has(a.name)).length : 0;
  let info = `Showing <strong>${sorted.length}</strong> of <strong>${S.apps.length}</strong>`;
  if(S.sort==='newest'){
    if(S.commitsLoading) info += ` · ⏳ loading recency…`;
    else if(S.commitsLoaded) info += ` · <strong>${resolvedCount}</strong> dated (rest fall back to A→Z)`;
  }
  $('resultInfo').innerHTML=info;
  buildClusterBar();buildRecents();buildHistory();buildViewBar();

  // toggle which container is visible
  $('deck').style.display = S.view==='list' ? '' : 'none';
  $('graphWrap').classList.toggle('show', S.view==='graph');
  $('treemapWrap').classList.toggle('show', S.view==='treemap');
  $('timelineWrap').classList.toggle('show', S.view==='timeline');
  if(S.view!=='graph') stopGraphSim();
  hideNodePop();

  if(!sorted.length){
    if(S.view==='list') $('deck').innerHTML='<div class="empty-s">No apps match.</div>';
    return;
  }

  if(S.view==='list') renderList(sorted);
  else if(S.view==='graph') renderGraph(sorted);
  else if(S.view==='treemap') renderTreemap(sorted);
  else if(S.view==='timeline') renderTimeline(sorted);
}

function renderList(sorted){

  if(S.sort==='cluster'&&S.cluster==='all'){
    for(const[w,apps]of groupByFirst(sorted)){
      const g=document.createElement('div');g.className='grp';
      g.innerHTML=`<div class="grp-h"><span>${escH(w.charAt(0).toUpperCase()+w.slice(1))}</span><span class="gc">${apps.length}</span></div>`;

/* ══════════════════════════════════════════════════════════════
   GRAPH VIEW — a lightweight, dependency-free spring/force-directed
   network (canvas + a small custom physics loop, in the spirit of
   the classic "neuron graph" visualizations). Nodes = apps, colored
   by cluster and sized by your local click history; edges = shared
   meaningful filename tokens (correlation), capped per-node so it
   settles into legible clusters instead of a hairball.
   The sim runs with alpha-decay (like d3-force) and then rests —
   it is NOT a continuous per-frame animation, so it stays cheap
   even with a couple hundred nodes.
   ══════════════════════════════════════════════════════════════ */
const MAX_GRAPH_NODES = 220;
const graphState = { raf:null, nodes:[], edges:[], alpha:1, dragging:null, canvas:null, ctx:null, dpr:1 };

function computeEdges(apps){
  const tokenMap = new Map();
  apps.forEach((a,i)=>{
    for(const t of a.tokens){ if(t.length<3) continue;
      if(!tokenMap.has(t)) tokenMap.set(t,[]);
      tokenMap.get(t).push(i);
    }
  });
  const capBucket = Math.max(8, Math.round(apps.length*0.12));
  const weights = new Map();
  for(const idxs of tokenMap.values()){
    if(idxs.length<2 || idxs.length>capBucket) continue; // skip singleton + overly-common tokens (hairball prevention)
    for(let x=0;x<idxs.length;x++) for(let y=x+1;y<idxs.length;y++){
      const key = idxs[x]<idxs[y] ? `${idxs[x]}_${idxs[y]}` : `${idxs[y]}_${idxs[x]}`;
      weights.set(key,(weights.get(key)||0)+1);
    }
  }
  let edges = [...weights.entries()].map(([k,w])=>{const[i,j]=k.split('_').map(Number);return{source:i,target:j,weight:w};});
  // cap degree per node so hub tokens don't create a hairball — keep each node's strongest few links
  const byNode = new Map();
  for(const e of edges){
    (byNode.get(e.source)||byNode.set(e.source,[]).get(e.source)).push(e);
    (byNode.get(e.target)||byNode.set(e.target,[]).get(e.target)).push(e);
  }
  const keep = new Set();
  for(const list of byNode.values()){ list.sort((a,b)=>b.weight-a.weight); for(const e of list.slice(0,3)) keep.add(e); }
  return [...keep];
}

function stopGraphSim(){ if(graphState.raf){ cancelAnimationFrame(graphState.raf); graphState.raf=null; } }

function renderGraph(sortedIn){
  stopGraphSim();
  const capped = sortedIn.length>MAX_GRAPH_NODES;
  const sorted = capped ? [...sortedIn].sort((a,b)=>appScore(b.name)-appScore(a.name)).slice(0,MAX_GRAPH_NODES) : sortedIn;
  $('viewHint').textContent = (capped?`Showing top ${MAX_GRAPH_NODES} by relevance (filter to see all) · `:'') + 'Drag nodes · click for Play/Code';

  const wrap=$('graphWrap');
  const canvas=$('graphCanvas'); graphState.canvas=canvas;
  const w = wrap.clientWidth || 800, h = Math.max(420, Math.min(680, window.innerHeight*0.55));
  const dpr = Math.min(window.devicePixelRatio||1, 2); graphState.dpr=dpr;
  canvas.width = w*dpr; canvas.height = h*dpr; canvas.style.height = h+'px';
  const ctx = canvas.getContext('2d'); ctx.scale(dpr,dpr); graphState.ctx=ctx;

  const scores = sorted.map(a=>appScore(a.name));
  const maxScore = Math.max(1,...scores);
  const nodes = sorted.map((a,i)=>({
    app:a, x:w/2+(Math.random()-0.5)*w*0.8, y:h/2+(Math.random()-0.5)*h*0.8, vx:0, vy:0,
    r: 5 + 9*Math.sqrt(scores[i]/maxScore), color: clusterColor(clusterOf(a)), fx:null, fy:null,
  }));
  const edges = computeEdges(sorted);
  graphState.nodes = nodes; graphState.edges = edges; graphState.alpha = 1;

  // legend: which clusters are present
  const legend = $('graphLegend'); legend.innerHTML='';
  const seen = new Set();
  for(const n of nodes){ const cid=clusterOf(n.app); if(seen.has(cid))continue; seen.add(cid);
    const c=CLUSTERS.find(x=>x.id===cid);
    const s=document.createElement('span'); s.style.background=clusterColor(cid); s.textContent=`${c?c.emoji:'•'} ${c?c.label:'Misc'}`;
    legend.appendChild(s);
  }

  function tick(){
    const a = graphState.alpha;
    if(a<0.005){ draw(); return; } // settled — draw final frame and stop
    const REPEL=1800, SPRING=0.012, CENTER=0.0022, DAMP=0.82;
    for(const n of nodes){ if(n.fx==null) n.vx*=DAMP, n.vy*=DAMP; else { n.x=n.fx; n.y=n.fy; n.vx=0; n.vy=0; } }
    for(let i=0;i<nodes.length;i++){
      for(let j=i+1;j<nodes.length;j++){
        const A=nodes[i],B=nodes[j];
        let dx=A.x-B.x, dy=A.y-B.y, d2=dx*dx+dy*dy; if(d2<1)d2=1;
        const f = REPEL/d2 * a;
        const d=Math.sqrt(d2); const fx=dx/d*f, fy=dy/d*f;
        if(A.fx==null){A.vx+=fx;A.vy+=fy;} if(B.fx==null){B.vx-=fx;B.vy-=fy;}
      }
    }
    for(const e of edges){
      const A=nodes[e.source],B=nodes[e.target];
      let dx=B.x-A.x, dy=B.y-A.y, d=Math.sqrt(dx*dx+dy*dy)||1;
      const rest=70; const f=(d-rest)*SPRING*Math.min(2,e.weight)*a;
      const fx=dx/d*f, fy=dy/d*f;
      if(A.fx==null){A.vx+=fx;A.vy+=fy;} if(B.fx==null){B.vx-=fx;B.vy-=fy;}
    }
    for(const n of nodes){
      if(n.fx==null){ n.vx += (w/2-n.x)*CENTER; n.vy += (h/2-n.y)*CENTER; n.x+=n.vx; n.y+=n.vy; }
      n.x = Math.max(n.r+2, Math.min(w-n.r-2, n.x));
      n.y = Math.max(n.r+2, Math.min(h-n.r-2, n.y));
    }
    draw();
    graphState.alpha *= 0.985;
    graphState.raf = requestAnimationFrame(tick);
  }

  function draw(){
    ctx.clearRect(0,0,w,h);
    ctx.lineWidth=1;
    for(const e of edges){
      const A=nodes[e.source],B=nodes[e.target];
      ctx.strokeStyle=`rgba(150,150,150,${Math.min(0.45,0.12*e.weight)})`;
      ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.stroke();
    }
    for(const n of nodes){
      ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,Math.PI*2);
      ctx.fillStyle=n.color;ctx.globalAlpha=0.92;ctx.fill();
      ctx.globalAlpha=1;ctx.lineWidth=1.5;ctx.strokeStyle='#fff';ctx.stroke();
      if(n.r>9){
        ctx.fillStyle='#fff';ctx.font='600 9px DM Sans, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
        const label = n.app.display.length>14 ? n.app.display.slice(0,13)+'…' : n.app.display;
        ctx.fillText(label, n.x, n.y);
      }
    }
  }

  function nodeAt(cx,cy){
    for(let i=nodes.length-1;i>=0;i--){ const n=nodes[i]; const dx=cx-n.x,dy=cy-n.y; if(dx*dx+dy*dy <= (n.r+4)*(n.r+4)) return n; }
    return null;
  }
  function toCanvasXY(e){
    const rect=canvas.getBoundingClientRect();
    const cx=(e.clientX-rect.left), cy=(e.clientY-rect.top);
    const sx = w/rect.width, sy=h/rect.height;
    return [cx*sx, cy*sy];
  }
  let dragMoved=false;
  canvas.onpointerdown=(e)=>{
    const[cx,cy]=toCanvasXY(e); const n=nodeAt(cx,cy);
    if(n){ graphState.dragging=n; n.fx=cx; n.fy=cy; dragMoved=false; canvas.setPointerCapture(e.pointerId);
      if(graphState.alpha<0.05){ graphState.alpha=0.3; graphState.raf=graphState.raf||requestAnimationFrame(tick); } }
  };
  canvas.onpointermove=(e)=>{
    if(!graphState.dragging) return; dragMoved=true;
    const[cx,cy]=toCanvasXY(e); graphState.dragging.fx=cx; graphState.dragging.fy=cy;
    if(graphState.alpha<0.02) draw();
  };
  canvas.onpointerup=(e)=>{
    const n=graphState.dragging;
    if(n){ const wasClick=!dragMoved;
      n.fx=null; n.fy=null; graphState.dragging=null;
      if(wasClick) showNodePop(n.app, e.clientX, e.clientY);
    }
  };
  canvas.onpointerleave=()=>{ if(graphState.dragging){ graphState.dragging.fx=null; graphState.dragging.fy=null; graphState.dragging=null; } };

  tick();
}

$('btnGraphReshuffle').addEventListener('click',()=>{ if(S.view==='graph') renderGraph(S.filtered); });

/* ══════════════════════════════════════════════════════════════
   TREEMAP VIEW — squarified treemap, two levels: outer rects are
   your existing clusters, inner rects are the apps within each,
   sized by local click-history relevance. Compact, well-known
   algorithm (no library needed) so it stays fast at any scale.
   ══════════════════════════════════════════════════════════════ */
function squarify(values, x, y, w, h){
  const results = new Array(values.length);
  function worst(row, len){
    const sum=row.reduce((a,b)=>a+b,0); let max=-Infinity,min=Infinity;
    for(const r of row){ if(r>max)max=r; if(r<min)min=r; }
    return Math.max((len*len*max)/(sum*sum), (sum*sum)/(len*len*min));
  }
  function layoutRow(row, idxs, x,y,w,h, vertical){
    const sum=row.reduce((a,b)=>a+b,0);
    if(vertical){ const rw=sum/h; let cy=y;
      row.forEach((v,k)=>{ const rh=v/rw; results[idxs[k]]={x,y:cy,w:rw,h:rh}; cy+=rh; });
      return {x:x+rw,y,w:w-rw,h};
    }else{ const rh=sum/w; let cx=x;
      row.forEach((v,k)=>{ const rw=v/rh; results[idxs[k]]={x:cx,y,w:rw,h:rh}; cx+=rw; });
      return {x,y:y+rh,w,h:h-rh};
    }
  }
  function recurse(vals, idxs, x,y,w,h){
    if(!vals.length) return;
    const vertical = w>=h; const len = vertical?h:w;
    let row=[vals[0]], rowIdx=[idxs[0]], i=1;
    while(i<vals.length){
      const testRow=row.concat(vals[i]);
      if(row.length===0 || worst(row,len)>=worst(testRow,len)){ row=testRow; rowIdx=rowIdx.concat(idxs[i]); i++; }
      else break;
    }
    const restVals=vals.slice(row.length), restIdx=idxs.slice(row.length);
    const nr=layoutRow(row, rowIdx, x,y,w,h,vertical);
    recurse(restVals, restIdx, nr.x, nr.y, nr.w, nr.h);
  }
  recurse(values, values.map((_,i)=>i), x,y,w,h);
  return results;
}

function renderTreemap(sorted){
  const wrap=$('treemapWrap'); wrap.innerHTML='';
  const W=wrap.clientWidth||900, H=560;
  const groups = new Map();
  for(const a of sorted){ const cid=clusterOf(a); if(!groups.has(cid))groups.set(cid,[]); groups.get(cid).push(a); }
  const clusterEntries = [...groups.entries()].map(([cid,apps])=>({
    cid, apps, value: apps.reduce((s,a)=>s+appScore(a.name)+1,0)
  })).sort((a,b)=>b.value-a.value);
  const clusterRects = squarify(clusterEntries.map(c=>c.value), 0,0,W,H);

  clusterEntries.forEach((ce,i)=>{
    const r=clusterRects[i]; if(!r||r.w<2||r.h<2) return;
    const c=CLUSTERS.find(x=>x.id===ce.cid);
    const div=document.createElement('div'); div.className='tm-cluster';
    div.style.cssText=`left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px;background:${clusterColor(ce.cid)};`;
    const lbl=document.createElement('div'); lbl.className='tm-cluster-label';
    lbl.textContent = `${c?c.emoji:'•'} ${c?c.label:'Misc'} (${ce.apps.length})`;
    div.appendChild(lbl);
    if(r.w>40 && r.h>30){
      const pad=3, headH=16;
      const ix=pad, iy=headH, iw=r.w-pad*2, ih=r.h-headH-pad;
      if(iw>10 && ih>10){
        const appsSorted=[...ce.apps].sort((a,b)=>appScore(b.name)-appScore(a.name));
        const vals=appsSorted.map(a=>appScore(a.name)+1);
        const rects=squarify(vals, ix,iy,iw,ih);
        appsSorted.forEach((a,k)=>{
          const rr=rects[k]; if(!rr||rr.w<3||rr.h<3) return;
          const tile=document.createElement('div'); tile.className='tm-app';
          tile.style.cssText=`left:${rr.x}px;top:${rr.y}px;width:${rr.w}px;height:${rr.h}px;`;
          if(rr.w>34 && rr.h>14){
            const tl=document.createElement('div'); tl.className='tm-app-label'; tl.textContent=a.display; tile.appendChild(tl);
          }
          tile.title = a.display;
          tile.onclick=(e)=>{ e.stopPropagation(); showNodePop(a, e.clientX, e.clientY); };
          div.appendChild(tile);
        });
      }
    }
    wrap.appendChild(div);
  });
  if(!clusterEntries.length) wrap.innerHTML='<div class="empty-s">No apps match.</div>';
}

/* ══════════════════════════════════════════════════════════════
   TIMELINE VIEW — apps grouped chronologically by their last
   GitHub commit (reuses the same recency data + lazy-load/cache
   strategy as the "Newest" sort, so it costs no extra API budget).
   ══════════════════════════════════════════════════════════════ */
function timelineBucket(iso){
  if(!iso) return 'Unknown date';
  const d=new Date(iso), now=new Date();
  const days=Math.floor((now-d)/86400000);
  if(days<1) return 'Today';
  if(days<2) return 'Yesterday';
  if(days<7) return 'This week';
  if(days<30) return 'This month';
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${months[d.getMonth()]} ${d.getFullYear()}`;
}
async function renderTimeline(sorted){
  const wrap=$('timelineWrap');
  if(!S.commitsLoaded && !S.commitsLoading){
    wrap.innerHTML='<div class="empty-s">⏳ Loading recency from GitHub…</div>';
    await loadCommitRecency();
    if(S.view==='timeline') renderTimeline(S.filtered);
    return;
  }
  if(S.commitsLoading){ wrap.innerHTML='<div class="empty-s">⏳ Loading recency from GitHub…</div>'; return; }

  const withDates = sorted.filter(a=>S.commitDates.has(a.name));
  const without = sorted.filter(a=>!S.commitDates.has(a.name));
  withDates.sort((a,b)=>new Date(S.commitDates.get(b.name))-new Date(S.commitDates.get(a.name)));
  const buckets = new Map();
  for(const a of withDates){ const b=timelineBucket(S.commitDates.get(a.name)); if(!buckets.has(b))buckets.set(b,[]); buckets.get(b).push(a); }
  if(without.length){ const b='Unresolved (older than scan window)'; buckets.set(b,[...(buckets.get(b)||[]), ...without.sort((x,y)=>x.display.localeCompare(y.display))]); }

  wrap.innerHTML='';
  for(const[label,apps] of buckets){
    const g=document.createElement('div'); g.className='tl-grp';
    g.innerHTML=`<div class="tl-grp-h">${escH(label)} <span class="gc">(${apps.length})</span></div>`;
    const tiles=document.createElement('div'); tiles.className='tl-tiles';
    for(const a of apps) tiles.appendChild(mkTile(a));
    g.appendChild(tiles); wrap.appendChild(g);
  }
  if(!buckets.size) wrap.innerHTML='<div class="empty-s">No apps match.</div>';
}

window.addEventListener('keydown',e=>{
  const k=(e.key||'').toLowerCase();
  const tag=(document.activeElement&&document.activeElement.tagName||'').toLowerCase();
  const typing=tag==='input'||tag==='textarea'||document.activeElement?.isContentEditable;
  if((e.ctrlKey||e.metaKey)&&k==='k'){e.preventDefault();$('searchBox').focus();$('searchBox').select();return;}
  if(k==='/'&&!typing){e.preventDefault();$('searchBox').focus();$('searchBox').select();return;}
  if(typing||e.ctrlKey||e.metaKey||e.altKey)return;
  if(k==='n'){window.open('https://github.com/AaronCWacker/AI-UI-UX-JS/new/main','_blank','noopener');return;}
  if(k==='c'){window.open('https://github.com/AaronCWacker/AI-UI-UX-JS/','_blank','noopener');return;}
  if(k==='p'){window.open('https://allaiinc.org/','_blank','noopener');return;}
});
