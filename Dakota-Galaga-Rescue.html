import * as THREE from 'three/webgpu';
import { color, positionWorld, time } from 'three/tsl';

const $=id=>document.getElementById(id), clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), rand=(a,b)=>a+Math.random()*(b-a), pick=a=>a[(Math.random()*a.length)|0];
const ui={lives:$('lives'),score:$('score'),mission:$('mission'),shots:$('shots'),kills:$('kills'),rescues:$('rescues'),best:$('best'),scores:$('scores'),chat:$('chat'),banner:$('banner'),countdown:$('countdown'),modal:$('modal'),modalTitle:$('modalTitle'),modalText:$('modalText'),modalContinue:$('modalContinue'),modalRestart:$('modalRestart'),restartTop:$('restartTop'),continueTop:$('continueTop'),gpu:$('gpu')};
const STORE={board:'dakotaGalagaACWTop10',save:'dakotaGalagaACWContinue',max:'dakotaGalagaACWMaxMission'};
function loadBoard(){try{return JSON.parse(localStorage.getItem(STORE.board)||'[]').slice(0,10)}catch{return[]}}
function saveBoard(score,mission){const b=loadBoard();b.push({name:'ACW',score:Math.floor(score),mission,time:Date.now()});b.sort((a,c)=>c.score-a.score);localStorage.setItem(STORE.board,JSON.stringify(b.slice(0,10)))}
function renderBoard(){const b=loadBoard(),rows=b.length?b:[{score:0,mission:1}];ui.scores.innerHTML='';rows.forEach(s=>{const li=document.createElement('li');li.textContent=`ACW — ${s.score.toLocaleString()} · M${s.mission}`;ui.scores.appendChild(li)});ui.best.textContent=(b[0]?.score||0).toLocaleString()}
renderBoard();
const game={lives:5,score:0,mission:1,kills:0,rescues:0,missionKills:0,missionGoal:12,shotPower:1,buddy:false,superSpawned:false,paused:false,over:false,t:0,lastShot:-99,playerCapture:null,cameraShake:0};

const scene=new THREE.Scene();scene.background=new THREE.Color(0x030712);scene.fog=new THREE.FogExp2(0x07141c,.0115);
const camera=new THREE.PerspectiveCamera(56,innerWidth/innerHeight,.1,260);camera.position.set(0,13,40);
const renderer=new THREE.WebGPURenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;document.body.prepend(renderer.domElement);await renderer.init();ui.gpu.textContent=renderer.backend?.isWebGPUBackend?'WEBGPU + TSL':'WEBGL2 FALLBACK + TSL';
scene.add(new THREE.HemisphereLight(0xa8dcff,0x49301b,2.1));const sun=new THREE.DirectionalLight(0xffd5a0,4.2);sun.position.set(-28,44,24);sun.castShadow=true;scene.add(sun);

// 3D world: terrain and Devil's Tower are deep scenery. Combat itself is one fixed Z plane.
const prairieMat=new THREE.MeshStandardNodeMaterial({roughness:.96,metalness:.01});const prairieNoise=positionWorld.x.mul(.09).sin().add(positionWorld.z.mul(.075).cos()).add(positionWorld.x.add(positionWorld.z).mul(.031).sin()).mul(.045);prairieMat.colorNode=color(0x284b29).add(prairieNoise);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(120,110,90,90),prairieMat);ground.rotation.x=-Math.PI/2;ground.position.z=-4;ground.receiveShadow=true;const pa=ground.geometry.attributes.position;for(let i=0;i<pa.count;i++){const x=pa.getX(i),y=pa.getY(i);pa.setZ(i,Math.sin(x*.1)*.16+Math.cos(y*.08)*.14+Math.sin((x+y)*.037)*.2)}pa.needsUpdate=true;ground.geometry.computeVertexNormals();scene.add(ground);
const towerMat=new THREE.MeshStandardNodeMaterial({roughness:.88,metalness:.01});towerMat.colorNode=color(0x5c3724).add(positionWorld.y.mul(2.2).sin().mul(.055)).add(positionWorld.x.mul(1.4).sin().mul(.02));
{const geo=new THREE.CylinderGeometry(5.7,8.9,24,36,22,false),p=geo.attributes.position;for(let i=0;i<p.count;i++){let x=p.getX(i),y=p.getY(i),z=p.getZ(i);if(Math.hypot(x,z)>.2){const a=Math.atan2(z,x),f=1+.052*Math.sin(a*18)+.018*Math.sin(y*3.1+a*5);p.setX(i,x*f);p.setZ(i,z*f)}}p.needsUpdate=true;geo.computeVertexNormals();const tower=new THREE.Mesh(geo,towerMat);tower.position.set(-24,11.7,-39);tower.castShadow=tower.receiveShadow=true;scene.add(tower)}
for(let i=0;i<110;i++){const h=rand(.4,1.3),blade=new THREE.Mesh(new THREE.ConeGeometry(.055,h,4),new THREE.MeshStandardMaterial({color:pick([0x365126,0x4b642b,0x5c6a31]),roughness:1}));blade.position.set(rand(-52,52),h/2,rand(-29,22));scene.add(blade)}
{const n=1000,a=new Float32Array(n*3);for(let i=0;i<n;i++){const r=rand(90,190),th=rand(0,Math.PI*2),ph=rand(.08,1.25);a[i*3]=Math.cos(th)*Math.sin(ph)*r;a[i*3+1]=Math.cos(ph)*r+40;a[i*3+2]=Math.sin(th)*Math.sin(ph)*r-30}const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(a,3));scene.add(new THREE.Points(geo,new THREE.PointsMaterial({color:0xd7eeff,size:.43})))}

const animalCatalog=[['🦬','Bison'],['🐄','Cattle'],['🦌','Deer'],['🐏','Bighorn sheep'],['🫎','Moose'],['🐺','Wolf'],['🐕','Coyote'],['🦊','Fox'],['🦡','Badger'],['🦫','Beaver'],['🦦','Otter'],['🦝','Raccoon'],['🦨','Skunk'],['🐇','Cottontail'],['🐿️','Prairie dog'],['🦅','Eagle'],['🦉','Owl'],['🦃','Turkey'],['🐦','Pheasant'],['🦆','Duck'],['🪿','Goose'],['🦢','Swan'],['🐢','Turtle'],['🐍','Rattlesnake'],['🐸','Frog'],['🐟','Walleye']];
const wisdom=['A herd survives by noticing who fell behind.','Wild places are neighborhoods, not empty space.','Big sky, small ego.','Protect the water and the prairie answers back.','A bison meets the storm head-on.','Leave enough horizon for tomorrow’s hoofprints.'];
const emojiCache=new Map(),animals=[];function emojiTexture(e){const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');x.font='170px "Apple Color Emoji","Segoe UI Emoji",sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(e,128,136);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}function emojiMap(e){if(!emojiCache.has(e))emojiCache.set(e,emojiTexture(e));return emojiCache.get(e)}
function spawnAnimal(entry=pick(animalCatalog)){const [emoji,name]=entry,obj=new THREE.Group(),s=new THREE.Sprite(new THREE.SpriteMaterial({map:emojiMap(emoji),transparent:true,depthWrite:false}));s.scale.set(2.05,2.05,1);s.position.y=1.05;obj.add(s);obj.position.set(rand(-25,25),0,rand(-1,5));scene.add(obj);animals.push({obj,emoji,name,state:'walk',dir:Math.random()<.5?-1:1,speed:rand(.25,.65),phase:rand(0,6.28),vy:0,target:null,dead:false})}for(let i=0;i<30;i++)spawnAnimal(i<8?animalCatalog[i%2]:pick(animalCatalog));

function buildPlayerShip(tint=0x2d8cab){const g=new THREE.Group(),body=new THREE.Mesh(new THREE.ConeGeometry(1.02,2.35,4),new THREE.MeshStandardMaterial({color:tint,metalness:.72,roughness:.23,emissive:0x062a34,emissiveIntensity:.8}));body.rotation.x=Math.PI;body.position.y=.72;g.add(body);const wing=new THREE.Mesh(new THREE.BoxGeometry(3.15,.18,.72),new THREE.MeshStandardMaterial({color:0x205f73,metalness:.65,roughness:.28}));wing.position.y=.48;g.add(wing);const canopy=new THREE.Mesh(new THREE.SphereGeometry(.5,14,8),new THREE.MeshPhysicalMaterial({color:0x9beeff,transparent:true,opacity:.75,roughness:.05}));canopy.position.y=1.06;g.add(canopy);return g}
const COMBAT_Z=8,LEFT=-24,RIGHT=24,player=buildPlayerShip(),buddy=buildPlayerShip(0x57bfd5);player.position.set(0,1.05,COMBAT_Z);scene.add(player);buddy.scale.setScalar(.72);buddy.visible=false;scene.add(buddy);let playerVX=0;

const enemies=[];function proc(seed,n){const x=Math.sin(seed*12.9898+n*78.233)*43758.5453123;return x-Math.floor(x)}
function buildSaucer(seed,isSuper=false){const g=new THREE.Group(),scale=isSuper?1.55:1,hue=(proc(seed,1)+game.mission*.067)%1,mat=new THREE.MeshStandardNodeMaterial({roughness:.2,metalness:.91}),base=new THREE.Color().setHSL(hue,.62,isSuper?.62:.52),emit=new THREE.Color().setHSL((hue+.12)%1,.8,.33);mat.colorNode=color(base).mul(time.mul(isSuper?4:6.5).sin().mul(.08).add(.92));mat.emissiveNode=color(emit).mul(time.mul(isSuper?7:9).sin().mul(.25).add(.42));const sides=12+Math.floor(proc(seed,2)*20),radius=(1.65+proc(seed,3)*.65)*scale,body=new THREE.Mesh(new THREE.CylinderGeometry(radius*.73,radius,.55*scale,sides),mat);g.add(body);const dome=new THREE.Mesh(new THREE.SphereGeometry((.55+proc(seed,4)*.35)*scale,16,9,0,Math.PI*2,0,Math.PI*.58),new THREE.MeshPhysicalMaterial({color:isSuper?0xf2a9ff:0xa5f0ff,transparent:true,opacity:.65,roughness:.05,metalness:.15}));dome.position.y=.28*scale;g.add(dome);const rings=1+Math.floor(proc(seed,5)*3)+(isSuper?1:0);for(let i=0;i<rings;i++){const c=new THREE.Color().setHSL((hue+.1+i*.12)%1,.82,.6),r=new THREE.Mesh(new THREE.TorusGeometry(radius*(.70+i*.10),.10*scale,7,20+Math.floor(proc(seed,7+i)*16)),new THREE.MeshStandardMaterial({color:c,emissive:c.clone().multiplyScalar(.45),emissiveIntensity:2}));r.rotation.x=Math.PI/2;r.position.y=(-.17-i*.055)*scale;g.add(r)}return g}
function makeBeam(e,col){if(e.beam)return e.beam;const b=new THREE.Mesh(new THREE.CylinderGeometry(.55,3.15,12.5,18,1,true),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.22,side:THREE.DoubleSide,depthWrite:false}));b.position.y=-6.25;b.visible=false;e.obj.add(b);e.beam=b;return b}
function spawnEnemy(kind='regular'){const isSuper=kind==='super',seed=game.mission*10000+enemies.length*113+Math.floor(Math.random()*9999),obj=buildSaucer(seed,isSuper);obj.position.set(rand(LEFT+2,RIGHT-2),isSuper?19:rand(11,20),COMBAT_Z);scene.add(obj);const hp=isSuper?Math.min(22,7+game.mission*2):1+Math.floor((game.mission-1)/4),e={obj,kind,seed,hp,dead:false,dir:Math.random()<.5?-1:1,speed:(3+game.mission*.42)*(isSuper?.78:1),phase:rand(0,6.28),baseY:obj.position.y,state:isSuper?'hunt':'patrol',actionClock:rand(2,5),beam:null,targetAnimal:null,capturedShip:null,captureTime:0};enemies.push(e);return e}
function liveRegular(){return enemies.filter(e=>!e.dead&&e.kind==='regular').length}function targetCount(){return Math.min(10,4+Math.floor(game.mission*.9))}for(let i=0;i<targetCount();i++)spawnEnemy();

const particles=[];function explode(pos,col=0x8ffff4,n=16){for(let i=0;i<n;i++){const p=new THREE.Mesh(new THREE.IcosahedronGeometry(rand(.05,.17),0),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:1}));p.position.copy(pos);p.userData.v=new THREE.Vector3(rand(-1,1),rand(-1,1),rand(-.15,.15)).normalize().multiplyScalar(rand(3,10));p.userData.life=rand(.35,.85);scene.add(p);particles.push(p)}game.cameraShake=Math.max(game.cameraShake,n*.014)}

const bullets=[],bulletGeo=new THREE.CapsuleGeometry(.11,.72,3,7),bulletMat=new THREE.MeshBasicMaterial({color:0xa0fff0});function fire(){if(game.paused||game.over||game.playerCapture)return;const cd=game.buddy?.10:.16;if(game.t-game.lastShot<cd)return;game.lastShot=game.t;const offs=game.buddy?[-.82,.82]:game.shotPower>=2?[-.54,.54]:[0];for(const ox of offs){const b=new THREE.Mesh(bulletGeo,bulletMat);b.position.set(player.position.x+ox,player.position.y+1.05,COMBAT_Z);b.userData.vy=34;b.userData.life=1.4;scene.add(b);bullets.push(b)}}

const returningShips=[];function beginCapture(e){if(game.playerCapture||game.paused||game.over)return;game.playerCapture={enemy:e};e.state='capturePlayer';e.captureTime=3;makeBeam(e,0x75ffd2).visible=true;ui.countdown.style.display='block';ui.countdown.textContent='3';log('👾🛸 SUPER SAUCER BEAM! Shoot it within 3 seconds!','boss')}

function completeCapture(e){game.playerCapture=null;ui.countdown.style.display='none';if(e.beam)e.beam.visible=false;game.lives--;e.capturedShip=buildPlayerShip(0x7495a4);e.capturedShip.scale.setScalar(.66);e.capturedShip.position.set(0,-1.2,-2);e.obj.add(e.capturedShip);e.state='carryCaptured';e.actionClock=2;player.position.set(0,1.05,COMBAT_Z);log('🚀💫 Ship captured! Reserve ship launched. Destroy that Super Saucer to recover it.','bad');updateHUD();if(game.lives<=0)endRun()}
function releaseCapturedShip(e){if(!e.capturedShip)return;const s=e.capturedShip;e.obj.remove(s);scene.add(s);s.position.copy(e.obj.position);returningShips.push(s);e.capturedShip=null;log('🚀✨ Captured ship released — floating back to dock!','good')}
function updateReturningShips(dt){for(let i=returningShips.length-1;i>=0;i--){const s=returningShips[i],target=new THREE.Vector3(player.position.x+1.7,1,COMBAT_Z);s.position.lerp(target,1-Math.pow(.002,dt));s.rotation.y+=dt*2.4;if(s.position.distanceTo(target)<.25){scene.remove(s);returningShips.splice(i,1);game.buddy=true;game.shotPower=2;buddy.visible=true;log('🚀➕🚀 Buddy ship attached — TWO-SHOT powerup!','good');updateHUD()}}}

function chooseAnimal(e){const pool=animals.filter(a=>!a.dead&&a.state==='walk');if(!pool.length)return;pool.sort((a,b)=>Math.abs(a.obj.position.x-e.obj.position.x)-Math.abs(b.obj.position.x-e.obj.position.x));const a=pool[0];e.targetAnimal=a;a.target=e;a.state='targeted';e.state='animalSeek'}
function releaseAnimal(e){const a=e.targetAnimal;if(!a)return;a.state='fall';a.vy=-.5;a.obj.position.z=COMBAT_Z;a.target=null;e.targetAnimal=null;if(e.beam)e.beam.visible=false}
function catchAnimal(a){a.state='ally';a.obj.position.y=0;a.obj.position.z=2.6;game.rescues++;game.score+=650;log(`${a.emoji}🎉 ${a.name}: "${pick(wisdom)}"`,'wise');updateHUD()}
function splatAnimal(a){a.dead=true;scene.remove(a.obj);const mark=new THREE.Mesh(new THREE.CircleGeometry(.8,16),new THREE.MeshBasicMaterial({color:0xb91822,transparent:true,opacity:.78,depthWrite:false}));mark.rotation.x=-Math.PI/2;mark.position.set(a.obj.position.x,.04,COMBAT_Z);scene.add(mark);setTimeout(()=>scene.remove(mark),2600);game.lives--;game.shotPower=2;log(`💥 ${a.emoji} missed catch. Herd stomp: weapon upgraded, one life lost.`,'bad');updateHUD();if(game.lives<=0)endRun()}

function destroyEnemy(e){if(e.dead)return;e.dead=true;if(e.targetAnimal)releaseAnimal(e);if(e.kind==='super'&&e.capturedShip)releaseCapturedShip(e);if(e.beam)e.beam.visible=false;explode(e.obj.position,e.kind==='super'?0xd686ff:0x89f7ff,e.kind==='super'?40:17);scene.remove(e.obj);game.kills++;game.missionKills++;game.score+=e.kind==='super'?4000:350+game.mission*45;if(e.kind==='super')log('👾💥 SUPER SAUCER DESTROYED!','boss');else if(game.kills%10===0&&!game.superSpawned){game.superSpawned=true;const s=spawnEnemy('super');s.obj.position.set(rand(-12,12),19,COMBAT_Z);banner('👾 SUPER SAUCER');log('👾 Ten saucers down — the Super Saucer is hunting YOU.','boss')}updateHUD();checkMission()}
function hitEnemy(e){if(e.kind==='super'&&e.state==='capturePlayer'){breakCapture(e);e.hp=Math.max(1,e.hp-1);explode(e.obj.position,0xd786ff,7);return}e.hp--;if(e.hp<=0)destroyEnemy(e);else explode(e.obj.position,e.kind==='super'?0xd786ff:0x90f8ff,4)}

function updateEnemies(dt){for(const e of enemies){if(e.dead)continue;const p=e.obj.position;e.obj.rotation.y+=dt*(e.kind==='super'?2.2:1.4);if(e.kind==='super'){if(e.state==='hunt'){p.x+=(player.position.x-p.x)*dt*.95;p.y=18+Math.sin(game.t*1.6+e.phase)*1.4;e.actionClock-=dt;if(e.actionClock<=0&&Math.abs(p.x-player.position.x)<1)beginCapture(e)}else if(e.state==='capturePlayer'){p.x+=(player.position.x-p.x)*dt*5;p.y+=(13.5-p.y)*dt*2;e.captureTime-=dt;ui.countdown.textContent=String(Math.max(1,Math.ceil(e.captureTime)));player.position.x+=(p.x-player.position.x)*dt*5;player.position.y+=dt*2.25;if(e.captureTime<=0)completeCapture(e)}else if(e.state==='stunned'){p.x+=e.dir*e.speed*dt;e.actionClock-=dt;if(p.x<LEFT+2||p.x>RIGHT-2)e.dir*=-1;if(e.actionClock<=0){e.state='hunt';e.actionClock=rand(1.4,3)}}else if(e.state==='carryCaptured'){p.x+=e.dir*e.speed*.7*dt;p.y=18+Math.sin(game.t*1.7+e.phase)*1.2;if(p.x<LEFT+2||p.x>RIGHT-2)e.dir*=-1}continue}if(e.state==='patrol'){p.x+=e.dir*e.speed*dt;p.y=e.baseY+Math.sin(game.t*(1.2+game.mission*.03)+e.phase)*1.35;if(p.x<LEFT+1||p.x>RIGHT-1)e.dir*=-1;e.actionClock-=dt;if(e.actionClock<=0){e.actionClock=rand(2.4,5.4)/Math.min(2,1+game.mission*.06);if(Math.random()<.45)chooseAnimal(e)}}else if(e.state==='animalSeek'){const a=e.targetAnimal;if(!a||a.dead){e.targetAnimal=null;e.state='patrol';continue}p.x+=(a.obj.position.x-p.x)*dt*2.2;p.y+=(12-p.y)*dt*2;if(Math.abs(p.x-a.obj.position.x)<.5){makeBeam(e,0x6effb8).visible=true;a.state='abduct';a.obj.position.z=COMBAT_Z;e.state='animalBeam';log(`🛸💚 ${a.emoji} ${a.name} in beam — line up and shoot!`,'bad')}}else if(e.state==='animalBeam'){const a=e.targetAnimal;if(!a||a.dead){e.targetAnimal=null;e.state='patrol';if(e.beam)e.beam.visible=false;continue}a.obj.position.x+=(p.x-a.obj.position.x)*dt*3;a.obj.position.y+=dt*(1.75+game.mission*.08);if(a.obj.position.y>10.5){a.dead=true;scene.remove(a.obj);e.targetAnimal=null;e.state='patrol';if(e.beam)e.beam.visible=false;log(`👽 ${a.emoji} abducted.`,'bad')}}}if(liveRegular()<targetCount()&&!game.paused&&!game.over&&Math.random()<dt*.55)spawnEnemy()}

function updateAnimals(dt){for(const a of animals){if(a.dead)continue;const p=a.obj.position;if(a.state==='walk'){p.x+=a.dir*a.speed*dt;if(p.x<-27||p.x>27)a.dir*=-1;p.y=Math.abs(Math.sin(game.t*2+a.phase))*.035}else if(a.state==='targeted'){p.x+=a.dir*.13*dt}else if(a.state==='fall'){a.vy-=13*dt;p.y+=a.vy*dt;if(p.y<=0){p.y=0;Math.abs(p.x-player.position.x)<3.2?catchAnimal(a):splatAnimal(a)}}else if(a.state==='ally'){const tx=player.position.x+Math.sin(game.t*.65+a.phase)*4;p.x+=(tx-p.x)*dt*.85;p.z+=(2.6-p.z)*dt*.8;p.y=Math.abs(Math.sin(game.t*3+a.phase))*.12}}}

const input={left:false,right:false,fire:false};addEventListener('keydown',e=>{if(['KeyA','KeyD','KeyW','KeyS','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();if(e.code==='KeyA'||e.code==='KeyW'||e.code==='ArrowLeft')input.left=true;if(e.code==='KeyD'||e.code==='KeyS'||e.code==='ArrowRight')input.right=true;if(e.code==='Space')input.fire=true});addEventListener('keyup',e=>{if(e.code==='KeyA'||e.code==='KeyW'||e.code==='ArrowLeft')input.left=false;if(e.code==='KeyD'||e.code==='KeyS'||e.code==='ArrowRight')input.right=false;if(e.code==='Space')input.fire=false});for(const btn of document.querySelectorAll('[data-input]')){const key=btn.dataset.input,down=e=>{e.preventDefault();input[key]=true;btn.classList.add('active');if(key==='fire')fire()},up=e=>{e.preventDefault();input[key]=false;btn.classList.remove('active')};btn.addEventListener('pointerdown',down);btn.addEventListener('pointerup',up);btn.addEventListener('pointercancel',up);btn.addEventListener('pointerleave',up)}renderer.domElement.addEventListener('pointerdown',e=>{if(e.button===0)fire()});
function updatePlayer(dt){if(game.playerCapture)return;const axis=(input.right?1:0)-(input.left?1:0),desired=axis*18;playerVX+=(desired-playerVX)*(1-Math.pow(.0008,dt));player.position.x=clamp(player.position.x+playerVX*dt,LEFT,RIGHT);player.position.y=1.05+Math.sin(game.t*5)*.045;if(input.fire)fire();if(game.buddy){buddy.visible=true;buddy.position.set(player.position.x+1.7,1,COMBAT_Z);buddy.rotation.z=Math.sin(game.t*3)*.05}else buddy.visible=false}
function updateBullets(dt){for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.position.y+=b.userData.vy*dt;b.userData.life-=dt;let hit=false;for(const e of enemies){if(e.dead)continue;const r=e.kind==='super'?2.9:2.05,dx=b.position.x-e.obj.position.x,dy=b.position.y-e.obj.position.y;if(dx*dx+dy*dy<r*r){hit=true;hitEnemy(e);break}}if(hit||b.userData.life<=0||b.position.y>27){scene.remove(b);bullets.splice(i,1)}}}

function saveContinue(nextMission){localStorage.setItem(STORE.save,JSON.stringify({mission:nextMission,score:Math.floor(game.score),lives:Math.max(1,game.lives),shotPower:game.shotPower,buddy:game.buddy,rescues:game.rescues,kills:game.kills}));localStorage.setItem(STORE.max,String(Math.max(nextMission,+localStorage.getItem(STORE.max)||1)))}
function checkMission(){const liveSuper=enemies.some(e=>!e.dead&&e.kind==='super');if(game.missionKills<game.missionGoal||liveSuper||game.paused||game.over)return;game.paused=true;game.score+=game.mission*1200;const next=game.mission+1;saveContinue(next);saveBoard(game.score,game.mission);renderBoard();ui.modalTitle.textContent=`🌎 Mission ${game.mission} Complete`;ui.modalText.textContent=`Mission ${next}: faster AI, tougher hulls and new procedural saucer geometry. Progress is saved in this browser.`;ui.modalContinue.style.display='';ui.modal.style.display='block';banner('MISSION COMPLETE')}
function clearEnemies(){for(const e of enemies){if(!e.dead)scene.remove(e.obj);e.dead=true}}
function startMission(m){clearEnemies();game.mission=m;game.missionKills=0;game.missionGoal=Math.min(36,10+m*2);game.superSpawned=false;game.playerCapture=null;ui.countdown.style.display='none';game.paused=false;game.over=false;scene.fog.density=clamp(.0115+m*.00055,.0115,.022);scene.background.setHSL((.59+m*.033)%1,.58,.055);player.position.set(0,1.05,COMBAT_Z);ui.modal.style.display='none';for(let i=0;i<targetCount();i++)spawnEnemy();while(animals.filter(a=>!a.dead).length<28)spawnAnimal();banner(`🌎 MISSION ${m}`);log(`🌎 Mission ${m}: saucer seed family ${m}; speed, armor and geometry evolved.`,'boss');updateHUD()}
function continueGame(){let s=null;try{s=JSON.parse(localStorage.getItem(STORE.save)||'null')}catch{}if(!s){log('💾 No saved continuation yet. Finish a mission first.','wise');return}game.score=s.score||0;game.lives=s.lives||5;game.shotPower=s.shotPower||1;game.buddy=!!s.buddy;game.rescues=s.rescues||0;game.kills=s.kills||0;startMission(s.mission||1)}
function restartGame(){game.lives=5;game.score=0;game.mission=1;game.kills=0;game.rescues=0;game.shotPower=1;game.buddy=false;game.over=false;game.paused=false;game.playerCapture=null;buddy.visible=false;localStorage.removeItem(STORE.save);startMission(1)}
function endRun(){if(game.over)return;game.over=true;game.paused=true;game.playerCapture=null;ui.countdown.style.display='none';saveBoard(game.score,game.mission);renderBoard();ui.modalTitle.textContent='🌌 Game Over';ui.modalText.textContent=`ACW scored ${Math.floor(game.score).toLocaleString()} on Mission ${game.mission}.`;ui.modalContinue.style.display=localStorage.getItem(STORE.save)?'':'none';ui.modal.style.display='block';banner('GAME OVER')}
ui.restartTop.addEventListener('click',restartGame);ui.continueTop.addEventListener('click',continueGame);ui.modalRestart.addEventListener('click',restartGame);ui.modalContinue.addEventListener('click',continueGame);
function log(text,cls=''){const d=document.createElement('div');d.className='line '+cls;d.textContent=text;ui.chat.appendChild(d);while(ui.chat.children.length>8)ui.chat.firstChild.remove();ui.chat.scrollTop=ui.chat.scrollHeight}function banner(text){ui.banner.textContent=text;ui.banner.style.opacity=1;clearTimeout(banner.timer);banner.timer=setTimeout(()=>ui.banner.style.opacity=0,1500)}function updateHUD(){ui.lives.textContent=game.lives;ui.score.textContent=Math.floor(game.score).toLocaleString();ui.mission.textContent=game.mission;ui.shots.textContent=game.buddy?2:game.shotPower;ui.kills.textContent=game.kills;ui.rescues.textContent=game.rescues;const b=loadBoard();ui.best.textContent=Math.max(b[0]?.score||0,Math.floor(game.score)).toLocaleString();ui.continueTop.style.opacity=localStorage.getItem(STORE.save)?'1':'.45'}

const clock=new THREE.Clock();function frame(){const dt=Math.min(.033,clock.getDelta());game.t+=dt;if(!game.paused&&!game.over){updatePlayer(dt);updateEnemies(dt);updateAnimals(dt);updateBullets(dt);updateReturningShips(dt);game.score+=dt*2}updateParticles(dt);const s=game.cameraShake;camera.position.set(s?rand(-s,s):0,13+(s?rand(-s*.3,s*.3):0),40);camera.lookAt(0,10,1);game.cameraShake=Math.max(0,game.cameraShake-dt*1.8);updateHUD();renderer.render(scene,camera)}renderer.setAnimationLoop(frame);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
log('🎮 A/D or ←/→ moves only left/right. SPACE fires straight up. No depth aiming.','good');log('🦬 Shoot a saucer lifting wildlife, then slide under the falling animal to catch it.','wise');log('👾 Super Saucer: once it grabs you, the 3-second timer starts. One hit breaks the beam.','boss');log('🚀 If it captures your ship, destroy it later: the ship returns, docks beside you, and gives TWO SHOTS.','good');updateHUD();
</script>
