<title>Northstar ER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  /* Layout: full-bleed 3D department; triage-tag status card on the left, order sheet on the right, tracking sheet along the bottom. Night-shift scrub teal ground, sodium-lamp amber for anything you can act on, triage-tag colors for patient state. */
  --ground:#0b1316; --panel:rgba(15,26,30,.94); --solid:#111d21; --raise:#182a2f; --raise2:#1e343a; --line:#25404a; --line2:#335a64;
  --fg:#e2ebea; --mute:#93aaab; --dim:#5f7779;
  --amber:#f2ad48; --amber-2:#ffd08a; --amber-ink:#241500;
  --paper:#e7eef0; --paper-ink:#172629; --paper-line:#c3d3d6; --paper-mute:#55686c;
  --stable:#3db27d; --guarded:#e4c447; --unstable:#ef8a3a; --critical:#e4474c; --arrest:#ff5ea0; --dead:#7a8a8f;
  --cq:#c8343a;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
  color-scheme:dark;
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--ground);color:var(--fg);font:14px/1.45 var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#app{position:relative;width:100%;height:100%;overflow:hidden}
#scene{position:absolute;inset:0}
#scene canvas{display:block;width:100%;height:100%;touch-action:none}

/* ---------- top bar ---------- */
#topbar{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:14px;padding:8px 16px;background:linear-gradient(var(--ground),rgba(11,19,22,.7) 70%,rgba(11,19,22,0));z-index:5}
.brand{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.brand .mark{width:30px;height:30px;display:grid;place-items:center;border:1.5px solid var(--amber);border-radius:50%;color:var(--amber);font-size:16px;line-height:1}
.brand b{display:block;font:700 18px/1 var(--display);letter-spacing:.08em}
.brand small{display:block;font:500 11px/1.2 var(--body);color:var(--mute);letter-spacing:.04em}
#caseInfo{flex:1 1 auto;min-width:0;display:flex;align-items:baseline;gap:12px;overflow:hidden;white-space:nowrap}
#caseInfo .ct{font:600 20px/1 var(--display);letter-spacing:.03em;overflow:hidden;text-overflow:ellipsis}
#caseInfo .clk{font:500 15px var(--mono);color:var(--amber-2);font-variant-numeric:tabular-nums}
#caseInfo .who{color:var(--mute);font-size:12px}
#topnav{display:flex;gap:4px;flex:0 1 auto;overflow-x:auto;scrollbar-width:none}
#topnav::-webkit-scrollbar{display:none}
.tb{background:transparent;border:1px solid var(--line);border-radius:var(--r);padding:6px 10px;font:600 13px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--fg);white-space:nowrap}
.tb:hover{border-color:var(--amber);color:var(--amber-2)}
.tb.on{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
.tb.rec{border-color:var(--critical);color:#ffb3b5}
.tb.rec.on{background:var(--critical);color:#fff}

/* ---------- panels ---------- */
.panel{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:8px;z-index:4;backdrop-filter:blur(6px)}
#statusPanel{left:16px;top:60px;bottom:16px;width:300px;overflow:auto;padding:0}
#actionPanel{right:16px;top:60px;bottom:16px;width:344px;overflow:auto;padding:12px}
#logPanel{left:332px;right:376px;bottom:16px;height:176px;overflow:auto;padding:10px 12px}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px}
.ph h3{margin:0;font:700 15px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.ph small{color:var(--dim);font-size:11px}

/* triage tag */
.tag{border-radius:8px;overflow:hidden}
.tag-band{display:flex;align-items:center;gap:10px;padding:10px 14px;color:#0b1316;background:var(--st)}
.tag-band .hole{width:14px;height:14px;border-radius:50%;background:var(--ground);box-shadow:inset 0 0 0 3px rgba(0,0,0,.18);flex:0 0 auto}
.tag-band .st-word{white-space:nowrap;font:700 28px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;flex:1}
.tag-band .esi{font:600 12px var(--mono)}
.st-stable{--st:var(--stable)} .st-guarded{--st:var(--guarded)} .st-unstable{--st:var(--unstable)} .st-critical{--st:var(--critical)} .st-arrest{--st:var(--arrest)} .st-deceased{--st:var(--dead)} .st-none{--st:var(--line2)}
.st-arrest .tag-band{animation:alarm 1s steps(2) infinite}
@keyframes alarm{50%{filter:brightness(1.45)}}
.tag-body{padding:12px 14px 14px;display:grid;gap:10px}
.pt-name{font:600 22px/1.05 var(--display);letter-spacing:.02em;text-wrap:balance}
.pt-meta{color:var(--mute);font-size:12px}
.cc{font-size:13px;color:var(--fg);border-left:2px solid var(--line2);padding-left:8px;font-style:italic}
.vitals{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.vt{background:var(--raise);border-radius:5px;padding:6px 7px}
.vt b{display:block;font:600 18px/1.05 var(--mono);font-variant-numeric:tabular-nums}
.vt span{font:500 10px var(--body);color:var(--mute);letter-spacing:.06em;text-transform:uppercase}
.vt.bad b{color:#ff8f92} .vt.warn b{color:var(--guarded)}
.vsrc{font:500 11px var(--mono);color:var(--dim)}
.vsrc.live{color:var(--stable)}
.pain{display:grid;grid-template-columns:repeat(11,1fr);gap:2px}
.pain i{height:8px;border-radius:2px;background:var(--raise2)}
.pain i.on{background:linear-gradient(90deg,var(--guarded),var(--critical));background-size:1100% 100%}
.lbl{font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);display:flex;justify-content:space-between;gap:6px}
.lbl em{font-style:normal;color:var(--fg);font-family:var(--mono)}
.blocks{display:flex;gap:2px;flex-wrap:wrap}
.blocks i{width:calc((100% - 22px)/12);min-width:12px;height:16px;border-radius:2px;background:var(--raise2);position:relative}
.blocks i.used{background:var(--amber)}
.blocks i.ot{background:var(--critical)}
.blocks i.ev::after{content:"";position:absolute;right:-2px;top:-4px;width:2px;height:24px;background:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font:500 11px var(--mono);padding:2px 6px;border-radius:4px;background:var(--raise);color:var(--mute)}
.chip.ok{color:var(--stable)} .chip.bad{color:#ff8f92} .chip.am{color:var(--amber-2)}
.statline{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.statline div{background:var(--raise);border-radius:5px;padding:6px 7px}
.statline b{display:block;font:600 15px var(--mono);font-variant-numeric:tabular-nums}
.statline span{font-size:10px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.locked{font-size:12px;color:var(--mute)}
.locked summary{cursor:pointer}
.empty-tag{padding:18px 16px;display:grid;gap:10px}
.empty-tag h4{margin:0;font:600 22px var(--display)}
.empty-tag p{margin:0;color:var(--mute)}

/* orders */
.codeline{display:flex;gap:6px;margin-bottom:10px}
.codeline input{flex:1;min-width:0;background:var(--raise);border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;font-family:var(--mono);text-transform:uppercase}
.btn{background:var(--raise2);border:1px solid var(--line2);border-radius:var(--r);padding:7px 11px;font-weight:500}
.btn:hover{border-color:var(--amber)}
.btn.pri{background:var(--amber);color:var(--amber-ink);border-color:var(--amber);font-weight:600}
.btn.pri:hover{background:var(--amber-2)}
.btn.danger{border-color:var(--critical);color:#ffb7b9}
.btn:disabled{opacity:.45;cursor:not-allowed}
.modes{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;font-size:12px;color:var(--mute)}
.modes label{display:flex;gap:5px;align-items:center;background:var(--raise);padding:4px 8px;border-radius:5px;cursor:pointer}
.grp{margin-bottom:10px}
.grp h4{margin:0 0 5px;font:700 12px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.act{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;width:100%;text-align:left;background:var(--raise);border:1px solid transparent;border-radius:5px;padding:6px 8px;margin-bottom:3px}
.act:hover:not(:disabled){border-color:var(--amber)}
.act:disabled{opacity:.38;cursor:not-allowed}
.act .code{font:600 11px var(--mono);color:var(--amber-2)}
.act .nm{font-size:13px;line-height:1.2;min-width:0}
.act .meta{display:flex;gap:4px;align-items:center;font:500 10px var(--mono);color:var(--mute);white-space:nowrap}
.act .loc.go{color:var(--amber)}
.act .loc.ok{color:var(--stable)}
.act.pulse{border-color:var(--amber);box-shadow:0 0 0 0 rgba(242,173,72,.6);animation:pulse 1.4s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(242,173,72,0)}}
.act.done .nm::after{content:" ✓";color:var(--stable)}
.dcbtn{width:100%;margin-top:6px;padding:10px;font:700 16px var(--display);letter-spacing:.08em;text-transform:uppercase}

/* tracking sheet */
.log{font:12px/1.4 var(--mono);display:grid;gap:2px}
.lr{display:grid;grid-template-columns:48px 44px minmax(0,1.1fr) 70px minmax(0,2fr);gap:8px;padding:3px 6px;border-radius:4px;background:var(--raise)}
.lr.ot{background:rgba(228,71,76,.16)}
.lr.ev{background:rgba(242,173,72,.1)}
.lr .s{color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lr .c{color:var(--amber-2)}

/* tutorial */
#tutorial{position:absolute;left:332px;top:60px;max-width:440px;z-index:4;background:var(--panel);border:1px solid var(--amber);border-radius:8px;padding:10px 12px;font-size:13px}
#tutorial b{font:700 13px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--amber)}
#tutorial ol{margin:6px 0 0;padding-left:20px}
#tutorial li.done{color:var(--dim);text-decoration:line-through}
#tutorial li.cur{color:var(--amber-2)}

/* toast + hint */
#toast{position:absolute;left:50%;bottom:206px;transform:translateX(-50%);z-index:20;display:grid;gap:6px;pointer-events:none;width:min(440px,calc(100% - 32px))}
.tt{background:var(--solid);border:1px solid var(--line2);border-radius:6px;padding:8px 12px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:tin .2s}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}
#hint{position:absolute;left:50%;bottom:204px;transform:translateX(-50%);font:500 11px var(--mono);color:var(--dim);z-index:3;pointer-events:none;white-space:nowrap}
#walkBadge{position:absolute;left:50%;top:104px;transform:translateX(-50%);z-index:6;background:var(--amber);color:var(--amber-ink);font:600 13px var(--display);letter-spacing:.06em;padding:5px 12px;border-radius:20px}

/* cards */
#cardLayer{position:absolute;inset:0;z-index:30;display:grid;place-items:center;background:rgba(5,10,12,.55);padding:16px}
.cardwrap{width:min(460px,100%);display:grid;gap:10px;perspective:1200px}
.card{border-radius:10px;padding:18px 20px;box-shadow:0 18px 50px rgba(0,0,0,.5);animation:cin .25s ease-out}
@keyframes cin{from{opacity:0;transform:translateY(14px) rotate(-1deg)}}
.card .eb{font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;opacity:.75;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}
.card h3{margin:0 0 8px;font:700 26px/1.05 var(--display);letter-spacing:.02em;text-wrap:balance}
.card p{margin:0 0 6px}
.card.story,.card.paper{background:var(--paper);color:var(--paper-ink);background-image:repeating-linear-gradient(transparent 0 25px,var(--paper-line) 25px 26px);background-position:0 46px}
.card.story blockquote{margin:0;font:400 18px/26px var(--body)}
.card.story .who{font:700 15px var(--display);letter-spacing:.08em;text-transform:uppercase;color:#7a4b06}
.card.note{background:var(--solid);border:1px solid var(--line2)}
.card.warn{background:#2a1a10;border:1px solid var(--unstable);color:#ffd9b8}
.card.hint{background:#14262a;border:1px dashed var(--line2);color:var(--mute);font-size:13px}
.card.event{background:#2a2310;border:1px solid var(--amber);color:#ffe6bd}
.card.cq{background:#2a0f12;border:2px solid var(--cq);color:#ffd5d7}
.card.cq h3{color:#ff8f93}
.card table{width:100%;border-collapse:collapse;font:13px var(--mono);font-variant-numeric:tabular-nums}
.card td{padding:4px 6px;border-bottom:1px solid rgba(0,0,0,.12);vertical-align:top}
.card.note td{border-color:var(--line)}
.card td.f{font-weight:600;color:#b4231f;width:18px}
.card .foot{margin-top:8px;font-size:13px;opacity:.85}
.flip{position:relative;display:grid;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,.7,.3,1)}
.flip.flipped{transform:rotateY(180deg)}
.flip .face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip .back{transform:rotateY(180deg)}
.flip .front{background:var(--raise2);border:2px solid var(--amber);color:var(--amber-2);display:grid;place-items:center;min-height:160px;font:700 40px var(--display);letter-spacing:.1em}
.cardnav{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--mute);font:500 12px var(--mono)}

/* real-time injection */
#rtLayer{position:absolute;inset:0;z-index:40;display:grid;place-items:center;background:rgba(40,0,10,.72);padding:16px}
.rt{width:min(520px,100%);background:#1b070b;border:2px solid var(--arrest);border-radius:12px;padding:20px;display:grid;gap:12px;box-shadow:0 0 60px rgba(255,94,160,.35)}
.rt h2{margin:0;font:700 34px/1 var(--display);letter-spacing:.06em;color:var(--arrest)}
.rt .bar{height:10px;background:#3a1420;border-radius:5px;overflow:hidden}
.rt .bar i{display:block;height:100%;background:var(--arrest);width:100%}
.rt .secs{font:600 28px var(--mono);color:#fff}
.rt .ch{display:grid;gap:8px}
.rt .ch button{text-align:left;background:#2c0e16;border:1px solid #6a2338;border-radius:8px;padding:12px;color:#ffe3ec}
.rt .ch button:hover{border-color:var(--arrest)}

/* modal */
#modal{position:absolute;inset:0;z-index:50;display:grid;place-items:center;background:rgba(4,9,11,.7);padding:16px}
.mbox{position:relative;width:min(900px,100%);max-height:100%;overflow:auto;background:var(--solid);border:1px solid var(--line2);border-radius:12px;padding:22px 24px}
.mbox.narrow{width:min(560px,100%)}
.mx{position:absolute;right:12px;top:10px;background:none;border:none;font-size:26px;color:var(--mute);line-height:1;padding:4px 8px}
.mbox h2{margin:0 0 4px;font:700 32px/1.05 var(--display);letter-spacing:.03em;text-wrap:balance}
.mbox h3{margin:18px 0 6px;font:700 17px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--amber-2)}
.mbox p,.mbox li{max-width:68ch}
.sub{color:var(--mute);margin:0 0 14px}
.tbl{overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding:6px 8px;border-bottom:1px solid var(--line2)}
.tbl td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.m{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.num{font-variant-numeric:tabular-nums}

/* envelopes */
.envs{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin:14px 0}
.env{position:relative;text-align:left;background:#c9b48a;color:#2b2112;border:none;border-radius:6px;padding:14px 14px 16px;min-height:178px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.env::before{content:"";position:absolute;left:0;right:0;top:0;height:58px;background:linear-gradient(to bottom right,transparent 49.5%,rgba(0,0,0,.12) 50%),linear-gradient(to bottom left,transparent 49.5%,rgba(0,0,0,.12) 50%);background-size:50% 100%;background-position:left,right;background-repeat:no-repeat}
.env .no{font:700 13px var(--mono);letter-spacing:.1em;position:relative}
.env .seal{position:absolute;right:14px;top:30px;width:40px;height:40px;border-radius:50%;background:#8e1f24;box-shadow:inset 0 0 0 4px #a8292f;display:grid;place-items:center;color:#f4c9b0;font:700 18px var(--display)}
.env h4{margin:auto 0 0;font:700 21px/1.05 var(--display);text-wrap:balance}
.env .d{font:600 12px var(--mono);letter-spacing:.2em}
.env .gr{font:700 13px var(--mono)}
.env.sealed{background:#a8956c;cursor:not-allowed;opacity:.85}
.env.open{background:#e3d2ac}
.env:hover:not(.sealed){outline:2px solid var(--amber);outline-offset:2px}
.settings{display:flex;flex-wrap:wrap;gap:10px;font-size:13px;color:var(--mute)}
.settings label{display:flex;align-items:center;gap:6px;background:var(--raise);padding:6px 10px;border-radius:6px;cursor:pointer}
.field{display:grid;gap:4px;margin-bottom:10px}
.field label{font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.field input,.field select,.field textarea{background:var(--raise);border:1px solid var(--line2);border-radius:6px;padding:8px 10px;width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>*{flex:1 1 180px;min-width:0}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.opt{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-radius:6px;background:var(--raise);margin-bottom:4px;cursor:pointer}
.opt input{margin-top:3px}
.grade{font:700 88px/0.9 var(--display);color:var(--amber)}
.verdict{font:600 22px/1.15 var(--display);letter-spacing:.02em;text-wrap:balance}
.pos{color:var(--stable)} .neg{color:#ff8f92}
details{background:var(--raise);border-radius:8px;padding:10px 14px;margin-top:10px}
details summary{cursor:pointer;font:600 15px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--amber-2)}
.pamph{display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px}
.pamph nav{display:grid;gap:4px;align-content:start}
.pamph nav button{text-align:left;background:var(--raise);border:1px solid transparent;border-radius:6px;padding:8px 10px;font-size:13px}
.pamph nav button.on{border-color:var(--amber);color:var(--amber-2)}
.pamph article{background:var(--paper);color:var(--paper-ink);border-radius:8px;padding:18px 22px;min-width:0}
.pamph article h3{color:#6d3f02;margin-top:0}
.pamph article p{line-height:1.6}
.roster{display:grid;gap:6px;margin:10px 0}
.roster div{display:flex;gap:8px;align-items:center;background:var(--raise);border-radius:6px;padding:6px 10px}
.dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.chat{height:140px;overflow:auto;background:var(--raise);border-radius:6px;padding:8px;font-size:13px}
.big-code{font:700 34px var(--mono);letter-spacing:.2em;color:var(--amber-2)}
.gallery{display:grid;gap:6px}
.gi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;background:var(--raise);border-radius:6px;padding:8px 10px}
.gi .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:500 13px var(--mono)}
.gi .a{display:flex;gap:4px}
.prog{height:8px;background:var(--raise2);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--amber)}
.player video,.player audio{width:100%;max-height:300px;border-radius:6px;background:#000}
.tele{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.tele div{background:var(--raise);border-radius:6px;padding:8px 10px}
.tele b{display:block;font:600 17px var(--mono);font-variant-numeric:tabular-nums}
.tele span{font-size:11px;color:var(--mute)}
.tele small{display:block;font:11px var(--mono);color:var(--dim)}
.kv{font:12px var(--mono);columns:2 260px;column-gap:20px}
.kv div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:2px 0;break-inside:avoid}
.kv span{color:var(--mute)}

/* mobile */
#mobtabs{display:none}
@media (max-width:1600px){ #caseInfo .who{display:none} .tb{padding:6px 8px} }
@media (max-width:900px){
  #statusPanel,#actionPanel,#logPanel{display:none;left:8px;right:8px;width:auto;top:auto;bottom:62px;height:auto;max-height:60%}
  #app.sh-status #statusPanel,#app.sh-actions #actionPanel,#app.sh-log #logPanel{display:block}
  #mobtabs{display:flex;position:absolute;left:8px;right:8px;bottom:8px;z-index:6;gap:6px;padding-bottom:env(safe-area-inset-bottom,0px)}

/* ---------------- Research pamphlets (Library) ---------------- */
const PAMPH = [
 {id:'co', t:'Carbon Monoxide: The Ice-House Hazard', b:[
  'Carbon monoxide (CO) is colorless and odorless. It binds hemoglobin roughly 200 times more tightly than oxygen, so even small concentrations crowd oxygen out of the blood. It also poisons mitochondria directly, which is why symptoms can outlast the exposure.',
  'Early symptoms look like a viral illness: headache, nausea, vomiting, dizziness, fatigue. The giveaways are clustering and context — several people (or pets) sick at once, symptoms that improve away from home, and a fuel-burning heater, generator, or engine in an enclosed space. Minnesota sees this every winter in fish houses, cabins and garages.',
  'Diagnosis is carboxyhemoglobin (COHb) measured by co-oximetry on a blood gas. Non-smokers normally run below about 3%. The level you measure depends on when you draw it: COHb falls with a half-life of roughly 4–5 hours on room air, about 60–90 minutes on 100% oxygen, and far faster in a hyperbaric chamber.',
  'Treatment starts the moment you suspect it: 100% oxygen by non-rebreather. Hyperbaric oxygen is commonly considered when there was loss of consciousness, neurological findings (confusion, ataxia, seizure), signs of cardiac injury, severe acidosis, a COHb above about 25%, or pregnancy with a lower threshold. Check an ECG and troponin — CO injures heart muscle.',
  'Delayed neurological sequelae (memory, mood, movement problems) can appear days to weeks after recovery. Every patient needs return precautions, and everyone who shared the air needs evaluation.']},
 {id:'spo2', t:'Pulse Oximetry: What the Probe Can’t See', b:[
  'A standard pulse oximeter shines two wavelengths of light through tissue. Carboxyhemoglobin absorbs light almost exactly like oxyhemoglobin, so the probe reads it as “saturated.” A CO-poisoned patient can show an SpO₂ of 97–100% while their true oxygen content is dangerously low.',
  'The clue is a saturation gap: a normal SpO₂ next to a low measured SaO₂ on a co-oximetry blood gas. Methemoglobin causes a different artifact, pulling readings toward 85%.',
  'Oximeters also struggle with cold, vasoconstricted fingers (hypothermia, shock) and can overestimate saturation in people with darker skin. Treat the patient, not the number.']},
 {id:'shock', t:'Hemorrhagic Shock & the Trauma Bay', b:[
  'Young, healthy patients compensate for blood loss with tachycardia and vasoconstriction until they suddenly cannot. A heart rate above 110 with cool skin and a narrowed pulse pressure after high-energy trauma is shock until proven otherwise. Early hemoglobin can be normal: it takes time and fluid for the number to fall.',
  'The extended FAST exam finds free fluid in the abdomen in minutes at the bedside. A positive FAST in an unstable patient means the operating room, not the CT scanner. CT is for patients who are stable enough to leave the resuscitation bay.',
  'Replace blood with blood. Massive transfusion protocols deliver plasma, platelets and red cells in balanced ratios. Limit crystalloid — more than about a liter dilutes clotting factors and worsens the lethal triad of acidosis, hypothermia and coagulopathy. Tranexamic acid helps when given within three hours of injury.',
  'Avoid drugs that worsen bleeding: anticoagulants and NSAIDs such as ketorolac. Fentanyl in small titrated doses treats pain without large swings in blood pressure.',
  'Splenic injury classically causes left upper quadrant pain and sometimes referred left-shoulder pain (Kehr’s sign) from blood irritating the diaphragm.']},
 {id:'preg', t:'Trauma in Early Pregnancy & Rh Status', b:[
  'Every woman of childbearing age gets a pregnancy test early in a trauma evaluation. Patients may not know, may be mistaken (missed pills happen), or may not want to say. A positive test does not stop life-saving imaging — the mother comes first — but it changes counseling, medication choices and consultant involvement.',
  'NSAIDs are generally avoided in pregnancy. An Rh-negative pregnant patient with abdominal trauma needs Rh immune globulin within 72 hours to prevent alloimmunization. Type and crossmatch tells you the Rh status.',
  'OB/GYN joins once pregnancy is confirmed: they confirm location and viability and set the plan for monitoring.']},
 {id:'stemi', t:'STEMI: Time Is Muscle', b:[
  'Chest pain or an anginal equivalent gets a 12-lead ECG within 10 minutes of arrival. ST elevation in a coronary territory with reciprocal depression is a STEMI; the treatment is opening the artery, ideally by primary PCI with a door-to-balloon time of 90 minutes or less.',
  'Do not wait for troponin to activate the cath lab. Troponin can be normal in the first hour of an occlusion; the ECG makes the diagnosis.',
  'Inferior STEMI (II, III, aVF) often comes from the right coronary artery and can involve the right ventricle. Check right-sided leads (V4R). A right ventricular infarct is preload-dependent: clear lungs with distended neck veins and hypotension respond to fluids and are made dramatically worse by nitrates.',
  'Give aspirin early. Supplemental oxygen helps only when saturation is low; in non-hypoxic patients it has not shown benefit. Ventricular fibrillation is most common in the first hours — keep the patient on a monitor with pads within reach.']},
 {id:'pde5', t:'Nitrates & PDE5 Inhibitors: A Deadly Pair', b:[
  'Sildenafil and vardenafil (within 24 hours) and tadalafil (within 48 hours) block the breakdown of cGMP. Nitroglycerin raises cGMP. Together they produce severe, sometimes refractory hypotension.',
  'Patients often omit these medications out of embarrassment. Ask directly and privately, check pharmacy fill history, and listen to family members. When in doubt, treat chest pain with aspirin, opioids and reperfusion rather than nitrates.']},
 {id:'dka', t:'DKA: Fluids, Potassium, Insulin — in That Order', b:[
  'Diabetic ketoacidosis is insulin deficiency: high glucose, ketones, and an anion-gap metabolic acidosis. Patients are profoundly dry, breathe deeply and rapidly (Kussmaul respiration), and their breath may smell fruity. Abdominal pain is common and often resolves with treatment.',
  'Start with isotonic fluids. Check potassium before insulin. Total-body potassium is always depleted even when the serum level looks normal or high, because acidosis shifts it out of cells. If potassium is below 3.3 mmol/L, replace it and hold insulin. Between 3.3 and about 5.2, give insulin and replace potassium alongside. Above that, start insulin and recheck often.',
  'Insulin drives potassium back into cells, so levels fall quickly once the drip runs. Watch the ECG: peaked T waves mean high potassium; flat T waves and U waves mean low.',
  'Glucose falls faster than ketones clear. When glucose drops below about 250 mg/dL, add dextrose so insulin can keep running until the anion gap closes. DKA on an insulin infusion belongs in an ICU or step-down unit.',
  'Common triggers: infection, missed insulin, new diabetes — and cost-related insulin rationing.']},
 {id:'mninsulin', t:'Insulin Affordability in Minnesota', b:[
  'Minnesota’s Alec Smith Insulin Affordability Act (2020) is named for a 26-year-old Minnesotan who died of DKA while rationing insulin after aging off his parents’ coverage.',
  'The law created an urgent-need program, which lets eligible residents get a 30-day supply at a pharmacy for a capped copay (set at $35 when the law passed), and a continuing safety-net program for longer-term access through manufacturers.',
  'Ask every person with diabetes whether cost has ever made them skip or stretch insulin. Social workers and pharmacists can enroll patients before they leave the department. Program details change; check the current state program terms with the patient.']},
 {id:'hypo', t:'Accidental Hypothermia: Not Dead Until Warm and Dead', b:[
  'A common staging divides hypothermia by core temperature: mild 32–35 °C (shivering, alert), moderate 28–32 °C (shivering stops, confusion), severe below 28 °C (unconscious, slow pulse), and profound below 24 °C. Use an esophageal or bladder probe; oral and skin temperatures are useless here.',
  'Confused hypothermic patients may undress (paradoxical undressing) and insist they are hot. Their history is unreliable.',
  'The cold heart is irritable. Below about 28–30 °C, rough handling and sudden movement can trigger ventricular fibrillation. Keep the patient horizontal, move gently, and cut off wet clothes.',
  'Rewarm the core: forced-air blankets on the trunk, warmed IV fluids, warm humidified oxygen. Do not rub or heat the arms and legs — that returns cold, acidotic blood to the core and drops core temperature further (afterdrop). For severe hypothermia with instability or arrest, extracorporeal rewarming (ECMO) is the treatment of choice.',
  'In arrest below 30 °C, many protocols limit shocks to three and hold epinephrine until the core warms, because the cold heart does not respond and drugs accumulate. Deep hypothermia protects the brain: patients have survived hours of CPR. Markedly elevated potassium and evidence of asphyxia before cooling are among the few markers suggesting futility; tools such as the HOPE score help decide on ECMO.']},
 {id:'thiamine', t:'Thiamine Before Glucose', b:[
  'Check a fingerstick glucose on every patient with altered mental status — it takes a minute and hypoglycemia is easy to fix.',
  'In patients at risk of thiamine deficiency (heavy alcohol use, malnutrition, homelessness), give thiamine with or before dextrose. Glucose metabolism consumes thiamine and can precipitate Wernicke encephalopathy: confusion, eye movement problems and unsteady gait.']},
 {id:'pain', t:'Pain, Trust & the History', b:[
  'A patient in severe pain cannot give a good history. Treating pain early is not a reward for good behavior; it is how you get the information you need. Titrated opioids do not mask surgical diagnoses.',
  'Patients leave things out for many reasons: embarrassment, fear, cost, not knowing it matters. Family members, EMS, shelter staff and pharmacy fill records are independent sources. Cross-check what the patient says against what the tests show.',
  'Use a qualified medical interpreter, not a family member, whenever the patient or family prefers another language. Minnesota has large Hmong, Somali, Karen and Spanish-speaking communities; on-demand video interpreters are standard in Minnesota EDs.']}
];

function coHb(s){ const A=28; if(!s.f.o2) return A*Math.pow(.5,s.t/320); const t0=s.f.o2t; return A*Math.pow(.5,t0/320)*Math.pow(.5,(s.t-t0)/80); }

/* DKA physiology (case 4) */
function dkaInsB(s){ return s.f.insB!=null ? Math.max(0,s.blocks-s.f.insB) : 0; }
function dkaK(s){ return 5.6 - 0.2*Math.min(s.f.fluids||0,3) - 0.45*dkaInsB(s) + (s.f.kB!=null?0.4+0.4*Math.max(0,s.blocks-s.f.kB):0) + 0.4*(s.f.kDoses||0); }
function dkaGraw(s){ return 486 - 25*Math.min(s.f.fluids||0,3) - 70*dkaInsB(s); }
function dkaG(s){ return Math.max(42, dkaGraw(s) + (s.f.dexB!=null?100+60*Math.max(0,s.blocks-s.f.dexB):0)); }
function dkaAG(s){ return Math.max(11, 28 - 3*dkaInsB(s)); }

/* Hypothermia physiology (case 5) */
function hypoBase(t){ if(t<=24) return 86; if(t<28) return 70-(t-24)*3.5; if(t<32) return 56-(t-28)*7; if(t<35) return 28-(t-32)*5; return 12; }
function hypoGCS(s){ const t=s.f.temp; let g = t<28?9: t<30?11: t<32?13: t<34?14:15; if((s.f.adj||0)>14) g-=1; if(!s.f.dex) g-=0; return Math.max(3,g); }

   essay:'Carbon monoxide is one of the oldest emergencies in northern medicine and still one of the most missed, because it imitates the flu in the season when everyone has the flu. The diagnosis lives in the history: fuel-burning appliances, enclosed spaces, clusters of illness, and symptoms that ease away from home. The physiology has two edges. CO crowds oxygen off hemoglobin and shifts the dissociation curve so the oxygen that is carried is released less readily, and it poisons the cell’s mitochondria directly, which is why some patients develop memory and movement problems weeks after their blood level returns to normal. The pulse oximeter cannot help you; the co-oximeter can. And the most important treatment — oxygen — is also free, fast, and diagnostic in its own way: patients who feel better on the mask are telling you something.'};

  if((key==='defib'||key==='cpr') && st!=='arrest') return {ok:false,why:'Legal only during cardiac arrest.'};
  if(st==='arrest' && !ARREST_OK.includes(key)) return {ok:false,why:'Cardiac arrest: only resuscitation actions are legal.'};
  if(s.away && !AWAY_OK.includes(key)) return {ok:false,why:'The patient has left the ED for definitive care.'};

function defaultRes(key,s,a,c){

function tickBlock(s,c,a,b){

function doAction(key,by){

function computeScore(s,c,form){
  const L=[]; let total=0, max=0;
  const add=(cat,label,pts,m)=>{ L.push({cat,label,pts}); total+=pts; if(m) max+=m; };
  const st=stateOf(s);
  add('Outcome',`Patient ${STATE_LABEL[st].toLowerCase()} at handoff`,{stable:30,guarded:22,unstable:12,critical:5,arrest:0,deceased:0}[st],30);
  const D=c.score.dx;
  if(form.dx===D.correct) add('Diagnosis','Correct primary diagnosis',20,20);
  else if(D.partial[form.dx]) add('Diagnosis','Close, but not the primary diagnosis',D.partial[form.dx],20);
  else add('Diagnosis','Primary diagnosis incorrect',0,20);
  c.score.findings.forEach((f,i)=>{ const truth=typeof f.ok==='function'?f.ok(s):f.ok; const picked=form.findings.includes(i);
    if(truth){ max+=f.pts; if(picked) add('Findings',f.t,f.pts); }
    else if(picked) add('Findings','Not present: '+f.t,f.pts); });
  c.score.keyTx.forEach(k=>{ const did=k.check?k.check(s):!!s.done[k.k]; max+=k.pts;
    if(k.avoid){ add('Treatment',(did?'Did not avoid: ':'')+k.label, did?0:k.pts); return; }
    if(k.when && !k.when(s)){ add('Treatment',k.label+' (not indicated)',k.pts); return; }
    add('Treatment',(did?'':'Missed: ')+k.label, did?k.pts:0); });
  c.score.best.forEach(k=>{ max+=2; const d=!!s.done[k]; add('Best practice',(d?'':'Skipped: ')+ACT[k].code+' '+ACT[k].name, d?2:-3); });
  const dp=c.score.dispo(s); max+=6;
  if(form.dispo===dp.c) add('Disposition',form.dispo,6); else if(dp.ok.includes(form.dispo)) add('Disposition',form.dispo+' (acceptable)',2); else add('Disposition',(form.dispo||'None')+' (wrong destination)',-4);
  max+=4; if(s.away && s.pain>3) add('Pain','Pain handed off to the receiving team ('+s.pain+'/10)',0); else if(s.pain<=3) add('Pain','Pain controlled ('+s.pain+'/10)',4); else if(s.pain>=7) add('Pain','Left in severe pain ('+s.pain+'/10)',-5); else add('Pain','Pain partly controlled ('+s.pain+'/10)',0);
  s.cq.forEach(id=>add('Consequences',id+' '+CQ[id].t,-4));
  if(s.overtime) add('Time',`${s.overtime} overtime block${s.overtime>1?'s':''}`,-3*s.overtime);
  const over=s.bill-c.billTarget; if(over>0){ const p=-Math.min(10,Math.floor(over/1500)); if(p) add('Bill',`$${over.toLocaleString()} over a reasonable workup`,p); }
  c.score.recs.forEach((r,i)=>{ if(r.pts>0) max+=r.pts; if(form.recs.includes(i)) add('Recommendations',r.t,r.pts); });
  const txt=(form.text||'').toLowerCase(); const hits=c.score.bonus.filter(w=>txt.includes(w)); const bon=Math.min(6,hits.length*2);
  if(bon) add('Bonus',`Out-of-the-box recommendations (${hits.slice(0,4).join(', ')})`,bon);
  (c.score.extra?c.score.extra(s):[]).forEach(([l,p])=>add('Bonus',l,p));
  const pct=Math.max(0,Math.min(100,Math.round(100*total/Math.max(1,max))));
  const grade=pct>=90?'A':pct>=80?'B':pct>=70?'C':pct>=60?'D':'F';
  return {lines:L,total,max,pct,grade};
}
function endCase(form,by){
  const s=G.s, c=CASE(); if(!s||s.ended) return;
  const out=[]; const a=mkApi(s,c,out);
  const handled = c.discharge && c.discharge(s,form,a);
  if(!handled && form.dx!==c.score.dx.correct && form.dispo==='Discharge home') a.cq('CQ-16');
  if(s.pain>=7 && !s.dead && !s.away) a.cq('CQ-17');
  const R=computeScore(s,c,form);
  R.form=form; R.epi=c.epilogue(s,form,R);
  R.verdict = s.dead ? (s.cq.length?'Guilt. The consequence deck shows where it turned.':'You fought for this one and lost.') :
              R.pct>=85 ? 'Triumph. You saved '+c.patient.short+' and found the real cause.' :
              R.pct>=65 ? c.patient.short+' made it. The chart has a few things you would do differently.' :
              c.patient.short+' survived the shift, but not because of the plan.';
  s.result=R; s.ended=true; s.endBy=by||G.name;

function cellOf(x,z){ return [Math.floor((x-GRID.x0)/GRID.cs), Math.floor((z-GRID.z0)/GRID.cs)]; }
function walkable(x,z){ const [i,j]=cellOf(x,z); if(i<0||j<0||i>=GRID.nx||j>=GRID.nz) return false; return !GRID.b[j*GRID.nx+i]; }

function astar(sx,sz,tx,tz){

  const g=GRID,N=g.nx; let [si,sj]=nearestFree(...cellOf(sx,sz)); let [ti,tj]=nearestFree(...cellOf(tx,tz));
  const start=sj*N+si, goal=tj*N+ti; const gS=new Float32Array(N*g.nz).fill(1e9); const from=new Int32Array(N*g.nz).fill(-1); const closed=new Uint8Array(N*g.nz);

function los(a,b){ const d=Math.hypot(b.x-a.x,b.z-a.z), n=Math.ceil(d/0.2); for(let i=1;i<=n;i++){ const t=i/n; if(!walkable(a.x+(b.x-a.x)*t,a.z+(b.z-a.z)*t)) return false; } return true; }

    if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y); if(pinch0){ W.dist=clamp(W.dist*pinch0/d,3.5,42); } pinch0=d; return; }
    if(down){ const dx=e.clientX-prev.x, dy=e.clientY-prev.y; if(Math.abs(e.clientX-down.x)+Math.abs(e.clientY-down.y)>5) down.moved=true; if(down.moved&&!W.plan){ W.yaw-=dx*0.006; W.pitch=clamp(W.pitch+dy*0.004,0.18,1.45); } } });

  el.addEventListener('pointerup',up); el.addEventListener('pointercancel',up);
  el.addEventListener('wheel',e=>{ e.preventDefault(); W.dist=clamp(W.dist*(1+e.deltaY*0.0011),3.5,42); },{passive:false});

/* ---------------- case start ---------------- */
function startCase(i){
  if(NET.client) return toast('The host opens envelopes for the team.');
  if(!unlocked(i)) return toast('This envelope is still sealed. Finish the one before it.');
  G.ci=i; G.s=newCaseState(i); G.seen=0; G.shownResult=false; G.rtSeq=null; G.tutHide=false; CQUEUE.length=0;
  closeModal(); worldSetCase(); W.lastAnimLog=G.s.log.length-1;
  const c=CASE(); W.player.position.set(0,0,6.2); toast(`${c.patient.name} is in ${SLOT_NAME[c.room]}.`);
  AU.page();
  afterChange();
}

/* ---------------- discharge ---------------- */
function permute(n,seed){ return Array.from({length:n},(_,i)=>i).sort((a,b)=>((a*7+seed)%n)-((b*7+seed)%n)); }
function openDischarge(){
  const c=CASE(), s=G.s; if(!c||!s||s.ended) return;
  const S=c.score; const tx=s.log.filter(e=>ACT[e.key]&&['Treatment','Medication','Consult'].includes(ACT[e.key].cat)).map(e=>`${e.code} ${e.name} (${clockStr(c,e.t)})`);
  const recOrder=permute(S.recs.length,3), fOrder=permute(S.findings.length,2);
  openModal(`<h2>Disposition & discharge — D-01</h2><p class="sub">${esc(c.patient.name)}, ${c.patient.age}${c.patient.sex}. Scoring criteria stay sealed until you sign. ${s.blocks>s.budget?`<b class="neg">You are ${s.overtime} block${s.overtime>1?'s':''} into overtime.</b>`:''}</p>
   <form id="dcForm"><div class="cols2"><div>
    <h3>1 · Primary diagnosis</h3>${S.dx.opts.map((o,i)=>`<label class="opt"><input type="radio" name="dx" value="${i}" ${i===0?'':''}> <span>${esc(o)}</span></label>`).join('')}
    <h3>2 · Additional findings</h3>${fOrder.map(i=>`<label class="opt"><input type="checkbox" name="fd" value="${i}"> <span>${esc(S.findings[i].t)}</span></label>`).join('')}
    <h3>3 · Disposition</h3><div class="field"><select id="dispo" aria-label="Disposition">${['',...DISPOS].map(d=>`<option value="${esc(d)}">${d||'Choose a destination…'}</option>`).join('')}</select></div>
   </div><div>
    <h3>4 · Treatments given</h3>${tx.length?`<ul style="margin:0;padding-left:18px;font:12px var(--mono)">${tx.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:'<p class="sub">None recorded.</p>'}
    <h3>5 · Recommendations</h3>${recOrder.map(i=>`<label class="opt"><input type="checkbox" name="rc" value="${i}"> <span>${esc(S.recs[i].t)}</span></label>`).join('')}
    <div class="field"><label for="recText">Your own recommendations (free text)</label><textarea id="recText" rows="3" placeholder="Anything else this patient or family should do?"></textarea></div>
   </div></div>
   <div class="row" style="margin-top:12px"><button class="btn pri" type="submit" style="flex:0 0 auto">Sign & discharge</button><span class="sub" style="margin:0">${s.dead?'The patient has died. Document what happened.':s.away?'The patient has left the department.':'The patient is still in your ED.'}</span></div></form>`);
  $('dcForm').onsubmit=e=>{ e.preventDefault(); const fd=new FormData(e.target); const dx=fd.get('dx'); if(dx==null) return toast('Choose a primary diagnosis.'); const dispo=$('dispo').value; if(!dispo) return toast('Choose a disposition.');
    const form={dx:+dx,findings:fd.getAll('fd').map(Number),dispo,recs:fd.getAll('rc').map(Number),text:$('recText').value.slice(0,600)};
    closeModal(); if(NET.client){ NET.send({type:'dc',form}); return; } endCase(form,G.name); afterChange(); };
}

/* ---------------- results ---------------- */

/* ---------------- rulebook ---------------- */
function openRules(){
  openModal(`<h2>Northstar ER — Rulebook</h2><p class="sub">A cooperative, deterministic emergency-medicine game. You are trying to save a life, not catch a killer.</p>
  <h3>Objective</h3><p>Each sealed envelope delivers one patient to a real room in the department. Investigate, treat, and decide when you know enough to sign the discharge form. Your score stays hidden until you sign.</p>
  <h3>The shift clock</h3><p>Every case has a budget of 12 time blocks (10 minutes each; the last envelope gets 14). Every order costs blocks: an interview costs 1, a lab panel 2, a CT 3–4, an MRI 6. Every third block an Event fires and can improve or worsen the patient. You may keep working past the budget — that is overtime, and every overtime block costs 3 points and adds campaign fatigue.</p>
  <h3>Orders and the Codebook</h3><p>Every action has a code (H-01 interview, L-03 blood gas, T-02 oxygen…). Click an order or type its code. Quick bedside tests resolve as a card flip; labs and imaging return full reports; conversations return story cards. Results depend on <em>when</em> you order them: an early troponin can be normal, a carbon-monoxide level falls once oxygen is running, hemoglobin lags behind blood loss.</p>
  <h3>Walk the department</h3><p>Orders happen somewhere. Bedside work needs you at the patient’s bed, consults are phoned from the Nurses’ Station, family interviews happen in Family Consult, CT and MRI need you in the scanner room. If you are not there, clicking an order walks you there first (walking is free). Turn on “Order from anywhere” to skip this.</p>
  <h3>The Status Card</h3><p>The triage tag on the left is the patient’s state: Stable, Guarded, Unstable, Critical, Cardiac arrest, or Deceased. It lists which actions are legal right now. Critical locks out interviews and scans until you stabilize; cardiac arrest allows only resuscitation.</p>
  <h3>Pain and trust</h3><p>At pain 7/10 or higher, patients will not engage with an interview. Patients may lie, forget, or be confused. Family, EMS, shelter staff and pharmacy records are independent sources. Cross-check everything.</p>
  <h3>The Consequence Deck</h3><p>23 sealed cards wait for mistakes: wrong drugs, wrong scans, wrong order of operations. Nothing stops you from making them. Each one changes the patient and costs 4 points.</p>
  <h3>Real-time injections</h3><p>Sometimes the monitor alarms and a real clock starts. Choose before it runs out; if you don’t, the clock chooses for you.</p>
  <h3>Discharge and scoring</h3><p>Sign D-01 when you are ready: primary diagnosis, additional findings, disposition, and recommendations (including your own free text, where creative, specific advice earns bonus points). Scoring rewards outcome, diagnosis, key treatments, best-practice tests (skipping them costs points even if you guessed right), correct destination, pain control, and a reasonable bill. The epilogue then reveals what really happened and the alternate timelines.</p>
  <h3>Modes</h3><p><b>Standard</b> shows a limited menu for each patient — the menu itself leaks hints, and “leaked hint” cards appear. <b>Hard mode</b> shows every code for every patient, removes hints, and wrong orders resolve to “Nothing happens” while still costing time.</p>
  <h3>Team play</h3><p>Open Team to host or join with a five-letter code. The host runs the case; everyone walks the same department. Roles divide the labor: physicians order and consult, nurses give treatments and medications, techs run labs and imaging, the social worker interviews family and handles resources. The attending can do anything. Argue about the next block — you only get twelve.</p>
  <h3>Controls</h3><p>WASD or arrow keys to walk (Shift to hurry), drag to look, scroll or pinch to zoom, click the floor to walk there, M for the floor plan. Recording, the video mixer and the media gallery live in Studio.</p>`);
}

/* =====================================================================
   NET — PeerJS team play. Host is authoritative; clients send requests.
   ===================================================================== */
const NET={on:false,host:false,client:false,peer:null,conns:{},conn:null,code:null,roster:{},acc:0,chat:[],err:null,lastCid:null,synced:false};
NET.send=o=>{ if(NET.conn&&NET.conn.open){ NET.conn.send(o); TELE.add('netOut',1); } };
NET.bcast=(o,except)=>{ for(const id in NET.conns){ const c=NET.conns[id]; if(id!==except&&c.open){ c.send(o); TELE.add('netOut',1); } } };
NET.broadcastState=()=>{ if(NET.host) NET.bcast({type:'state',ci:G.ci,s:G.s}); };
NET.hello=()=>{ if(NET.client) NET.send({type:'hello',name:G.name,role:G.role}); if(NET.host&&NET.peer){ NET.roster[NET.peer.id]={name:G.name,role:G.role}; NET.bcast({type:'roster',roster:NET.roster}); } };
NET.tick=dt=>{ if(!NET.on||!W.player) return; NET.acc+=dt; if(NET.acc<0.1) return; NET.acc=0; const p=W.player.position, m={type:'pos',x:+p.x.toFixed(2),z:+p.z.toFixed(2),ry:+W.player.rotation.y.toFixed(2)};
  if(NET.host){ m.id=NET.peer.id; NET.bcast(m); } else NET.send(m); };
function genCode(){ const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; const b=new Uint32Array(5); (window.crypto||{getRandomValues:x=>x.map(()=>Math.random()*1e9)}).getRandomValues(b); return Array.from(b,v=>A[v%A.length]).join(''); }
function netFail(msg){
  NET.err=msg; try{ NET.peer&&NET.peer.destroy(); }catch(e){}
  Object.assign(NET,{on:false,host:false,client:false,peer:null,conns:{},conn:null,code:null});
  toast('Team play could not connect.'); if(!$('modal').hidden) openTeam();
}
function netReset(){ try{ NET.peer&&NET.peer.destroy(); }catch(e){} Object.keys(W.others).forEach(removeOther); Object.assign(NET,{on:false,host:false,client:false,peer:null,conns:{},conn:null,code:null,roster:{},err:null,lastCid:null,synced:false}); renderAll(); }
function addChat(from,text){ NET.chat.push({from,text}); if(NET.chat.length>60) NET.chat.shift(); const el=$('chatLog'); if(el){ el.innerHTML=NET.chat.map(m=>`<div><b>${esc(m.from)}:</b> ${esc(m.text)}</div>`).join(''); el.scrollTop=el.scrollHeight; } }

function hostTeam(){
  if(!window.Peer) return netFail('The PeerJS library did not load.');
  const code=genCode(); let peer; try{ peer=new Peer('nstar-er-'+code,{debug:0}); }catch(e){ return netFail(e.message); }
  NET.peer=peer; const to=setTimeout(()=>{ if(!NET.on) netFail('Timed out reaching the PeerJS signaling server.'); },9000);
  peer.on('open',()=>{ clearTimeout(to); Object.assign(NET,{on:true,host:true,code,err:null}); NET.roster[peer.id]={name:G.name,role:G.role}; addChat('Northstar','Team room '+code+' is open. Share the code.'); renderAll(); openTeam(); });
  peer.on('connection',conn=>{ conn.on('open',()=>{ NET.conns[conn.peer]=conn; }); conn.on('data',d=>hostData(conn,d));
    conn.on('close',()=>{ const who=NET.roster[conn.peer]; delete NET.conns[conn.peer]; delete NET.roster[conn.peer]; removeOther(conn.peer); NET.bcast({type:'roster',roster:NET.roster}); NET.bcast({type:'leave',id:conn.peer}); if(who) addChat('Northstar',who.name+' left.'); refreshTeam(); }); });
  peer.on('error',e=>{ clearTimeout(to); netFail(e.type||String(e)); });
}
function hostData(conn,d){
  TELE.add('netIn',1); const who=NET.roster[conn.peer]||{name:'Guest',role:'resident'};
  switch(d.type){
    case 'hello': NET.roster[conn.peer]={name:String(d.name||'Guest').slice(0,18),role:ROLES[d.role]?d.role:'resident'}; setOther(conn.peer,NET.roster[conn.peer]); NET.bcast({type:'roster',roster:NET.roster,host:NET.peer.id}); conn.send({type:'state',ci:G.ci,s:G.s}); addChat('Northstar',NET.roster[conn.peer].name+' joined as '+ROLES[NET.roster[conn.peer].role].name+'.'); NET.bcast({type:'chat',from:'Northstar',text:NET.roster[conn.peer].name+' joined.'}); refreshTeam(); break;
    case 'pos': if(NET.roster[conn.peer]){ setOther(conn.peer,Object.assign({},NET.roster[conn.peer],d)); NET.bcast({type:'pos',id:conn.peer,x:d.x,z:d.z,ry:d.ry},conn.peer); } break;
    case 'act': { if(!ACT[d.key]) break; if(!roleOk(d.key,who.role)){ conn.send({type:'toast',msg:`${ACT[d.key].code} needs ${ROLE_NEED[ACT[d.key].role]}.`}); break; } const r=doAction(d.key,who.name); if(r.err) conn.send({type:'toast',msg:r.err}); afterChange(); break; }
    case 'rt': if(G.s&&G.s.rt){ clearTimeout(_rtTimer); resolveRt(d.i|0,who.name); afterChange(); } break;
    case 'dc': if(G.s&&!G.s.ended&&d.form){ endCase(d.form,who.name); afterChange(); } break;

const TELE={t0:performance.now(),tot:{},add(k,v){ this.tot[k]=(this.tot[k]||0)+v; },gpu:null};

/* ---------------- audio ---------------- */
const AU={ctx:null,master:null,dest:null,beep:0,alarmOn:false,alarmT:0};
AU.unlock=()=>{ if(AU.ctx){ if(AU.ctx.state==='suspended') AU.ctx.resume(); return; } try{ const C=window.AudioContext||window.webkitAudioContext; AU.ctx=new C(); AU.master=AU.ctx.createGain(); AU.master.gain.value=0.45; AU.master.connect(AU.ctx.destination); AU.dest=AU.ctx.createMediaStreamDestination(); AU.master.connect(AU.dest); }catch(e){} };
AU.tone=(f,d,v,type,delay)=>{ if(!AU.ctx||!G.sound) return; const t=AU.ctx.currentTime+(delay||0); const o=AU.ctx.createOscillator(), g=AU.ctx.createGain(); o.type=type||'sine'; o.frequency.value=f; g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(v,t+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t+d); o.connect(g); g.connect(AU.master); o.start(t); o.stop(t+d+0.03); };
AU.alarm=on=>{ AU.alarmOn=on; };
AU.page=()=>{ AU.tone(659,0.5,0.18,'sine'); AU.tone(523,0.7,0.18,'sine',0.45); };
AU.cue=out=>{ if(out.some(o=>o.k==='cq')){ AU.tone(110,0.6,0.35,'triangle'); AU.tone(82,0.8,0.3,'sine',0.12); } else if(out.some(o=>o.k==='event')) { AU.tone(880,0.25,0.12); AU.tone(1175,0.35,0.12,'sine',0.18); } else AU.tone(1400,0.05,0.05,'square'); };
AU.tick=dt=>{
  if(!AU.ctx||!G.sound) return; const s=G.s, c=CASE();
  if(AU.alarmOn){ AU.alarmT-=dt; if(AU.alarmT<=0){ AU.alarmT=1.0; [0,0.18,0.36].forEach(d=>AU.tone(988,0.14,0.16,'square',d)); } }
  if(!s||!c||!s.monitor||s.ended||!W.activeSlot) return; const st=stateOf(s); const p=ptPos(); const dist=Math.hypot(W.player.position.x-p.x,W.player.position.z-p.z); if(dist>14) return;
  const vol=0.12*Math.max(0,1-dist/14);
  if(st==='arrest'||st==='deceased'){ AU.beep-=dt; if(AU.beep<=0){ AU.beep=1.2; AU.tone(440,1.0,vol*0.7,'sine'); } return; }
  const v=c.vitals(s); AU.beep-=dt; if(AU.beep<=0){ AU.beep=60/Math.max(30,v.hr); AU.tone(660+((v.spo2||85)-85)*14,0.07,vol,'sine'); }
};

function pickMime(){ const L=['video/mp4;codecs="avc1.42E01E,mp4a.40.2"','video/mp4;codecs=avc1,mp4a','video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm']; for(const m of L){ try{ if(window.MediaRecorder&&MediaRecorder.isTypeSupported(m)) return m; }catch(e){} } return ''; }
function makeRecorder(stream,label,stopAll){
  const mime=pickMime(); const rec=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:8e6,audioBitsPerSecond:192000}:undefined); const chunks=[]; rec._t0=performance.now();
  rec.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
  rec.onstop=async()=>{ const type=(rec.mimeType||mime||'video/webm').split(';')[0]; const blob=new Blob(chunks,{type}); stream.getTracks().forEach(t=>{ if(stopAll||t.kind==='video') t.stop(); });
    if(!blob.size) return toast('Nothing was recorded.');
    try{ await GAL.add({name:`${label}-${stamp()}.${type.includes('mp4')?'mp4':'webm'}`,type,blob,kind:'video'}); toast('Saved to the Studio gallery ('+fmtSize(blob.size)+').'); refreshStudio(); }catch(e){ toast('Could not save the recording: '+e.message); } };
  rec.start(1000); return rec;
}
const REC={inner:null,screen:null};

/* ---------------- video mixer (MP3 + MP4 timeline sync) ---------------- */
const once=(el,ev)=>new Promise((res,rej)=>{ const ok=()=>{ el.removeEventListener(ev,ok); res(); }; el.addEventListener(ev,ok); el.addEventListener('error',()=>rej(new Error('Could not load '+(el.tagName||'media').toLowerCase())),{once:true}); });
async function mediaDuration(el){ if(isFinite(el.duration)&&el.duration>0) return el.duration; return new Promise(res=>{ let done=false; const fin=()=>{ if(done) return; done=true; const d=el.duration; try{ el.currentTime=0; }catch(e){} res(isFinite(d)?d:0); }; el.addEventListener('durationchange',()=>{ if(isFinite(el.duration)) fin(); }); try{ el.currentTime=1e101; }catch(e){} setTimeout(fin,3000); }); }
async function renderMix(vidRec,audRec,mode,bpm,onProg){

  const a=document.createElement('audio'); a.preload='auto'; a.src=URL.createObjectURL(audRec.blob);
  await Promise.all([once(v,'loadedmetadata'),once(a,'loadedmetadata')]);
  const vd=await mediaDuration(v), ad=await mediaDuration(a); if(!vd||!ad) throw new Error('Could not read the clip lengths.');
  const cv=document.createElement('canvas'); cv.width=1280; cv.height=720; const x=cv.getContext('2d');
  const src=ctx.createMediaElementSource(a), dst=ctx.createMediaStreamDestination(); src.connect(dst); src.connect(AU.master);
  const st=cv.captureStream(30); dst.stream.getAudioTracks().forEach(t=>st.addTrack(t));

  await a.play(); if(mode==='loop'||mode==='ramp'||mode==='stretch') await v.play().catch(()=>{});

      x.font='600 20px "IBM Plex Mono", monospace'; x.fillStyle='rgba(255,208,138,.85)'; x.fillText('NORTHSTAR ER · STUDIO MIX · '+mode.toUpperCase()+' · '+t.toFixed(1)+' / '+ad.toFixed(1)+' s',28,694);
      onProg(Math.min(1,t/ad));
      if(a.ended||t>=ad-0.03){ done=true; setTimeout(()=>rec.stop(),250); return; } raf=requestAnimationFrame(draw); };
    rec.onstop=async()=>{ cancelAnimationFrame(raf); v.pause(); a.pause(); try{ src.disconnect(); }catch(e){} URL.revokeObjectURL(v.src); URL.revokeObjectURL(a.src);
      const type=(rec.mimeType||mime||'video/webm').split(';')[0]; const blob=new Blob(chunks,{type});
      try{ const id=await GAL.add({name:`mix-${mode}-${stamp()}.${type.includes('mp4')?'mp4':'webm'}`,type,blob,kind:'video'}); res(id); }catch(e){ rej(e); } };
    raf=requestAnimationFrame(draw);
  });
}

/* ---------------- telemetry ---------------- */
const GPU_KEYS=['maxTextureDimension2D','maxBufferSize','maxStorageBufferBindingSize','maxUniformBufferBindingSize','maxComputeWorkgroupSizeX','maxComputeWorkgroupsPerDimension','maxComputeInvocationsPerWorkgroup','maxComputeWorkgroupStorageSize','maxBindGroups','maxStorageBuffersPerShaderStage','maxVertexBuffers','maxColorAttachments'];
async function gpuInit(){
  if(TELE.gpu) return TELE.gpu; const g={supported:!!navigator.gpu}; TELE.gpu=g; if(!navigator.gpu) return g;
  try{ const ad=await navigator.gpu.requestAdapter({powerPreference:'high-performance'}); if(!ad){ g.err='No WebGPU adapter available.'; return g; }
    let info=ad.info; if(!info&&ad.requestAdapterInfo){ try{ info=await ad.requestAdapterInfo(); }catch(e){} }
    g.info=info?{vendor:info.vendor||'—',architecture:info.architecture||'—',description:info.description||'—'}:{};
    g.al={}; GPU_KEYS.forEach(k=>g.al[k]=ad.limits[k]);
    const dev=await ad.requestDevice(); g.dev=dev; g.dl={}; GPU_KEYS.forEach(k=>g.dl[k]=dev.limits[k]);
    const mod=dev.createShaderModule({code:`@group(0) @binding(0) var<storage, read_write> data: array<f32>;
@compute @workgroup_size(256) fn main(@builtin(global_invocation_id) id: vec3<u32>) {
  let i = id.x; if (i >= arrayLength(&data)) { return; }
  var x = data[i];
  for (var k = 0u; k < 256u; k = k + 1u) { x = x * 1.000001 + 0.000001; }
  data[i] = x;
}`});
    g.pipe=dev.createComputePipeline({layout:'auto',compute:{module:mod,entryPoint:'main'}});
    g.buf=dev.createBuffer({size:65536*4,usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_DST});
    g.bg=dev.createBindGroup({layout:g.pipe.getBindGroupLayout(0),entries:[{binding:0,resource:{buffer:g.buf}}]});
  }catch(e){ g.err=e.message; }
  return g;
}
async function gpuProbe(){ const g=await gpuInit(); if(!g.pipe) return; const t0=performance.now(); const enc=g.dev.createCommandEncoder(); const p=enc.beginComputePass(); p.setPipeline(g.pipe); p.setBindGroup(0,g.bg); p.dispatchWorkgroups(256); p.end(); g.dev.queue.submit([enc.finish()]); await g.dev.queue.onSubmittedWorkDone(); const ms=performance.now()-t0; TELE.add('gpuRuns',1); TELE.add('gpuInv',65536); TELE.add('gpuFlop',65536*256*2); TELE.add('gpuMs',ms); g.lastMs=ms; }
function glInfo(){ const gl=W.r.getContext(); let ren='—'; try{ const e=gl.getExtension('WEBGL_debug_renderer_info'); if(e) ren=gl.getParameter(e.UNMASKED_RENDERER_WEBGL); }catch(e){} return {ren,ver:gl.getParameter(gl.VERSION),maxTex:gl.getParameter(gl.MAX_TEXTURE_SIZE)}; }
function openTele(){
  let auto=false, ti=null, at=null;
  const paint=()=>{ const box=$('teleGrid'); if(!box) return; const T=TELE.tot, min=(performance.now()-TELE.t0)/60000, hr=min/60;
    const cell=(lbl,k,fmt)=>{ const v=T[k]||0; const f=fmt||(n=>Math.round(n).toLocaleString()); return `<div><b>${f(v)}</b><span>${lbl}</span><small>${f(v/Math.max(min,1/60))}/min · ${f(v/Math.max(hr,1/3600))}/hr</small></div>`; };
    const big=n=>n>1e12?(n/1e12).toFixed(2)+' T':n>1e9?(n/1e9).toFixed(2)+' G':n>1e6?(n/1e6).toFixed(2)+' M':n>1e3?(n/1e3).toFixed(1)+' K':Math.round(n).toString();
    box.innerHTML=cell('Frames rendered','frames')+cell('Draw calls','calls',big)+cell('Triangles drawn','tris',big)+cell('Orders resolved','actions')+cell('Time blocks simulated','blocks')+cell('Path searches (A*)','paths')+cell('Meters walked','meters')+cell('Network messages in','netIn')+cell('Network messages out','netOut')+cell('GPU compute dispatches','gpuRuns')+cell('GPU invocations','gpuInv',big)+cell('GPU FLOPs (est.)','gpuFlop',big);
    $('teleUp').textContent=`Session ${min.toFixed(1)} min · ${(T.frames/Math.max(1,(performance.now()-TELE.t0)/1000)).toFixed(0)} fps average${TELE.gpu&&TELE.gpu.lastMs?` · last dispatch ${TELE.gpu.lastMs.toFixed(2)} ms`:''}`; };
  const gl=glInfo();
  openModal(`<h2>Telemetry</h2><p class="sub" id="teleUp"></p><div class="tele" id="teleGrid"></div>
   <h3>WebGL renderer</h3><div class="kv"><div><span>Renderer</span><b>${esc(gl.ren)}</b></div><div><span>Version</span><b>${esc(gl.ver)}</b></div><div><span>Max texture</span><b>${gl.maxTex}</b></div><div><span>Three.js</span><b>r${THREE.REVISION}</b></div></div>
   <h3>WebGPU adapter & device</h3><div id="gpuBox" class="sub">Querying…</div>
   <div class="row" style="margin-top:10px"><button class="btn pri" id="gpuRun" style="flex:0 0 auto">Run compute probe</button><label class="sub" style="display:flex;gap:6px;align-items:center;margin:0;flex:0 0 auto"><input type="checkbox" id="gpuAuto"> Probe every 2 s while open</label></div>`);
  paint(); ti=setInterval(paint,1000);
  gpuInit().then(g=>{ const b=$('gpuBox'); if(!b) return; if(!g.supported){ b.textContent='WebGPU is not available in this browser.'; return; } if(g.err&&!g.dev){ b.textContent=g.err; return; }
    b.innerHTML=`<div class="kv"><div><span>Vendor</span><b>${esc(g.info.vendor)}</b></div><div><span>Architecture</span><b>${esc(g.info.architecture)}</b></div>${GPU_KEYS.map(k=>`<div><span>${k}</span><b>${(g.dl&&g.dl[k]!=null?g.dl[k]:g.al[k]||0).toLocaleString()}</b></div>`).join('')}</div>`; });
  $('gpuRun').onclick=async()=>{ await gpuProbe(); paint(); if(TELE.gpu&&!TELE.gpu.pipe) toast(TELE.gpu.err||'WebGPU compute is unavailable here.'); };
  $('gpuAuto').onchange=e=>{ clearInterval(at); if(e.target.checked) at=setInterval(()=>gpuProbe().then(paint),2000); };
  G.onModalClose=()=>{ clearInterval(ti); clearInterval(at); };
}

  if(!window.THREE){ $('scene').innerHTML='<p style="padding:90px 16px;color:#93aaab">Three.js could not load, so the 3D department is unavailable. The case engine still runs from the panels.</p>'; G.relaxed=true; }
  else initWorld();

  if(data&&data.s&&data.ci>=0&&window.THREE){ G.ci=data.ci; G.s=data.s; G.seen=G.s.log.length; G.shownResult=!!G.s.ended; worldSetCase(); W.lastAnimLog=G.s.log.length-1; worldSync(); }
  renderAll();

try{ window.claude?.hot?.snapshot?.(()=>({ci:G.ci,s:G.s})); }catch(e){}
(window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {}));
