# Builds manifest.json and deploys the whole site to GitHub Pages in one step.
# Because manifest.json ships in the SAME deployment as the apps, the gallery
# knows a new app is live the moment the manifest changes.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history → real per-file dates

      - name: Build manifest.json
        run: python3 .github/make_manifest.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .                 # .git and .github are excluded automatically

      - id: deployment
        uses: actions/deploy-pages@v4
