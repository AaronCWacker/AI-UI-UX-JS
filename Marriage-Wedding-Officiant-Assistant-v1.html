<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0a18">
<title>Marriage Wedding Officiant Assistant v1</title>
<meta name="description" content="A four-card ceremony deck for couples and their officiant. Choose your gathering, your service, your vows and your last words.">
<style>
:root{
  color-scheme:dark;
  --ink:#0b0a18; --ink2:#12102a; --panel:#181433; --edge:#241d47;
  --paper:#eef2ff; --ion:#7ae6ff; --brass:#e0b96b; --rose:#e39fae; --violet:#a49bff;
  --muted:#9b94c4; --line:rgba(122,230,255,.18);
  --serif:"Iowan Old Style",Palatino,"Palatino Linotype",Georgia,serif;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Inter,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--paper);font:15px/1.55 var(--sans);overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:12px;
  padding:9px 13px;min-height:42px;transition:background .15s,border-color .15s,transform .1s}
button:hover:not(:disabled){background:rgba(122,230,255,.12);border-color:rgba(122,230,255,.5)}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.38;cursor:not-allowed}
button.go{background:linear-gradient(120deg,#7ae6ff,#a49bff);color:#0a0a18;border:0;font-weight:650}
button.go:hover:not(:disabled){filter:brightness(1.12)}
button.ic{width:42px;padding:5px;font-size:18px}
:focus-visible{outline:2px solid var(--ion);outline-offset:3px}
input,select,textarea{width:100%;background:#0d0b1e;border:1px solid var(--line);border-radius:11px;padding:10px 12px}
textarea{resize:vertical;min-height:70px;font-family:var(--serif);line-height:1.5}
label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}
h1,h2,h3{margin:0;font-weight:400}
h1{font-family:var(--sans);font-weight:300;letter-spacing:2px;font-size:19px}
h2{font-family:var(--serif);font-size:25px}
h3{font-family:var(--serif);font-size:19px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.sm{font-size:12.5px;line-height:1.5}
.muted{color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{margin-bottom:12px}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
#app{height:100dvh;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto}
.mast{display:flex;align-items:center;gap:11px;padding:9px 14px;border-bottom:1px solid var(--line);
  background:linear-gradient(100deg,#171233,#0d0b1f)}
.sigil{width:32px;height:32px;flex:none;display:grid;place-items:center;border-radius:50%;
  border:1px solid var(--ion);color:var(--ion);font-size:15px}
.mast .who{flex:1;min-width:0}
.mast .who p{margin:1px 0 0;font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.04em}
/* the picker: one column per card position, up and down on each */
.picker{display:flex;gap:7px;padding:9px 12px;overflow-x:auto;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#120f28,#0c0a1c);scrollbar-width:thin}
.slot{flex:1 0 156px;min-width:156px;border:1px solid var(--line);border-radius:15px;padding:7px 8px;
  background:rgba(255,255,255,.025);display:grid;gap:5px;transition:border-color .15s,background .15s}
.slot.sel{border-color:rgba(122,230,255,.65);background:rgba(122,230,255,.09);box-shadow:0 0 0 1px rgba(122,230,255,.18)}
.slot .cap{display:flex;align-items:center;gap:6px;font-size:10px;letter-spacing:1.6px;color:var(--ion)}
.slot .cap b{font-weight:400;color:var(--brass)}
.slot .nm{font-family:var(--serif);font-size:15px;line-height:1.25;min-height:2.4em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.slot .ctl{display:flex;align-items:center;gap:5px}
.slot .ctl button{flex:1;min-height:34px;padding:2px;font-size:15px;border-radius:9px}
.slot .idx{font-size:11px;color:var(--muted);min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
.slot.vowA{border-left:2px solid var(--rose)}
.slot.vowB{border-left:2px solid var(--violet)}
.stage{position:relative;min-height:0;overflow:hidden;
  background:radial-gradient(ellipse at 50% 30%,#211b4d 0,#120f2b 48%,#07060f 100%)}
#gl{position:absolute;inset:0}
#gl canvas{display:block;width:100%;height:100%;touch-action:none}
#flat{position:absolute;inset:0;display:none;place-items:center;padding:16px}
#flat.show{display:grid}
#flat svg{max-width:min(92%,320px);max-height:100%;height:auto;border-radius:16px}
.hint{position:absolute;left:14px;bottom:12px;font-size:10.5px;color:#8b83b5;pointer-events:none;max-width:55%}
.stagetools{position:absolute;right:10px;bottom:10px;display:flex;gap:5px}
.stagetools button{width:36px;min-height:36px;padding:3px;font-size:16px;background:#181334dd}
/* the reader drawer */
.reader{border-top:1px solid var(--line);background:linear-gradient(180deg,#141030,#0c0a1e);
  max-height:34dvh;overflow:auto;padding:12px 16px 14px}
.reader .lead{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.reader .lead .n{font-family:var(--serif);font-size:12px;color:var(--brass);letter-spacing:1.5px}
.reader .lead h2{font-size:21px}
.reader p{font-family:var(--serif);font-size:16px;line-height:1.62;margin:8px 0}
.reader .cue{font-size:10.5px;letter-spacing:1.4px;color:var(--ion);margin-top:12px}
.bar{display:flex;gap:6px;padding:8px 12px;border-top:1px solid var(--line);background:#0d0b1f;overflow-x:auto}
.bar button{flex:none}
.pill{border:1px solid var(--line);border-radius:20px;padding:3px 10px;font-size:11px;color:var(--muted);white-space:nowrap}
.toast{position:fixed;left:50%;bottom:76px;transform:translate(-50%,14px);background:#1b1640f2;border:1px solid var(--ion);
  border-radius:13px;padding:11px 18px;z-index:120;opacity:0;pointer-events:none;transition:.2s;max-width:92vw;text-align:center;font-size:14px}
.toast.show{opacity:1;transform:translate(-50%,0)}
dialog{border:1px solid rgba(122,230,255,.35);border-radius:18px;background:#141030;color:var(--paper);padding:0;
  width:min(720px,calc(100vw - 18px));max-height:88dvh}
dialog::backdrop{background:#05040ccc;backdrop-filter:blur(6px)}
.dhead{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:13px 17px;border-bottom:1px solid var(--line);background:#141030}
.dbody{padding:17px;overflow:auto}
.item{border:1px solid var(--line);border-radius:13px;padding:11px 13px;margin-bottom:9px}
.qa{border:1px solid var(--line);border-radius:13px;padding:11px 12px;margin-bottom:10px;background:rgba(255,255,255,.02)}
.qa .q{font-family:var(--serif);font-size:15px;margin-bottom:8px}
.qa .who{font-size:10.5px;letter-spacing:1.4px;color:var(--ion);margin-bottom:4px}
.empty{padding:22px;text-align:center;color:var(--muted);font-size:13.5px}
.sheet{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.sheet svg{width:min(30vw,150px);height:auto;border-radius:12px}
@media (max-width:820px){
  .slot{flex:1 0 138px;min-width:138px}
  .slot .nm{font-size:14px}
  .reader{max-height:30dvh}
  h1{font-size:16px}
  .mast .who p{font-size:9.5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head>
<body><div id="app">
  <header class="mast">
    <div class="sigil">❦</div>
    <div class="who"><h1>MINISTER CARD GAME</h1><p id="ministerLine"></p></div>
    <button class="ic" id="coupleBtn" title="About the two of you">💞</button>
    <button class="ic" id="savedBtn" title="Saved sets">🗂️</button>
    <button class="ic" id="helpBtn" title="How to play">?</button>
  </header>
  <nav class="picker" id="picker" aria-label="Card chooser"></nav>
  <section class="stage" id="stage">
    <div id="gl"></div><div id="flat"></div>
    <div class="hint" id="hint">Drag to turn the table · tap a card to flip it</div>
    <div class="stagetools">
      <button class="ic" id="flipBtn" title="Flip the chosen card">↺</button>
      <button class="ic" id="fitBtn" title="Fit the table">⛶</button>
      <button class="ic" id="shuffleBtn" title="Shuffle every position">🎲</button>
    </div>
  </section>
  <section class="reader" id="reader"></section>
  <footer class="bar">
    <button class="go" id="saveBtn">♥ Save this set</button>
    <button class="ic" id="sayBtn" title="Read this card aloud">▶</button>
    <button class="ic" id="stopBtn" title="Stop reading">■</button>
    <button id="mdBtn">⬇️ Script .md</button>
    <button id="svgBtn">⬇️ Cards .svg</button>
    <button id="pngBtn">📸 Photo</button>
    <button class="ic" id="shareBtn" title="Share">↗</button>
  </footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<dialog id="coupleDlg"><div class="dhead"><h2>The two of you</h2><button class="ic" data-close="coupleDlg">✕</button></div><div class="dbody" id="coupleBody"></div></dialog>
<dialog id="savedDlg"><div class="dhead"><h2>Saved sets</h2><button class="ic" data-close="savedDlg">✕</button></div><div class="dbody" id="savedBody"></div></dialog>
<dialog id="helpDlg"><div class="dhead"><h2>How to play</h2><button class="ic" data-close="helpDlg">✕</button></div><div class="dbody" id="helpBody"></div></dialog>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* =====================================================================
   MINISTER CARD GAME — a four-position ceremony deck.
   I  The Gathering · II The Service · III The Vows (one each) · IV The Last Word
   Twenty variations per position. Single file, no build step, no server.
   Aaron C Wacker (inventor) with Claude + Music History (co-authors, AI pair
   programming). Card verse is original writing.
   ===================================================================== */
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,Number(v)||0));
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.floor(Math.random()*1e9);
const pad2=n=>String(n).padStart(2,'0');
const rnd=n=>Math.floor(Math.random()*n);
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),3000);}
function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),20000);}
function slug(s){return String(s||'set').replace(/[^\w\s-]/g,'').trim().replace(/\s+/g,'-').slice(0,44)||'set';}
function stamp(){const d=new Date();return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;}
function longDate(d){if(!d)return 'a day still to be chosen';const [y,m,dd]=String(d).split('-').map(Number);
  return (y&&m&&dd)?new Date(y,m-1,dd).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'}):d;}
function wrap(t,max=24){const w=String(t).split(/\s+/),o=[];let l='';
  for(const x of w){if((l+' '+x).trim().length>max&&l){o.push(l);l=x;}else l+=(l?' ':'')+x;}if(l)o.push(l);return o;}
const mem=new Map();
const store={ok:true,
  get(k){try{return localStorage.getItem(k);}catch{this.ok=false;return mem.get(k)??null;}},
  set(k,v){try{localStorage.setItem(k,v);}catch{this.ok=false;mem.set(k,v);}}};
const KEY='minister.cardgame.v1';

/* ---- getting to know them: six questions plus one together ---- */
const QUESTIONS=[
 {id:'q1',side:'a',t:'When did you know? Not the big moment — the ordinary one.'},
 {id:'q2',side:'a',t:'What do they do that they think nobody notices?'},
 {id:'q3',side:'a',t:'What makes you laugh so hard you have to sit down?'},
 {id:'q4',side:'b',t:'What does their face do first thing in the morning?'},
 {id:'q5',side:'b',t:'What sound in your home would you miss first?'},
 {id:'q6',side:'b',t:'What are you promising that has nothing to do with a good day?'},
 {id:'q7',side:'both',t:'What have you carried together that neither could carry alone?'},
 {id:'q8',side:'both',t:'What do you always come back to after a hard week?'}
];
/* answers arrive as whole sentences; this trims one to a clause that can be quoted */
function frag(t,max=64){
  let s=String(t||'').replace(/\s+/g,' ').trim().replace(/^["\u201c']+/,'').replace(/["\u201d']+$/,'').replace(/[.!?,;:]+$/,'');
  if(!s) return '';
  if(s.length>max){const cut=s.slice(0,max),cm=cut.lastIndexOf(','),sp=cut.lastIndexOf(' ');
    s=cm>max*.55?cut.slice(0,cm):(sp>18?cut.slice(0,sp):cut);
    s=s.replace(/\s+(?:and|but|or|the|a|an|to|of|in|on|at|for|with|like|that|when|so|my|your|is|was|it)$/i,'');}
  if(/^[A-Z][a-z]+ /.test(s)&&!/^I\b/.test(s)) s=s[0].toLowerCase()+s.slice(1);
  return s;
}
const Q=(c,id,fb)=>{const v=frag(c.answers[id]); return v?`\u201c${v}.\u201d`:fb;};
const QQ=(c,id)=>frag(c.answers[id]);

/* =====================================================================
   I — THE GATHERING · twenty ways to open a room
   ===================================================================== */
const GATHERING=[
 {t:'The Plain Welcome',k:'plain',l:c=>[
  `Welcome. We are at ${c.venue} for something simple: ${c.A} and ${c.B} have decided to say out loud what they have been doing quietly for years.`,
  `${c.a} told me it started ${Q(c,'q1','somewhere unremarkable')}. ${c.b} watches for ${Q(c,'q4','that first look of the morning')}`,
  `That is the whole case. Everything after this is paperwork and cake.`]},
 {t:'The Long Story, Short',k:'brief',l:c=>[
  `${c.A} and ${c.B}. Friends. Thank you for coming.`,
  `Here is everything you need: ${c.a} remembers ${Q(c,'q1','the day it turned')}, and ${c.b} says home sounds like ${Q(c,'q5','one particular voice in the kitchen')}`,
  `Two people, one life, five more minutes. Let's marry them.`]},
 {t:'Two Witnesses',k:'formal',l:c=>[
  `We are gathered at ${c.venue} on ${c.date} to witness a marriage between ${c.A} and ${c.B}.`,
  `A marriage is a promise made in public on purpose, so the people who love you are obliged to remember it with you.`,
  `${c.b} promises ${Q(c,'q6','something that has nothing to do with a good day')} You are here to hold them to it.`]},
 {t:'The Funny One',k:'playful',l:c=>[
  `Welcome. I have been given one job and a very short window before the food.`,
  `For the record: ${c.a}'s favourite piece of evidence is ${Q(c,'q3','a laugh that required sitting down')} And ${c.b} would like it noted that ${Q(c,'q4','they notice everything')}`,
  `Nobody objects to a marriage this obvious. Let's get on with it.`]},
 {t:'Weather and Light',k:'outdoor',l:c=>[
  `Look where we are. ${c.venue}, this light, these people, and two of them about to promise the rest of it.`,
  `${c.b} says home smells and sounds like ${Q(c,'q5','one ordinary morning noise')}`,
  `Whatever the sky does in the next ten minutes, this part is already settled.`]},
 {t:'What We Already Know',k:'lyrical',l:c=>[
  `Nothing I say will marry ${c.A} and ${c.B}. That happened slowly, in rooms none of us were in.`,
  `${c.a} puts it like this: ${Q(c,'q2','it is the things nobody else sees')}`,
  `All we do now is put a date on it and say it where you can hear.`]},
 {t:'The Roll Call',k:'warm',l:c=>[
  `Some of you drove. Some of you flew. One of you is in shoes you will regret by eight o'clock.`,
  `You came because ${c.A} and ${c.B} asked you to watch them do the bravest ordinary thing there is.`,
  `So watch closely. They will want you to remember this exactly.`]},
 {t:'The Quiet Room',k:'still',l:c=>[
  `Let's take one breath together before anything else happens.`,
  `Good. That is the sound of everyone here wanting the same thing for the same two people. After a hard week these two come back to ${Q(c,'q8','the same two chairs')}`,
  `${c.A}, ${c.B} — begin from here.`]},
 {t:'Everything Is Evidence',k:'plain',l:c=>[
  `People ask how you know. You don't know. You accumulate evidence.`,
  `${c.a} offers ${Q(c,'q1','an ordinary Tuesday that would not leave')} ${c.b} offers ${Q(c,'q4','a face at six in the morning')}`,
  `The file is thick. The verdict is obvious. Let's proceed.`]},
 {t:'Before the Music Stops',k:'brief',l:c=>[
  `The music just stopped, which means this is real now.`,
  `${c.A} and ${c.B}: no rehearsal fixes the next four minutes. Good. Nothing true is rehearsed.`,
  `Here we go.`]},
 {t:'The Ordinary Miracle',k:'lyrical',l:c=>[
  `Out of everyone alive, two people found each other, stayed found, and then told their families about it.`,
  `That is statistically absurd and completely ordinary, which is the best definition of a miracle I know.`,
  `${c.A} and ${c.B}, come forward.`]},
 {t:'The First Sentence',k:'story',l:c=>[
  `Every couple has a first sentence. Someone said something, and the other one answered.`,
  `Theirs led here — through ${Q(c,'q7','a season neither could have carried alone')}`,
  `Today they add a line to it, and all of you get to be in the paragraph.`]},
 {t:'Permission to Feel',k:'warm',l:c=>[
  `Quick housekeeping: you are allowed to cry, laugh out loud, and make a noise when they kiss.`,
  `Nobody here is required to be dignified. It is a wedding, not a deposition.`,
  `${c.A}, ${c.B} — the floor is yours.`]},
 {t:'The Short Notice',k:'brief',l:c=>[
  `This is a small wedding, which is another way of saying nobody here is optional.`,
  `Every person in this room got a phone call and said yes. So did ${c.A}. So did ${c.B}.`,
  `That is the shape of the whole day.`]},
 {t:'The Family Braid',k:'family',l:c=>[
  `Two families are about to be related whether they planned on it or not.`,
  `Everything either of them learned about love, they learned first from someone sitting in this room.`,
  `${c.A} and ${c.B}, you get to keep the good parts and write the rest yourselves.`]},
 {t:'The Night Shift',k:'evening',l:c=>[
  `It's getting dark, which is my favourite hour for a promise. Fewer distractions. Better light.`,
  `${c.a} and ${c.b} have been walking toward this evening for a long time, mostly without noticing.`,
  `Let's give them the last few steps.`]},
 {t:'Say It in Front of People',k:'plain',l:c=>[
  `They could have done this at a courthouse in eleven minutes. They chose the harder version.`,
  `The harder version is this: saying it out loud, in front of everyone whose opinion they actually care about.`,
  `${c.A} and ${c.B} — say it where we can hear.`]},
 {t:'The Second Time Around',k:'earned',l:c=>[
  `Some people arrive at a wedding brand new. Others arrive having learned things the long way.`,
  `Either way, what stands here today is a decision made with both eyes open — and those are the good ones.`,
  `${c.A}, ${c.B}: nothing behind you disqualifies what's in front of you.`]},
 {t:'We Interrupt the Party',k:'playful',l:c=>[
  `We interrupt this excellent party for approximately five minutes of legally binding sincerity.`,
  `Normal service — drinks, speeches, someone's uncle dancing — resumes immediately afterward.`,
  `${c.A} and ${c.B}, please step up.`]},
 {t:'The Arrival',k:'lyrical',l:c=>[
  `There is a moment in every wedding where the waiting ends and the thing itself begins.`,
  `This is it. Not the dress, not the flowers, not the seating. This.`,
  `${c.A} and ${c.B}, you are here. Let's begin.`]}
];

/* =====================================================================
   II — THE SERVICE · twenty charges, each with its own lead into the vows
   ===================================================================== */
const SERVICE=[
 {t:'The Ordinary Days',k:'plain',l:c=>[
  `Marriage is not the good days. Anyone can do the good days.`,
  `It is the ordinary Tuesday, the flat tyre, the difficult phone call — and choosing each other anyway, out loud, where the other one can hear it.`,
  `${c.A}, ${c.B}: that is what you are agreeing to.`],v:c=>`Take each other's hands. Say what you came to say.`},
 {t:'The Two Households',k:'formal',l:c=>[
  `Today two families become one household and several complicated group chats.`,
  `To everyone here: you are not spectators. You are the people they will call. Answer.`,
  `${c.A}, ${c.B} — your promise is to each other first, and to this room second.`],v:c=>`Face each other, and make your promises in front of every witness.`},
 {t:'The Long Game',k:'lyrical',l:c=>[
  `You are not promising to stay the same. You are promising to keep being introduced to each other.`,
  `The person standing opposite you in thirty years has not been invented yet. Marry them too.`,
  `${c.a}, ${c.b}: that is the long game, and it is the only one worth playing.`],v:c=>`Say it now, slowly, and let the pause happen.`},
 {t:'The Short Charge',k:'brief',l:c=>[
  `Three sentences, then the promises.`,
  `Love is a decision made repeatedly, in private, with no audience. Today is the one time you do it in public.`,
  `${c.A} and ${c.B}, go ahead.`],v:c=>`Vows. Whenever you're ready.`},
 {t:'Under the Open Sky',k:'outdoor',l:c=>[
  `Everything around us is temporary — the light, the season, the weather, us.`,
  `You are making a permanent promise inside a temporary world, on purpose. That is the brave part.`,
  `${c.A}, ${c.B}, say it where the wind can carry it.`],v:c=>`Hands. Eyes up. Your words now.`},
 {t:'The Honest Terms',k:'playful',l:c=>[
  `Let me read the terms and conditions.`,
  `You are agreeing to shared bills, uneven dishwashing, one of you always being cold, and the other being right more often than is comfortable.`,
  `You are also agreeing to be the first phone call, every time, forever. ${c.a}, ${c.b} — accept?`],v:c=>`Then sign it in your own words. Vows, please.`},
 {t:'The Repair Kit',k:'wise',l:c=>[
  `Every marriage breaks a little. The good ones just get very good at repair.`,
  `So learn the sentence that ends a fight in your house, and say it early. Pride is expensive and nobody wins the argument.`,
  `${c.A}, ${c.B}: promise the repair, not the perfection.`],v:c=>`Now the promises. Mean the repairable ones.`},

const DECKS={gather:GATHERING,service:SERVICE,vowA:VOWCARDS,vowB:VOWCARDS,last:LASTWORD};
const SLOTS=[
 {k:'gather', n:'I',  label:'The Gathering', hue:'#7ae6ff'},
 {k:'service',n:'II', label:'The Service',   hue:'#e39fae'},
 {k:'vowA',   n:'III',label:'Vow — one',     hue:'#f2b6c6'},
 {k:'vowB',   n:'III',label:'Vow — two',     hue:'#a49bff'},
 {k:'last',   n:'IV', label:'The Last Word', hue:'#e0b96b'}
];
const slotBy=k=>SLOTS.find(s=>s.k===k);

/* ---- state ---- */
let S={
  minister:{name:'Aaron C Wacker',org:'American Marriage Ministries',id:'1723952'},
  couple:{A:'',B:'',roleA:'Bride',roleB:'Groom',date:'',venue:'',city:''},

function load(){ try{ const v=JSON.parse(store.get(KEY)||'null'); if(!v) return;

  if(v.answers) for(const q of QUESTIONS) if(typeof v.answers[q.id]==='string') S.answers[q.id]=v.answers[q.id].slice(0,600);
  if(v.pick) for(const s of SLOTS) S.pick[s.k]=clamp(v.pick[s.k],0,DECKS[s.k].length-1);

    couple:String(t.couple||'').slice(0,120),
    pick:Object.fromEntries(SLOTS.map(s=>[s.k,clamp(t.pick[s.k],0,DECKS[s.k].length-1)]))}));
  }catch(e){ console.warn('saved game unreadable',e); } }
function save(){ store.set(KEY,JSON.stringify(S)); }
/* the context every card is written against */
function ctx(){
  const c=S.couple, A=c.A.trim()||'The first of you', B=c.B.trim()||'The second of you';

    venue:c.venue.trim()||'this place', city:c.city, date:longDate(c.date),

}

function setTitle(){ return SLOTS.map(s=>cardOf(s.k).t).join(' · '); }

/* =====================================================================

const P=(d,f='none',st='#7ae6ff',w=2,x='')=>`<path d="${d}" fill="${f}" stroke="${st}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" ${x}/>`;
const C=(cx,cy,r,f='none',st='none',w=1,x='')=>`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${f}" stroke="${st}" stroke-width="${w}" ${x}/>`;
function sigil(k,id,hue){
  const ion='#7ae6ff', warm='#e0b96b';
  if(k==='gather'){
    let m=`<g filter="url(#${id}s)" opacity=".5">${P('M-96 120V-8A96 96 0 0 1 96 -8V120','none',hue,8)}</g>`;
    m+=P('M-96 120V-8A96 96 0 0 1 96 -8V120','none',hue,2.2);
    m+=P('M-64 120V-2A64 64 0 0 1 64 -2V120','none',hue,1,'opacity=".45"');
    m+=P('M-32 120V4A32 32 0 0 1 32 4V120','none',warm,1.6,'opacity=".9"');
    m+=P('M-18 76l18-22 18 22','none',warm,2.4)+P('M-12 38l12-14 12 14','none',warm,1.5,'opacity=".6"');
    m+=C(0,-2,5,hue)+`<g filter="url(#${id}h)">${C(0,-2,8,hue)}</g>`;
    for(let i=0;i<4;i++) m+=P(`M-118 ${132+i*13}H118`,'none',hue,1,`opacity="${.26-i*.05}"`);
    return m;
  }
  if(k==='service'){
    let m=`<g filter="url(#${id}s)" opacity=".45">${C(-40,0,62,'none',ion,6)}${C(40,0,62,'none',hue,6)}</g>`;
    m+=C(-40,0,62,'none',ion,2)+C(40,0,62,'none',hue,2);
    m+=C(-40,0,50,'none',ion,.8,'opacity=".35"')+C(40,0,50,'none',hue,.8,'opacity=".35"');
    m+=P('M0 -34L20 0 0 34 -20 0Z','none',warm,2)+`<g filter="url(#${id}h)">${P('M0 -34L20 0 0 34 -20 0Z',warm)}</g>`;
    return m;
  }
  if(k==='last'){
    let m='';
    for(let i=0;i<32;i++){const a=i*Math.PI/16,r1=i%4?52:44,r2=i%4?86:112;
      m+=P(`M${(Math.cos(a)*r1).toFixed(1)} ${(Math.sin(a)*r1).toFixed(1)}L${(Math.cos(a)*r2).toFixed(1)} ${(Math.sin(a)*r2).toFixed(1)}`,'none',i%4?ion:hue,i%4?1:2.2,`opacity="${i%4?.45:1}"`);}
    m+=`<g filter="url(#${id}s)" opacity=".55">${C(0,0,34,hue)}</g>`;
    m+=C(0,0,34,'none',hue,2.4)+P('M0 -20L16 0 0 20 -16 0Z','#0b0a18',hue,2);
    return m;
  }
  /* vow: a heart inside a ten-point ring, the card's own promise lit */
  const dIdx=VOWDOMAINS_ORDER.indexOf(cardOf(k).d);
  let m=C(0,0,92,'none',ion,1.2,'opacity=".4"');
  for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, x=Math.cos(a)*92, y=Math.sin(a)*92;
    m+= i===dIdx ? `<g filter="url(#${id}h)">${C(x,y,8,hue)}</g>`+C(x,y,5.5,'#0b0a18',hue,2)
                 : C(x,y,4.5,'none',ion,1.2,'opacity=".45"'); }
  const heart='M0 30c-28-24-44-37-44-57a24 24 0 0 1 44-13 24 24 0 0 1 44 13c0 20-16 33-44 57Z';
  m+=`<g transform="scale(1.22)"><g filter="url(#${id}s)" opacity=".55">${P(heart,'none',hue,6)}</g>${P(heart,'none',hue,2.1)}</g>`;
  return m;
}
const VOWDOMAINS_ORDER=['Physical','Emotion','Spirit','Pure','Family','Love','Respect','Trust','Commit','Bond'];

function scriptMD(){
  const x=ctx(), c=S.couple;
  let md=`# ${coupleName()}\n\n${longDate(c.date)}${c.venue?' · '+c.venue:''}${c.city?', '+c.city:''}\n\nOfficiant: ${S.minister.name} — ${S.minister.org}${S.minister.id?' (minister ID '+S.minister.id+')':''}\n\nChosen set: **${setTitle()}**\n\n---\n\n`;
  const block=(k)=>{ const s=slotBy(k), v=cardOf(k);
    md+=`## ${s.n} · ${s.label} — ${v.t}\n\n`;
    cardLines(k).forEach(l=>{ md+=`> ${l}\n>\n`; }); md+='\n'; };
  block('gather');
  const asked=QUESTIONS.filter(q=>S.answers[q.id]);
  if(asked.length){ md+=`## Getting to know them\n\n`;
    asked.forEach(q=>{ const who=q.side==='a'?(c.A||'One'):q.side==='b'?(c.B||'Two'):'Together';
      md+=`- **${q.t}**\n  _${who}:_ ${S.answers[q.id]}\n`; }); md+='\n'; }
  block('service');
  md+=`## III · The Vows\n\n`;
  [['vowA',c.roleA,c.A],['vowB',c.roleB,c.B]].forEach(([k,role,name])=>{
    const v=cardOf(k); md+=`### ${name||role} — ${v.t} (${v.d})\n\n`;
    v.l.forEach(l=>{ md+=`> ${l}\n`; }); md+=`\n_Starter card. Steal a line, finish it in your own words._\n\n`; });
  md+=`## IV · ${cardOf('last').t}\n\n`; cardLines('last').forEach(l=>{ md+=`> ${l}\n>\n`; });
  md+=`\n---\n\nCards and verse: Aaron C Wacker (inventor) with Claude + Music History (co-authors, AI pair programming).\n`;
  return md;
}

    const tex=new THREE.CanvasTexture(cv); tex.encoding=THREE.sRGBEncoding; tex.anisotropy=8; res(tex);};
  img.onerror=()=>{clearTimeout(t);URL.revokeObjectURL(url);rej(new Error('card art failed'));};
  img.src=url; }); }

  if(s.k==='vowB') return (S.couple.B.split(' ')[0]||S.couple.roleB||'Two')+"'s vow";
  return s.label;
}
function renderPicker(){

}
function renderReader(){
  const s=slotBy(S.sel), v=cardOf(S.sel), lines=cardLines(S.sel);
  const sub=(S.sel==='vowA'||S.sel==='vowB')?`${v.d} · a starter, not a script`:v.k;
  $('reader').innerHTML=`<div class="lead"><span class="n">${s.n} · ${esc(slotLabel(s).toUpperCase())}</span><h2>${esc(v.t)}</h2><span class="pill">${esc(sub)}</span></div>
    ${lines.map(l=>`<p>${esc(l)}</p>`).join('')}
    ${(S.sel==='vowA'||S.sel==='vowB')?`<div class="cue">Take a line you love and finish the rest in your own words.</div>`:''}`;
  $('reader').scrollTop=0;
}
function renderMinister(){
  const m=S.minister, c=S.couple;
  $('ministerLine').textContent=[coupleName(), c.date?longDate(c.date):'', m.name].filter(Boolean).join(' · ');
}
function step(k,dir){
  const n=DECKS[k].length;
  S.pick[k]=(S.pick[k]+dir+n)%n;
  if(k==='vowA'&&S.pick.vowA===S.pick.vowB) S.pick[k]=(S.pick[k]+dir+n)%n;
  if(k==='vowB'&&S.pick.vowB===S.pick.vowA) S.pick[k]=(S.pick[k]+dir+n)%n;
  S.sel=k; save(); renderPicker(); renderReader(); renderMinister();
  if(stage?.ok) stage.setCard(k); else renderFlat();
}
function shuffleAll(){
  for(const s of SLOTS) S.pick[s.k]=rnd(DECKS[s.k].length);
  if(S.pick.vowA===S.pick.vowB) S.pick.vowB=(S.pick.vowB+1)%DECKS.vowB.length;
  save(); renderPicker(); renderReader();
  if(stage?.ok) stage.buildAll(); else renderFlat();
  toast('Dealt: '+setTitle());
}
function renderFlat(){ $('flat').innerHTML=cardFace(S.sel); }
$('picker').addEventListener('click',e=>{
  const b=e.target.closest('button');
  if(b&&b.dataset.step){ const [k,d]=b.dataset.step.split(':'); step(k,Number(d)); return; }
  const sl=e.target.closest('[data-slot]');
  if(sl){ S.sel=sl.dataset.slot; save(); renderPicker(); renderReader(); if(!stage?.ok) renderFlat(); }
});
document.addEventListener('keydown',e=>{
  if(e.target.closest('input,textarea,select')||document.querySelector('dialog[open]')) return;
  const i=SLOTS.findIndex(s=>s.k===S.sel);
  if(e.key==='ArrowUp'){e.preventDefault();step(S.sel,-1);}
  if(e.key==='ArrowDown'){e.preventDefault();step(S.sel,1);}
  if(e.key==='ArrowLeft'){e.preventDefault();S.sel=SLOTS[(i+SLOTS.length-1)%SLOTS.length].k;renderPicker();renderReader();}
  if(e.key==='ArrowRight'){e.preventDefault();S.sel=SLOTS[(i+1)%SLOTS.length].k;renderPicker();renderReader();}
  if(e.key===' '){e.preventDefault();stage?.flipSelected();}
  if(e.key==='Escape') stopSpeak();
});
/* ---- voice ---- */
function speak(lines,label){
  if(!('speechSynthesis' in window)){toast('This browser has no voice.');return;}
  stopSpeak(); speaking=true;
  lines.filter(Boolean).forEach(t=>{ const u=new SpeechSynthesisUtterance(String(t)); u.rate=.95; speechSynthesis.speak(u); });
}
function stopSpeak(){ if('speechSynthesis' in window) speechSynthesis.cancel(); speaking=false; }
/* ---- dialogs ---- */
function openCouple(){
  const c=S.couple;
  $('coupleBody').innerHTML=`
    <div class="two">
      <div class="field"><label for="cA">First partner</label><input id="cA" value="${esc(c.A)}" placeholder="Name on the licence"></div>
      <div class="field"><label for="cRA">They are the…</label><input id="cRA" value="${esc(c.roleA)}" placeholder="bride / wife / partner"></div>
      <div class="field"><label for="cB">Second partner</label><input id="cB" value="${esc(c.B)}" placeholder="Name on the licence"></div>
      <div class="field"><label for="cRB">They are the…</label><input id="cRB" value="${esc(c.roleB)}" placeholder="groom / husband / partner"></div>
      <div class="field"><label for="cDate">Date</label><input id="cDate" type="date" value="${esc(c.date)}"></div>
      <div class="field"><label for="cVenue">Where</label><input id="cVenue" value="${esc(c.venue)}" placeholder="The boathouse"></div>
    </div>
    <div class="field"><label for="cCity">City and state</label><input id="cCity" value="${esc(c.city)}"></div>
    <hr><h3>Getting to know you</h3>
    <p class="sm muted">Answer what you like. These lines get quoted back in Card I, so write the words you'd actually say.</p>
    ${QUESTIONS.map(q=>{
      const who=q.side==='a'?(c.A||c.roleA||'First partner'):q.side==='b'?(c.B||c.roleB||'Second partner'):'Both of you';
      return `<div class="qa"><div class="who">${esc(who)}</div><div class="q">${esc(q.t)}</div>
        <textarea data-q="${q.id}" placeholder="One true sentence beats a paragraph.">${esc(S.answers[q.id]||'')}</textarea></div>`;}).join('')}`;
  $('coupleDlg').showModal();
}
$('coupleBody').addEventListener('input',e=>{
  const t=e.target, map={cA:'A',cB:'B',cRA:'roleA',cRB:'roleB',cDate:'date',cVenue:'venue',cCity:'city'};
  if(map[t.id]) S.couple[map[t.id]]=t.value.slice(0,90);
  if(t.dataset.q) S.answers[t.dataset.q]=t.value.slice(0,600);
  save(); renderMinister(); renderPicker(); renderReader();
  clearTimeout(openCouple.t); openCouple.t=setTimeout(()=>{ if(stage?.ok) stage.buildAll(); else renderFlat(); },500);
});
function renderSaved(){
  $('savedBody').innerHTML=`
    <div class="row" style="margin-bottom:14px"><button class="go" id="saveNow">♥ Save the set on the table</button>
      <button id="expJSON">Export all (.json)</button></div>
    ${S.sets.length? S.sets.map(t=>`<div class="item">
      <div class="row"><b class="grow">${esc(t.name)}</b>
        <button class="ic" data-load="${t.id}" title="Put it on the table">↑</button>
        <button class="ic" data-md="${t.id}" title="Script .md">⬇️</button>
        <button class="ic" data-del="${t.id}" title="Remove">🗑️</button></div>
      <div class="sm muted">${esc(t.couple||'')} · kept ${new Date(t.date).toLocaleDateString()}</div></div>`).join('')
      : '<div class="empty">Nothing saved yet. Scroll each position until all five feel like you, then save.</div>'}`;
  $('saveNow').onclick=saveSet;
  $('expJSON').onclick=()=>download(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),`minister-deck-${stamp()}.json`);
  $('savedBody').querySelectorAll('[data-load]').forEach(b=>b.onclick=()=>{
    const t=S.sets.find(x=>x.id===b.dataset.load); if(!t) return;
    S.pick=Object.assign({},t.pick); save(); renderPicker(); renderReader();
    if(stage?.ok) stage.buildAll(); else renderFlat(); $('savedDlg').close(); toast('Set loaded.');});
  $('savedBody').querySelectorAll('[data-md]').forEach(b=>b.onclick=()=>{
    const t=S.sets.find(x=>x.id===b.dataset.md); if(!t) return;
    const keep=S.pick; S.pick=Object.assign({},t.pick);
    download(new Blob([scriptMD()],{type:'text/markdown;charset=utf-8'}),`${slug(t.couple||'ceremony')}-script.md`);
    S.pick=keep;});
  $('savedBody').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    S.sets=S.sets.filter(x=>x.id!==b.dataset.del); save(); renderSaved();});
}
function saveSet(){
  const name=setTitle();
  if(S.sets.some(t=>SLOTS.every(s=>t.pick[s.k]===S.pick[s.k]))){ toast('That set is already saved.'); return; }
  S.sets.unshift({id:uid(),date:Date.now(),name,couple:coupleName(),pick:Object.assign({},S.pick)});
  S.sets=S.sets.slice(0,60); save(); renderSaved(); toast('Saved. Five cards, kept.');
}
function openHelp(){
  $('helpBody').innerHTML=`
    <h3>Four positions, twenty cards each</h3>
    <p class="sm">Use ▲ and ▼ above each position to scroll its twenty variations. Read each one aloud to each other. When a card sounds like you, leave it and move to the next position.</p>
    <p class="sm"><b>I · The Gathering</b> — how your officiant opens the room. It quotes your own answers back, so fill in 💞 first.</p>
    <p class="sm"><b>II · The Service</b> — what gets said about marriage before you speak, and how you're handed the floor.</p>
    <p class="sm"><b>III · The Vows</b> — one card each. Twenty starters drawn from ten promises: physical, emotion, spirit, pure, family, love, respect, trust, commit, bond. Steal a line you love and finish it yourselves. You each pick your own; they don't have to match.</p>
    <p class="sm"><b>IV · The Last Word</b> — the pronouncement, the kiss and how you're presented.</p>
    <hr><h3>Keeping it</h3>
    <p class="sm">♥ saves the set. ⬇️ .md gives your officiant the whole ceremony in writing. ⬇️ .svg is all five cards on one sheet, printable at any size. 📸 photographs the table. ↗ shares whatever your device supports.</p>
    <p class="sm muted">Everything stays in this browser. Nothing is uploaded.</p>
    <hr><p class="sm muted">Cards and verse: Aaron C Wacker (inventor) with Claude + Music History (co-authors, AI pair programming). Ordained through ${esc(S.minister.org)}${S.minister.id?', minister ID '+esc(S.minister.id):''}.</p>`;
  $('helpDlg').showModal();
}
/* ---- exports ---- */
function pngBlob(){ return new Promise(res=>{
  if(!stage?.ok) return res(null);
  fetch(stage.png()).then(r=>r.blob()).then(res).catch(()=>res(null)); }); }
$('mdBtn').onclick=()=>download(new Blob([scriptMD()],{type:'text/markdown;charset=utf-8'}),`${slug(coupleName())}-ceremony.md`);
$('svgBtn').onclick=()=>download(new Blob([sheetSVG()],{type:'image/svg+xml;charset=utf-8'}),`${slug(coupleName())}-cards.svg`);
$('pngBtn').onclick=async()=>{ const b=await pngBlob();
  if(!b){toast('The photo needs the 3D table. Save the .svg instead.');return;}
  download(b,`${slug(coupleName())}-table.png`); };
$('shareBtn').onclick=async()=>{
  const files=[];
  try{ const b=await pngBlob(); if(b) files.push(new File([b],`${slug(coupleName())}-table.png`,{type:'image/png'})); }catch{}
  files.push(new File([scriptMD()],`${slug(coupleName())}-ceremony.md`,{type:'text/markdown'}));
  const data={title:'Our card set',text:`${coupleName()} — ${setTitle()}`,files};
  if(navigator.canShare?.(data)){ try{ await navigator.share(data); return; }catch{} }
  try{ await navigator.clipboard.writeText(`${coupleName()} — ${setTitle()}\n\n${scriptMD()}`); toast('Copied the whole set to your clipboard.'); }
  catch{ $('mdBtn').click(); }
};
$('saveBtn').onclick=()=>{ saveSet(); $('savedDlg').showModal(); };
$('savedBtn').onclick=()=>{ renderSaved(); $('savedDlg').showModal(); };
$('coupleBtn').onclick=openCouple;
$('helpBtn').onclick=openHelp;
$('sayBtn').onclick=()=>speak([cardOf(S.sel).t,...cardLines(S.sel)],'card');
$('stopBtn').onclick=stopSpeak;
$('flipBtn').onclick=()=>{ if(stage?.ok) stage.flipSelected(); else { $('flat').innerHTML=cardBack(S.sel); setTimeout(renderFlat,6000); } };
$('fitBtn').onclick=()=>stage?.fit?.();
$('shuffleBtn').onclick=shuffleAll;
document.addEventListener('click',e=>{ const b=e.target.closest('button[data-close]'); if(b) $(b.dataset.close).close(); });
/* ---- start ---- */
function boot3D(){
  try{ stage=new Table($('gl')).init(); stage.buildAll();
    $('hint').textContent='Drag to turn the table · tap a card to flip it · ▲▼ to change a position'; }
  catch(err){ console.warn('vector fallback:',err); flat=true;
    $('flat').classList.add('show'); renderFlat();
    $('hint').textContent='Vector cards — 3D is unavailable in this browser'; }
}
load();
if(S.pick.vowA===S.pick.vowB) S.pick.vowB=(S.pick.vowA+1)%VOWCARDS.length;
renderMinister(); renderPicker(); renderReader(); save(); boot3D();
window.MinisterDeck={get state(){return S;},SLOTS,DECKS,cardLines,scriptMD,sheetSVG,cardFace,cardBack,shuffleAll,saveSet,get table(){return stage;}};
</script></body></html>
