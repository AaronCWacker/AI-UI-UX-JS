<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Saints Tarot Quest v3.2 x Rainy Lake Raid - Integrated Oracle</title>
    <style>
        :root {
            --bg-primary: #0b0d12;
            --bg-island: rgba(18, 22, 31, 0.75);
            --border-island: rgba(255, 255, 255, 0.12);
            --border-highlight: rgba(212, 175, 55, 0.4);
            --accent-gold: #d4af37;
            --accent-cyan: #38ef7d;
            --accent-blue: #11998e;
            --text-main: #f0f4f8;
            --text-muted: #8a99ad;
            --island-glow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(17, 153, 142, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(212, 175, 55, 0.1) 0%, transparent 40%);
            background-attachment: fixed;
            padding-bottom: 80px;
        }

        /* --- GLASSISLAND SYSTEM --- */
        .island {
            background: var(--bg-island);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-island);
            border-radius: 20px;
            box-shadow: var(--island-glow);
            padding: 18px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
        }

        .island:hover {
            border-color: var(--border-highlight);
        }

        /* --- TOP AUTO-COLLAPSE EMOJI TOOLBAR --- */
        #emoji-toolbar {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            gap: 12px;
            padding: 10px 18px;
            border-radius: 40px;
            background: rgba(10, 14, 23, 0.85);
            border: 1px solid rgba(212, 175, 55, 0.3);
            backdrop-filter: blur(16px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #emoji-toolbar.collapsed-island {
            opacity: 0.25;
            transform: translateX(-50%) translateY(-10px) scale(0.92);
        }

        #emoji-toolbar.collapsed-island:hover {
            opacity: 1;
            transform: translateX(-50%) translateY(0) scale(1);
        }

        .emoji-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .emoji-btn:hover, .emoji-btn.active {
            background: var(--accent-gold);
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
        }

        /* --- MAIN HEADER ISLAND --- */
        .header-island {
            margin: 80px 20px 20px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .header-island h1 {
            font-size: 1.6rem;
            letter-spacing: 1.5px;
            background: linear-gradient(135deg, #fff 0%, var(--accent-gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .header-island p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* --- MAIN LAYOUT GRID --- */
        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 900px) {
            .app-container {
                grid-template-columns: 320px 1fr;
            }
        }

        /* --- CONTROLS & CONFIG ISLAND --- */
        .controls-island {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-group label {
            font-size: 0.85rem;
            color: var(--accent-gold);
            font-weight: 600;
            display: flex;
            justify-content: space-between;
        }

        select, input[type="range"], input[type="text"] {
            width: 100%;
            padding: 8px 12px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-island);
            color: var(--text-main);
            outline: none;
        }

        /* --- SPREADS & TAROT DISPLAY ISLAND --- */
        .spread-viewport {
            min-height: 550px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .spread-title {
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 0.9rem;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* CARD SPREAD LAYOUTS */
        .spread-grid {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 40px 10px 10px 10px;
        }

        /* 4-QUADRANT LAYOUT */
        .spread-grid.quadrant {
            display: grid;
            grid-template-columns: repeat(2, 130px);
            grid-template-rows: repeat(2, 180px);
            gap: 15px;
            justify-content: center;
        }

        /* 10-CARD CELTIC CROSS LAYOUT */
        .spread-grid.celtic-cross {
            display: grid;
            grid-template-columns: repeat(5, 110px);
            grid-template-rows: repeat(4, 150px);
            gap: 10px;
            justify-content: center;
        }

        /* TAROT CARD STYLE */
        .tarot-card {
            width: 110px;
            height: 165px;
            border-radius: 12px;
            background: linear-gradient(145deg, #1f2633, #0f131a);
            border: 1px solid rgba(212, 175, 55, 0.3);
            box-shadow: 0 6px 16px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            text-align: center;
        }

        .tarot-card:hover {
            transform: translateY(-8px) scale(1.04);
            border-color: var(--accent-gold);
            box-shadow: 0 12px 24px rgba(212, 175, 55, 0.25);
        }

        .tarot-card .card-pos {
            font-size: 0.65rem;
            color: var(--accent-gold);
            text-transform: uppercase;
        }

        .tarot-card .card-icon {
            font-size: 2rem;
            margin: 10px 0;
        }

        .tarot-card .card-name {
            font-size: 0.75rem;
            font-weight: bold;
            line-height: 1.1;
        }

        /* OVERLAY CELL FOR CROSS CARD (Pos 2) */
        .celtic-cross .card-pos-2 {
            grid-column: 2;
            grid-row: 2;
            transform: rotate(90deg);
            z-index: 10;
        }

        /* --- GPU & SYSTEM HUD BOTTOM FLOATING BAR --- */
        #gpu-hud {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 40px);
            max-width: 900px;
            background: rgba(10, 14, 23, 0.9);
            border: 1px solid var(--border-island);
            border-radius: 12px;
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            backdrop-filter: blur(10px);
            z-index: 999;
        }

        .hud-highlight {
            color: var(--accent-cyan);
            font-weight: 600;
        }

        .btn-action {
            background: linear-gradient(135deg, var(--accent-blue) 0%, var(--accent-cyan) 100%);
            color: #000;
            font-weight: bold;
            border: none;
            padding: 10px 16px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .btn-action:hover {
            transform: scale(1.02);
            filter: brightness(1.1);
        }

        /* SAVED HISTORY MODAL / ISLAND */
        .history-list {
            max-height: 150px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .history-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

    <!-- AUTO-COLLAPSING SINGLE EMOJI TOOLBAR -->
    <div id="emoji-toolbar">
        <button class="emoji-btn active" title="Draw Cards" onclick="app.drawSpread()">🔮</button>
        <button class="emoji-btn" title="Change Spread Layout" onclick="app.cycleSpread()">🃏</button>
        <button class="emoji-btn" title="Toggle Rainy Lake Ambient FX" id="rain-btn" onclick="app.toggleRain()">⚔️</button>
        <button class="emoji-btn" title="Audio Oracle Speech Read" onclick="app.speakCurrentSpread()">🔊</button>
        <button class="emoji-btn" title="Save Reading Snapshot" onclick="app.saveCurrentReading()">💾</button>
    </div>

    <!-- MAIN HEADER ISLAND -->
    <div class="island header-island">
        <h1>Saints Tarot Quest v3.2</h1>
        <p>Rainy Lake Raid Integrated Audio Oracle Suite</p>
    </div>

    <!-- MAIN APP CONTAINER -->
    <div class="app-container">

        <!-- CONTROLS & SYSTEM CONFIG ISLAND -->
        <div class="island controls-island">
            <h3>⚙️ Configuration</h3>
            
            <div class="control-group">
                <label>Active Spread Mode</label>
                <select id="spread-select" onchange="app.setSpread(this.value)">
                    <option value="2-card">2-Card Duality Read</option>
                    <option value="3-card">3-Card Arc Read</option>
                    <option value="4-quadrant">4-Quadrant Compass Read</option>
                    <option value="celtic-cross" selected>10-Card Celtic Cross Read</option>
                </select>
            </div>

            <div class="control-group">
                <label>Menu Collapse Timer <span id="collapse-val">10s</span></label>
                <input type="range" min="3" max="30" value="10" oninput="app.updateCollapseTimeout(this.value)">
            </div>

            <div class="control-group">
                <label>Rain Sound Volume <span id="vol-val">30%</span></label>
                <input type="range" min="0" max="100" value="30" oninput="app.updateRainVolume(this.value)">
            </div>

            <div class="control-group">
                <label>Oracle Voice Pitch <span id="pitch-val">1.0</span></label>
                <input type="range" min="0.5" max="1.5" step="0.1" value="1.0" oninput="app.updatePitch(this.value)">
            </div>

            <button class="btn-action" onclick="app.drawSpread()">🔮 Perform New Reading</button>

            <hr style="border-color: var(--border-island); margin: 10px 0;">

            <h3>📜 Session History</h3>
            <div class="history-list" id="history-container">
                <!-- Dynamically Populated -->
            </div>
            <button style="background:transparent; border:1px solid var(--border-island); color:var(--text-muted); padding:6px; border-radius:6px; cursor:pointer;" onclick="app.exportHistory()">📥 Export Saved Reads (JSON)</button>
        </div>

        <!-- READINGS & SPREAD VIEWPORT ISLAND -->
        <div class="island spread-viewport">
            <div class="spread-title" id="active-spread-title">10-Card Celtic Cross Read</div>
            <div class="spread-grid celtic-cross" id="spread-grid">
                <!-- Cards dynamically populated here -->
            </div>
        </div>

    </div>

    <!-- GPU DIAGNOSTICS & SYSTEM STATUS FLOATING BAR -->
    <div id="gpu-hud">
        <div>GPU: <span class="hud-highlight" id="gpu-vendor">Detecting...</span></div>
        <div>RENDERER: <span class="hud-highlight" id="gpu-renderer">Detecting...</span></div>
        <div>FPS: <span class="hud-highlight" id="fps-val">60</span></div>
    </div>

    <!-- MODULE SOURCES & INTEGRATION LOGIC -->
    <script>
        // ==========================================
        // 1. AUDIO ENGINE MODULE (Web Audio API & Speech)
        // ==========================================
        class AudioEngine {
            constructor() {
                this.ctx = null;
                this.rainNode = null;
                this.rainGain = null;
                this.masterGain = null;
                this.isRainPlaying = false;
                this.speechPitch = 1.0;
                this.speechRate = 1.0;
                this.rainVolume = 0.3;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioCtx();
                    this.masterGain = this.ctx.createGain();
                    this.masterGain.connect(this.ctx.destination);
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playCardFlip() {
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(140, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.08);

                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);

                osc.connect(gain);
                gain.connect(this.masterGain);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.08);
            }

            toggleRain() {
                this.init();
                if (this.isRainPlaying) {
                    if (this.rainGain) {
                        this.rainGain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.8);
                        setTimeout(() => {
                            if (this.rainNode) this.rainNode.disconnect();
                            this.isRainPlaying = false;
                        }, 800);
                    }
                    return false;
                }

                const bufferSize = this.ctx.sampleRate * 2;
                const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                
                let b0=0, b1=0, b2=0, b3=0, b4=0, b5=0, b6=0;
                for (let i = 0; i < bufferSize; i++) {
                    const white = Math.random() * 2 - 1;
                    b0 = 0.99886 * b0 + white * 0.0555179;
                    b1 = 0.99332 * b1 + white * 0.0750759;
                    b2 = 0.96900 * b2 + white * 0.1538520;
                    b3 = 0.86650 * b3 + white * 0.3104856;
                    b4 = 0.55000 * b4 + white * 0.5329522;
                    b5 = -0.7616 * b5 - white * 0.0168980;
                    output[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
                    output[i] *= 0.11;
                    b6 = white * 0.115926;
                }

                this.rainNode = this.ctx.createBufferSource();
                this.rainNode.buffer = noiseBuffer;
                this.rainNode.loop = true;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = 900;

                this.rainGain = this.ctx.createGain();
                this.rainGain.gain.setValueAtTime(0.001, this.ctx.currentTime);
                this.rainGain.gain.exponentialRampToValueAtTime(this.rainVolume, this.ctx.currentTime + 1);

                this.rainNode.connect(filter);
                filter.connect(this.rainGain);
                this.rainGain.connect(this.masterGain);

                this.rainNode.start();
                this.isRainPlaying = true;
                return true;
            }

            setRainVolume(val) {
                this.rainVolume = val;
                if (this.rainGain && this.isRainPlaying) {
                    this.rainGain.gain.setValueAtTime(val, this.ctx.currentTime);
                }
            }

            speakOracle(text) {
                if (!('speechSynthesis' in window)) return;
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.pitch = this.speechPitch;
                utterance.rate = this.speechRate;
                window.speechSynthesis.speak(utterance);
            }
        }

        // ==========================================
        // 2. STORAGE MANAGER MODULE (LocalStorage)
        // ==========================================
        class StorageManager {
            constructor(storageKey = 'saints_tarot_readings_v3') {
                this.storageKey = storageKey;
            }

            getAllReadings() {
                try {
                    const data = localStorage.getItem(this.storageKey);
                    return data ? JSON.parse(data) : [];
                } catch (e) {
                    return [];
                }
            }

            saveReading(spreadType, cardsArray) {
                const readings = this.getAllReadings();
                const newEntry = {
                    id: 'read_' + Date.now(),
                    timestamp: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                    spreadType,
                    cardCount: cardsArray.length
                };
                readings.unshift(newEntry);
                localStorage.setItem(this.storageKey, JSON.stringify(readings));
                return readings;
            }

            exportToJSON() {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(this.getAllReadings(), null, 2));
                const anchor = document.createElement('a');
                anchor.setAttribute("href", dataStr);
                anchor.setAttribute("download", `saints_tarot_history_${Date.now()}.json`);
                document.body.appendChild(anchor);
                anchor.click();
                anchor.remove();
            }
        }

        // ==========================================
        // 3. AUTO-COLLAPSE MENU MODULE
        // ==========================================
        class CollapseMenu {
            constructor(elementId, timeoutSeconds = 10) {
                this.menuEl = document.getElementById(elementId);
                this.timeoutMs = timeoutSeconds * 1000;
                this.timer = null;
                this.isCollapsed = false;
                this.initListeners();
            }

            initListeners() {
                const resetTimer = () => {
                    this.wakeMenu();
                    clearTimeout(this.timer);
                    this.timer = setTimeout(() => this.collapseMenu(), this.timeoutMs);
                };

                ['mousemove', 'mousedown', 'touchstart', 'scroll', 'keydown'].forEach(evt => {
                    window.addEventListener(evt, resetTimer, { passive: true });
                });

                resetTimer();
            }

            collapseMenu() {
                if (!this.isCollapsed && this.menuEl) {
                    this.menuEl.classList.add('collapsed-island');
                    this.isCollapsed = true;
                }
            }

            wakeMenu() {
                if (this.isCollapsed && this.menuEl) {
                    this.menuEl.classList.remove('collapsed-island');
                    this.isCollapsed = false;
                }
            }

            updateTimeout(newSeconds) {
                this.timeoutMs = newSeconds * 1000;
            }
        }

        // ==========================================
        // 4. MAIN INTEGRATED APPLICATION LOGIC
        // ==========================================
        const ARCANA_CARDS = [
            { name: "The Fool", icon: "🃏", meaning: "New beginnings, innocence, spontaneity" },
            { name: "The Magician", icon: "🪄", meaning: "Manifestation, resourcefulness, power" },
            { name: "High Priestess", icon: "🌙", meaning: "Intuition, sacred knowledge, subconscious" },
            { name: "The Empress", icon: "👑", meaning: "Femininity, beauty, nature, abundance" },
            { name: "The Emperor", icon: "🏛️", meaning: "Authority, structure, solid foundation" },
            { name: "The Hierophant", icon: "📜", meaning: "Spiritual wisdom, religious beliefs, tradition" },
            { name: "The Lovers", icon: "💖", meaning: "Love, harmony, relationships, choices" },
            { name: "The Chariot", icon: "🛒", meaning: "Control, willpower, success, action" },
            { name: "Strength", icon: "🦁", meaning: "Courage, persuasion, influence, compassion" },
            { name: "The Hermit", icon: "🕯️", meaning: "Soul-searching, introspection, inner guidance" },
            { name: "Wheel of Fortune", icon: "🎡", meaning: "Good luck, karma, life cycles, destiny" },
            { name: "Justice", icon: "⚖️", meaning: "Justice, fairness, truth, cause and effect" }
        ];

        const SPREAD_POSITIONS = {
            '2-card': ["1. Action", "2. Reaction"],
            '3-card': ["1. Past", "2. Present", "3. Future"],
            '4-quadrant': ["1. North (Mind)", "2. South (Body)", "3. East (Spirit)", "4. West (Emotion)"],
            'celtic-cross': [
                "1. Core", "2. Cross/Challenge", "3. Conscious/Mind", "4. Basis/Subconscious",
                "5. Past Passing", "6. Future Arriving", "7. Self Attitude", "8. Environment",
                "9. Hopes & Fears", "10. Final Outcome"
            ]
        };

        class Application {
            constructor() {
                this.audio = new AudioEngine();
                this.storage = new StorageManager();
                this.collapseMenu = new CollapseMenu('emoji-toolbar', 10);
                this.activeMode = 'celtic-cross';
                this.activeCards = [];
                
                this.initGPUStats();
                this.drawSpread();
                this.renderHistory();
            }

            setSpread(mode) {
                this.activeMode = mode;
                document.getElementById('spread-select').value = mode;
                document.getElementById('active-spread-title').innerText = `${mode.toUpperCase()} READ`;
                this.drawSpread();
            }

            cycleSpread() {
                const modes = ['2-card', '3-card', '4-quadrant', 'celtic-cross'];
                const idx = (modes.indexOf(this.activeMode) + 1) % modes.length;
                this.setSpread(modes[idx]);
            }

            drawSpread() {
                this.audio.playCardFlip();
                const positions = SPREAD_POSITIONS[this.activeMode];
                const grid = document.getElementById('spread-grid');
                grid.className = `spread-grid ${this.activeMode}`;
                grid.innerHTML = '';

                // Shuffle & pick
                const shuffled = [...ARCANA_CARDS].sort(() => Math.random() - 0.5);
                this.activeCards = positions.map((posName, idx) => ({
                    positionName: posName,
                    card: shuffled[idx % shuffled.length]
                }));

                this.activeCards.forEach((item, idx) => {
                    const cardEl = document.createElement('div');
                    cardEl.className = `tarot-card ${this.activeMode === 'celtic-cross' && idx === 1 ? 'card-pos-2' : ''}`;
                    cardEl.innerHTML = `
                        <div class="card-pos">${item.positionName}</div>
                        <div class="card-icon">${item.card.icon}</div>
                        <div class="card-name">${item.card.name}</div>
                    `;
                    cardEl.onclick = () => {
                        this.audio.playCardFlip();
                        this.audio.speakOracle(`${item.positionName}: ${item.card.name}. ${item.card.meaning}`);
                    };
                    grid.appendChild(cardEl);
                });
            }

            speakCurrentSpread() {
                const speechText = `Reading ${this.activeMode}. ` + this.activeCards.map(c => `${c.positionName} is ${c.card.name}`).join('. ');
                this.audio.speakOracle(speechText);
            }

            toggleRain() {
                const btn = document.getElementById('rain-btn');
                const isPlaying = this.audio.toggleRain();
                btn.classList.toggle('active', isPlaying);
            }

            updateCollapseTimeout(val) {
                document.getElementById('collapse-val').innerText = `${val}s`;
                this.collapseMenu.updateTimeout(val);
            }

            updateRainVolume(val) {
                document.getElementById('vol-val').innerText = `${val}%`;
                this.audio.setRainVolume(val / 100);
            }

            updatePitch(val) {
                document.getElementById('pitch-val').innerText = val;
                this.audio.speechPitch = parseFloat(val);
            }

            saveCurrentReading() {
                this.storage.saveReading(this.activeMode, this.activeCards);
                this.renderHistory();
            }

            renderHistory() {
                const container = document.getElementById('history-container');
                const list = this.storage.getAllReadings();
                container.innerHTML = list.length === 0 ? '<div style="color:var(--text-muted); font-size:0.75rem;">No saved readings yet.</div>' : '';
                list.slice(0, 5).forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'history-item';
                    div.innerHTML = `<span><b>${item.spreadType}</b> (${item.timestamp})</span> <span>${item.cardCount} cards</span>`;
                    container.appendChild(div);
                });
            }

            exportHistory() {
                this.storage.exportToJSON();
            }

            initGPUStats() {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (gl) {
                    const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                    if (debugInfo) {
                        document.getElementById('gpu-vendor').innerText = gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL);
                        document.getElementById('gpu-renderer').innerText = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
                    } else {
                        document.getElementById('gpu-vendor').innerText = gl.getParameter(gl.VENDOR);
                        document.getElementById('gpu-renderer').innerText = gl.getParameter(gl.RENDERER);
                    }
                }
            }
        }

        // Initialize Application
        let app;
        window.addEventListener('DOMContentLoaded', () => {
            app = new Application();
        });
    </script>
</body>
</html>
