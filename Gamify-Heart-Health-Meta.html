ocks",range:[29,36],color:"#ff4d6d",scene:2,icon:"\uD83D\uDEA7"},{id:5,title:"Move & Muscle",range:[37,44],color:"#39d0ff",scene:5,icon:"\uD83E\uDDB5"},{id:6,title:"Healing & Reversal",range:[45,50],color:"#ffd166",scene:6,icon:"✨"}],w6=[{id:1,emoji:"\uD83D\uDC93",text:"Heart disease is silent for 20 years. 50% of first events have no warning - plaque builds without chest pain.",section:1,term:"Silent Plaque",sceneId:1},{id:2,emoji:"\uD83E\uDDEC",text:"ApoB counts every atherogenic particle. Lower ApoB below 60 mg/dL is optimal for plaque regression.",section:1,term:"ApoB",sceneId:1},{id:3,emoji:"\uD83D\uDD2C",text:"Lp(a) is 80% genetic and triples risk. Test once in life - if high, you need aggressive ApoB lowering.",section:1,term:"Lp(a)",sceneId:1},{id:4,emoji:"\uD83E\uDEC0",text:"Coronary Calcium Score is NOT plaque volume. Zero calcium can still mean soft plaque - you need CIMT.",section:1,term:"CAC",sceneId:2},{id:5,emoji:"\uD83D\uDCCF",text:"CIMT (Carotid Intima-Media Thickness) sees soft plaque directly. Arterial age > chronological age = red flag.",section:1,term:"CIMT",sceneId:2},{id:6,emoji:"\uD83E\uDDEB",text:"Lp-PLA2 marks inflamed, rupture-prone plaque. High Lp-PLA2 means your plaque is actively leaking.",section:1,term:"Lp-PLA2",sceneId:2},{id:7,emoji:"\uD83D\uDD25",text:"hs-CRP above 1.0 means systemic inflammation is driving plaque growth, even if cholesterol looks 'normal'.",section:1,term:"hs-CRP",sceneId:4},{id:8,emoji:"\uD83E\uDE78",text:"Fasting insulin >6 uIU/mL signals insulin resistance years before glucose rises. This is early engine failure.",section:1,term:"Insulin",sceneId:3},{id:9,emoji:"\uD83D\uDCC8",text:"OGTT with insulin at 1 & 2 hours reveals metabolic damage. Glucose >140 at 1 hour is not normal.",section:1,term:"OGTT",sceneId:3},{id:10,emoji:"\uD83E\uDDEE",text:"HOMA-IR above 1.5 means your liver is overproducing glucose. Calculate: (Glucose x Insulin)/405.",section:1,term:"HOMA-IR",sceneId:3},{id:11,emoji:"⚖️",text:"Visceral fat is the organ strangler. It surrounds liver and pancreas, driving inflammation directly into portal vein.",section:1,term:"Visceral Fat",sceneId:3},{id:12,emoji:"\uD83E\uDDB4",text:"DEXA scan shows visceral fat grams. Under 500g is goal. Waist:Height <0.5 predicts low visceral burden.",section:1,term:"DEXA",sceneId:3},{id:13,emoji:"\uD83C\uDF5E",text:"A single slice of bread spikes glucose to 140+ for 2 hours, bathing endothelium in sugar and triggering inflammation.",section:2,term:"Glucose Spike",sceneId:4},{id:14,emoji:"\uD83E\uDD63",text:"Oatmeal labeled 'heart healthy' often spikes higher than table sugar due to naked starch without fat or fiber.",section:2,term:"Glycemic Load",sceneId:4},{id:15,emoji:"\uD83E\uDDC3",text:"Endothelial glycocalyx is the Teflon lining. Sugar spikes shred it in minutes, exposing artery wall to plaque.",section:2,term:"Endothelium",sceneId:4},{id:16,emoji:"\uD83D\uDEE1️",text:"Time above 140 mg/dL matters more than A1c. Each hour above 140 increases Lp-PLA2 and oxidative stress.",section:2,term:"Endothelium",sceneId:4},{id:17,emoji:"\uD83E\uDD51",text:"Avocado and olive oil stabilize endothelium. Monounsaturated fat reduces post-meal inflammation by 40%.",section:2,term:"Endothelium",sceneId:4},{id:18,emoji:"\uD83D\uDC1F",text:"Salmon and sardines provide EPA/DHA that make plaque caps thicker and less likely to rupture.",section:2,term:"Omega-3",sceneId:4},{id:19,emoji:"\uD83E\uDD66",text:"Broccoli sprouts boost sulforaphane, which regrows glycocalyx. 1 cup of cruciferous daily drops CRP.",section:2,term:"Glycocalyx",sceneId:4},{id:20,emoji:"\uD83C\uDF53",text:"Berries and polyphenols blunt glucose spikes when eaten first. Vinegar before carbs cuts spike by 30%.",section:2,term:"Polyphenols",sceneId:4},{id:21,emoji:"⏱️",text:"Food order matters: veg first, protein/fat second, starch last cuts glucose peak by 50% without changing food.",section:3,term:"Food Order",sceneId:4},{id:22,emoji:"\uD83C\uDF73",text:"Protein at 30g per meal prevents muscle loss and keeps you full. Muscle is the glucose sink that protects arteries.",section:3,term:"Sarcopenia",sceneId:5},{id:23,emoji:"\uD83C\uDF19",text:"Eating after 7pm doubles glucose spike. Early time-restricted eating restores overnight plaque repair.",section:3,term:"Circadian",sceneId:3},{id:24,emoji:"\uD83E\uDDC8",text:"Seed oils high in linoleic acid oxidize inside LDL, making it more likely to be trapped in artery wall.",section:3,term:"Oxidized LDL",sceneId:4},{id:25,emoji:"\uD83E\uDD69",text:"Red meat is not the villain - insulin resistance is. Steak with low insulin causes far less inflammation than bread.",section:3,term:"Insulin",sceneId:4},{id:26,emoji:"\uD83E\uDDC2",text:"Sodium is not the main blood pressure driver. Insulin resistance stiffens arteries far more than salt.",section:3,term:"Insulin",sceneId:1},{id:27,emoji:"☕",text:"Coffee and green tea improve endothelial function within 30 minutes due to chlorogenic acids.",section:3,term:"Endothelium",sceneId:4},{id:28,emoji:"\uD83D\uDCA7",text:"Dehydration thickens blood and raises ApoB concentration. 2.5L water daily lowers viscosity.",section:3,term:"Viscosity",sceneId:1},{id:29,emoji:"\uD83D\uDE34",text:"Sleep apnea raises nighttime blood pressure 30 points and doubles plaque progression. Snoring = test now.",section:4,term:"Sleep Apnea",sceneId:1},{id:30,emoji:"\uD83D\uDE30",text:"Chronic stress raises cortisol which raises insulin and visceral fat. One stressful email can raise glucose 20 points.",section:4,term:"Cortisol",sceneId:3},{id:31,emoji:"\uD83E\uDDB7",text:"Bleeding gums leak bacteria into blood, raising Lp-PLA2. Periodontal disease adds 20% CVD risk.",section:4,term:"Lp-PLA2",sceneId:2},{id:32,emoji:"\uD83D\uDEAC",text:"Even one vape session destroys nitric oxide for 6 hours. Without nitric oxide, arteries cannot dilate.",section:4,term:"Nitric Oxide",sceneId:4},{id:33,emoji:"\uD83C\uDF7A",text:"Alcohol pauses fat burning for 72 hours and converts directly to visceral fat via liver.",section:4,term:"Visceral Fat",sceneId:3},{id:34,emoji:"\uD83D\uDC8A",text:"Statins lower ApoB but can raise insulin 10-12%. Pair with muscle work and berberine monitoring.",section:4,term:"ApoB",sceneId:6},{id:35,emoji:"\uD83E\uDDE0",text:"Microplastics found in plaque increase rupture risk 4.5x. Filter water, avoid heating plastic.",section:4,term:"Endothelium",sceneId:4},{id:36,emoji:"\uD83E\uDDF4",text:"Low vitamin D below 40 ng/mL impairs calcium handling, pushing calcium into artery wall instead of bone.",section:4,term:"Vitamin D",sceneId:6},{id:37,emoji:"\uD83E\uDDB5",text:"Legs are the glucose engine - 70% of glucose disposal. Giant quads can clear 80g carbs without insulin spike.",section:5,term:"Muscle",sceneId:5},{id:38,emoji:"\uD83C\uDFCB️",text:"Wall sits to failure drop systolic BP 12 points in 2 weeks. Isometric contraction builds nitric oxide.",section:5,term:"Nitric Oxide",sceneId:5},{id:39,emoji:"⚡",text:"REHIT: 2x20 second all-out sprints improves insulin sensitivity 28% in 2 weeks with 10 min/week.",section:5,term:"Mitochondria",sceneId:5},{id:40,emoji:"\uD83D\uDEB6",text:"10-min walk after eating cuts glucose peak 22%. Muscle contraction pulls glucose via GLUT4 without insulin.",section:5,term:"GLUT4",sceneId:5},{id:41,emoji:"\uD83D\uDD0B",text:"Mitochondria in muscle burn fat. More mitochondria = less visceral fat. Zone 2 builds mitochondria.",section:5,term:"Mitochondria",sceneId:5},{id:42,emoji:"\uD83E\uDDD7",text:"Grip strength predicts heart death better than blood pressure. If grip <40kg, prioritize strength now.",section:5,term:"Sarcopenia",sceneId:5},{id:43,emoji:"\uD83E\uDEC1",text:"VO2max is #1 longevity predictor. Every 3.5 ml/kg increase cuts mortality 13%. Train breathlessness weekly.",section:5,term:"VO2max",sceneId:5},{id:44,emoji:"\uD83C\uDFC3",text:"Sitting 8 hours is arterial aging. 2 minutes movement every 30 min restores endothelial shear stress.",section:5,term:"Endothelium",sceneId:5},{id:45,emoji:"\uD83D\uDCC9",text:"Soft plaque can shrink 0.1 mm³ in 3 months when ApoB <60 and insulin <6. This is measurable on CIMT.",section:6,term:"CIMT",sceneId:6},{id:46,emoji:"\uD83E\uDD0D",text:"Calcified plaque is stable scar. We want to convert soft yellow plaque to hard white calcium - stable plumbing.",section:6,term:"Calcification",sceneId:6},{id:47,emoji:"\uD83D\uDC8A",text:"Vitamin D3 5000 IU + K2 MK-7 200mcg directs calcium to bone, not arteries. Test 25-OH and aim 50-60 ng/mL.",section:6,term:"Vitamin D",sceneId:6},{id:48,emoji:"\uD83D\uDC1F",text:"Omega-3 index >8% stabilizes plaque. 2g EPA/DHA daily drops triglycerides and Lp-PLA2 within weeks.",section:6,term:"Omega-3",sceneId:6},{id:49,emoji:"\uD83C\uDF3F",text:"Berberine and magnesium improve insulin sensitivity. Magnesium deficiency present in 70% with metabolic syndrome.",section:6,term:"Insulin",sceneId:6},{id:50,emoji:"\uD83C\uDFAF",text:"Goal: wide open plumbing. ApoB <60, visceral fat <500g, glucose never >140, arterial age < actual age. Re-test CIMT yearly.",section:6,term:"Arterial Age",sceneId:6}],kH=[{term:"CIMT",def:"Carotid Intima-Media Thickness ultrasound that visualizes soft plaque and arterial age.",emoji:"\uD83D\uDCCF"},{term:"ApoB",def:"Apolipoprotein B - count of all plaque-causing particles. Best predictor of risk.",emoji:"\uD83E\uDDEE"},{term:"Lp(a)",def:"Lipoprotein(a) - sticky, genetic particle that triples risk. Test once.",emoji:"\uD83E\uDDEC"},{term:"Lp-PLA2",def:"Enzyme released by inflamed plaque. Marks rupture-prone lesions.",emoji:"\uD83E\uDDEB"},{term:"Visceral Fat",def:"Fat around organs inside abdomen. Drives insulin resistance directly.",emoji:"⚖️"},{term:"DEXA",def:"Body scan that quantifies visceral fat grams and muscle mass.",emoji:"\uD83E\uDDB4"},{term:"OGTT",def:"Oral Glucose Tolerance Test with insulin - reveals early metabolic failure.",emoji:"\uD83D\uDCC8"},{term:"Endothelium",def:"Single-cell lining of arteries. Damage starts plaque.",emoji:"\uD83E\uDDC3"},{term:"Glycocalyx",
