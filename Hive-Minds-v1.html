<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Hive Mind PLI Deck</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&family=Newsreader:ital,opsz,wght@1,6..72,400;1,6..72,500&display=swap">
<style>
/* Layout: one-screen presenter. Top rail (act · slide · 60s timer · library/map/export) → stage → bottom rail.
   Slide = epigraph + live SVG visual (left) + points & reference (right) + prompt/media + speaker notes.
   Honey = hive accent; teal = clinical secondary; Newsreader italic only for epigraphs and the library. */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --ink:#132030; --muted:#56657A; --line:#D5DCE6;
  --honey:#A86C00; --honey-soft:#F7E8C6; --teal:#0C7471; --teal-soft:#D5EFEE; --warn:#B4361F;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-serif:"Newsreader","Iowan Old Style","Georgia",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C131B; --surface:#141F2A; --ink:#E7EDF4; --muted:#91A0B2; --line:#243241;
  --honey:#F2B33D; --honey-soft:#3A2B0E; --teal:#45C4BC; --teal-soft:#0F2E2E; --warn:#FF7A5C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C131B; --surface:#141F2A; --ink:#E7EDF4; --muted:#91A0B2; --line:#243241;
  --honey:#F2B33D; --honey-soft:#3A2B0E; --teal:#45C4BC; --teal-soft:#0F2E2E; --warn:#FF7A5C; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;display:flex;flex-direction:column;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:var(--teal)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--honey);outline-offset:2px}

.rail{display:flex;align-items:center;gap:10px;padding-block:9px;flex-wrap:wrap}
.rail.top{border-bottom:1px solid var(--line)}
.rail.bottom{border-top:1px solid var(--line);justify-content:space-between}
.brand{font-family:var(--f-display);font-weight:800;font-size:15px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.actlabel{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.count{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.timer{display:flex;align-items:center;gap:6px;background:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 4px;cursor:pointer}
.timer svg{width:26px;height:26px;transform:rotate(-90deg)}
.timer .trk{fill:none;stroke:var(--line);stroke-width:4}
.timer .arc{fill:none;stroke:var(--honey);stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset .9s linear}
.timer.over .arc{stroke:var(--warn)}
.timer .t{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px;min-width:3.2ch}
.timer.over .t{color:var(--warn)}
.progress{height:3px;background:var(--line);position:relative}
.progress i{position:absolute;inset:0 auto 0 0;background:var(--honey);transition:width .25s}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:14px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--honey)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--honey);border-color:var(--honey);color:var(--bg);font-weight:700}
.btn.lib{background:var(--teal);border-color:var(--teal);color:var(--bg);font-weight:700}
.btn.sm{padding:3px 8px;font-size:12.5px}
.btn[aria-pressed="true"]{background:var(--honey-soft);border-color:var(--honey)}
.navgroup{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hint{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
@media (max-width:700px){.hint,.actlabel{display:none}}

main{flex:1;min-height:0;overflow:auto;padding-block:18px}
.frame{max-width:1220px;margin:0 auto;animation:in .28s ease-out both}
@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.frame{animation:none}.progress i,.timer .arc{transition:none}}

.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.eyebrow b{color:var(--honey);font-weight:600}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
.slide h2{font-size:clamp(25px,3.3vw,42px);line-height:1.08;font-weight:700;margin-top:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:12.5px;border-radius:999px;padding:3px 11px;border:1px solid var(--line);background:var(--surface)}
.chip.key{background:var(--honey-soft);border-color:transparent}
.chip.key b{color:var(--honey)}
.chip.plan{color:var(--teal)}

.epi{margin:14px 0 0;padding:0 0 0 16px;border-left:2px solid var(--honey);max-width:80ch}
.epi q{font-family:var(--f-serif);font-style:italic;font-size:clamp(17px,1.6vw,21px);line-height:1.35;quotes:"“" "”"}
.epi cite{display:block;font-style:normal;font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:4px}

.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;margin-top:18px}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}

.vis{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.vis .bar{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.vis .bar .lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);flex:1;min-width:120px}
.vis svg{display:block;width:100%;height:auto;touch-action:none}
.vis pre{margin:0;padding:14px;font-family:var(--f-mono);font-size:12.5px;line-height:1.5;overflow:auto;max-height:360px;background:var(--bg);white-space:pre}

.pts{width:100%;border-collapse:collapse;font-size:clamp(15px,1.3vw,17px)}
.pts th{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600;padding:0 8px 7px;border-bottom:2px solid var(--ink)}
.pts td{padding:11px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.pts td.n{font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--honey);width:2ch;padding-left:0}
.pts td.d{font-family:var(--f-mono);font-size:12.5px;color:var(--teal)}

.refcard{background:var(--teal-soft);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.refcard .lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);font-weight:600;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.refcard .pt{font-family:var(--f-serif);font-style:italic;font-size:18px;line-height:1.3}
.refcard .meta{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.refcard .links{display:flex;gap:12px;flex-wrap:wrap;font-size:14px}

.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:16px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.box .lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.box code{font-family:var(--f-mono);font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-word;user-select:all}
.box .row{display:flex;justify-content:space-between;align-items:center;gap:8px}

.media{border:1.5px dashed var(--line);border-radius:10px;min-height:120px;display:grid;place-items:center;text-align:center;position:relative;overflow:hidden}
.media.drag{border-color:var(--honey);background:var(--honey-soft)}
.media img,.media video{width:100%;max-height:300px;object-fit:contain;display:block}
.media .ph{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px}
.media .fn{font-family:var(--f-mono);font-size:13px}
.media .sub{font-size:13px;color:var(--muted)}
.media .clear{position:absolute;top:6px;right:6px}
.media input{position:absolute;width:1px;height:1px;opacity:0}

.extra{margin-top:18px}
.extra h3{font-size:19px;margin-bottom:8px}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:14px;min-width:620px}
.tbl th{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:2px solid var(--ink);white-space:nowrap}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td:first-child{white-space:nowrap;font-family:var(--f-mono);font-size:13px}
.note{font-size:13px;color:var(--muted)}
.steps5{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.steps5 li{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.steps5 li b{font-family:var(--f-display);font-size:16px}
.steps5 li.hot{border-color:var(--honey);background:var(--honey-soft)}
.steps5 .k{font-family:var(--f-mono);font-size:11px;color:var(--honey)}

.notes{margin-top:18px;border-top:1px dashed var(--line);padding-top:10px}
.notes summary{cursor:pointer;font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.notes p{margin:8px 0 0;font-size:16px;max-width:90ch}

.hero{display:flex;flex-direction:column;gap:16px;padding-block:2vh}
.hero h1{font-size:clamp(32px,5.4vw,70px);line-height:1.02;font-weight:800;letter-spacing:-.01em}
.hero h1 em{font-style:normal;color:var(--honey)}
.hero .lede{font-size:clamp(17px,1.7vw,20px);max-width:64ch;color:var(--muted)}
.formula{display:flex;gap:8px;flex-wrap:wrap}
.formula span{font-family:var(--f-mono);font-size:13px;border:1px solid var(--line);border-radius:999px;padding:4px 11px;background:var(--surface)}
.formula span b{color:var(--honey)}
.titlegrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:24px;align-items:center}
@media (max-width:900px){.titlegrid{grid-template-columns:1fr}}

.divider{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:start;padding-block:2vh}
@media (max-width:700px){.divider{grid-template-columns:1fr}}
.roman{font-family:var(--f-display);font-weight:800;font-size:clamp(80px,13vw,160px);line-height:.85;color:var(--honey)}
.divider h2{font-size:clamp(28px,4.2vw,50px);line-height:1.05}
.divider .why{color:var(--muted);font-size:18px;max-width:58ch;margin-top:10px}
.rooms{list-style:none;padding:0;margin:20px 0 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.rooms li{display:flex;gap:10px;align-items:baseline;padding:8px 10px;border-radius:8px;background:var(--surface);border:1px solid var(--line);cursor:pointer}
.rooms li:hover{border-color:var(--honey)}
.rooms .k{font-family:var(--f-mono);font-size:12px;color:var(--honey);min-width:2.4ch;font-variant-numeric:tabular-nums}
.steps{list-style:none;padding:0;margin:0;display:grid;gap:4px;max-width:780px;counter-reset:s}
.steps li{display:grid;grid-template-columns:2.2ch minmax(0,1fr);gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.steps li::before{counter-increment:s;content:counter(s);font-family:var(--f-display);font-weight:800;color:var(--honey);font-size:20px;line-height:1.2}

.overlay{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;
  padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ovhead{display:flex;justify-content:space-between;align-items:center;gap:12px;max-width:1100px;margin:0 auto 14px;flex-wrap:wrap}
.ovhead h2{font-size:24px}
.comb{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:6px;overflow-x:auto;padding-bottom:8px}
.combrow{display:flex;gap:6px;align-items:center}
.combrow:nth-child(even){padding-left:52px}
.rowlbl{width:96px;flex:none;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);line-height:1.2}
.hex{width:104px;height:116px;flex:none;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--surface);border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:14px 10px;text-align:center;position:relative}
.hex::before{content:"";position:absolute;inset:0;clip-path:inherit;box-shadow:inset 0 0 0 2px var(--line);pointer-events:none}
.hex .e{font-size:22px;line-height:1}
.hex .no{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.hex .tt{font-size:10.5px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hex.seen{background:var(--teal-soft)} .hex.cur,.hex:hover{background:var(--honey-soft)}

/* Study Library: thesis-style bibliography */
.library{max-width:880px;margin:0 auto}
.library .front{text-align:center;padding-block:10px 18px;border-bottom:1px solid var(--line)}
.library .front h2{font-size:clamp(28px,4vw,42px)}
.library .front p{font-family:var(--f-serif);font-style:italic;font-size:18px;color:var(--muted);margin:6px 0 0}
.libtools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.libtools input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;min-width:0;width:min(320px,100%)}
.toc{columns:2 240px;gap:24px;font-size:14px;margin:18px 0;padding:0;list-style:none}
.toc li{break-inside:avoid;padding:2px 0}
.chapter{margin-top:28px}
.chapter h3{font-size:22px;display:flex;gap:10px;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:6px}
.chapter h3 .cn{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--honey)}
.bib{list-style:none;margin:10px 0 0;padding:0}
.bib li{display:grid;grid-template-columns:4.2ch minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.bib .no{font-family:var(--f-mono);font-size:13px;color:var(--honey);font-variant-numeric:tabular-nums;padding-top:2px}
.bib .t{font-family:var(--f-serif);font-style:italic;font-size:17px;line-height:1.35}
.bib .m{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
.bib .kw{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.bib .kw span{font-family:var(--f-mono);font-size:11px;background:var(--honey-soft);border-radius:999px;padding:1px 8px}
.bib .q{font-family:var(--f-serif);font-style:italic;font-size:16px}

.menu{position:fixed;z-index:25;top:calc(56px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;width:min(330px,calc(100vw - 32px));box-shadow:0 10px 30px color-mix(in srgb,var(--ink) 18%,transparent)}
.menu[hidden],.toast[hidden],.overlay[hidden]{display:none}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.badge{display:flex;align-items:center;gap:8px;background:var(--honey-soft);border-radius:12px;padding:3px 12px 3px 8px}
.badge .be{font-size:30px;line-height:1}
.badge .bn{display:flex;flex-direction:column;line-height:1.05}
.badge .bn b{font-family:var(--f-display);font-size:20px;font-weight:800;color:var(--honey);font-variant-numeric:tabular-nums}
.badge .bn small{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.rail.top .timer svg{width:34px;height:34px}
.rail.top .timer .t{font-size:16px;font-weight:600}
.srcs{display:flex;gap:8px;flex-wrap:wrap;align-items:center;min-width:0;flex:1}
.srcs .btn{max-width:min(340px,40vw);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;display:inline-block}
.nextbtn{padding:9px 24px;font-size:16px}
.vis.full svg{max-height:min(58vh,640px)}
.pt3{gap:8px}
.pt3 .n{font-family:var(--f-display);font-weight:800;font-size:28px;color:var(--honey);line-height:1}
.pt3 .ptx{font-size:17px;line-height:1.4}
.pt3 .chip{align-self:flex-start}
@media (max-width:700px){.tools .tl,.brand,#auto,#fs{display:none}.badge .be{font-size:24px}.rail.top{flex-wrap:nowrap;gap:6px}.rail.top .timer svg{width:28px;height:28px}.rail.top .timer .t{font-size:14px}.badge{padding:3px 8px 3px 6px}}
.vis.wide .scroller{overflow-x:auto}
.vis.wide svg{min-width:760px;touch-action:pan-x pan-y}
.btn.ytbtn{background:var(--honey);border-color:var(--honey);color:var(--bg);font-weight:700;text-decoration:none}
.vrow{font-size:13.5px;line-height:1.35}
.vrow .st{font-family:var(--f-serif);font-style:italic}
.vrow .vc{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.btn.pdfbtn{background:var(--teal);border-color:var(--teal);color:var(--bg);font-weight:700;text-decoration:none}
.sup{display:flex;flex-direction:column;gap:5px;border-top:1px solid color-mix(in srgb,var(--teal) 30%,transparent);padding-top:8px;margin-top:4px}
.sup .lbl2{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal)}
.suprow{font-size:13.5px;line-height:1.35}
.suprow .st{font-family:var(--f-serif);font-style:italic}
.suprow a{font-family:var(--f-mono);font-size:12px;white-space:nowrap}
.suprow a[data-slide],.suprow a[data-go]{margin-left:6px}
.tri{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.tri pre,.pair pre{margin:0;font-family:var(--f-mono);font-size:12px;line-height:1.5;white-space:pre-wrap;word-break:break-word;background:var(--bg);border-radius:8px;padding:8px 10px}
.sect{margin-top:22px}
.sect>h3{font-size:19px;margin-bottom:10px}
.whylist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.whylist li{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.whylist b{font-family:var(--f-display)}
.menu .lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.menu p{margin:0;font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;z-index:30;max-width:calc(100vw - 32px)}
</style>

<header>
  <div class="rail top">
    <div class="brand">🐝 Hive Mind PLI</div>
    <div class="actlabel" id="actlabel"></div>

# 📄 → 📝 → 🧠 → 🚀 Progressive Longitudinal Model Building

> **Thesis.** Read everything in the wild, PDFs first. Distill it into Markdown, the root format that can hold any structure. Pair each Markdown dataset with a Markdown specification. Let an ensemble of models rewrite one progressive, longitudinal Markdown model. Then distribute that model as three runnable formats, a PDF, an HTML app, and a Python + Streamlit app, kept in sync idempotently. Every cycle rewrites the book.

---

## 🗺️ The pattern in one picture

```mermaid
flowchart TB
  A["① 📄 Read everything<br/>PDF · HTML · scans · email"]
  B["② 🔍 RAG transforms it<br/>extract · annotate · fortify · inject spec"]
  C["③ 📝 Markdown root<br/>tables · outlines · fenced sections"]
  D["④ 📗 Dataset.md + 📘 Spec.md<br/>facts + expert instructions and lattice"]
  E["⑤ 👁️ Vision model → 🧠 Reasoning model"]
  F[("♾️ PLM.md<br/>progressive · longitudinal")]
  subgraph G["⑥ 🚀 Distribute as runnable formats · idempotent sync"]
    O1["📄 PDF"]
    O2["🌐 HTML app"]
    O3["🐍 Python + Streamlit app"]
  end
  A --> B --> C --> D --> E --> F
  F --> O1
  F --> O2
  F --> O3
  O1 -.->|"♻️ back into the wild"| A
  F -.->|"🔁 new and changed documents"| B
```

---

## 🔢 The six stages

1. **📄 Read everything in the wild.** Datasets are born as PDFs, the documents people actually receive and read each day. They also arrive as HTML, scans, slides, images, and email. The pattern treats all of it as raw data and starts where people start: reading.
2. **🔍 Transform with RAG.** Retrieval-augmented generation is used as *transformative* intelligence, not only for lookup. Each source is **extracted, annotated, fortified, and injected with specification**. Visual parts such as tables, outlines, clusters, and spatial arrangements are converted into structured Markdown.
3. **📝 Rest in Markdown.** Everything lands in one shared, continually growing Markdown format. Structured and unstructured content can both be mapped there, across modalities, and kept in a stable resting state.
4. **📗📘 Pair the dataset with a specification.** One Markdown file (the dataset) goes to the AI with a second Markdown file (the specification). The specification has two parts:
   1. **🎓 Processing instructions:** the expert specialties that decide how the information is distilled.
   2. **🦴 A lattice or skeleton:** the target structure, usually a Markdown outline or a Markdown table, that the distilled information fills.
5. **👁️🧠 Run an ensemble into PLM.md.** A vision model reads layout, tables, and figures under its own specification. A long-form reasoning model then distills and reconciles the result under a second specification and writes **PLM.md**, one progressive longitudinal Markdown model. Updates are **idempotent** (re-reading the same document changes nothing) and **cumulative** (new and changed documents, found by RAG, add to the model without rebuilding it).
6. **🚀 Distribute as runnable formats.** PLM.md is rendered into three runnables: **📄 PDF**, an **🌐 HTML app**, and a **🐍 Python + Streamlit app**. Each one can be changed while people are using it. When information changes, all three are regenerated idempotently from the same PLM.md, so they stay in sync. Python arrives at the end, as a product of the model rather than its starting point. The runnables go back into the wild, so the book is rewritten each time the distillation runs.

---

## 🧱 The three distillation structures

Markdown is the root because it can contain every other form. Three structures carry nearly all of it:

| # | Structure | What it captures | Example use |
|---|---|---|---|
| 1 | ▦ **Table** | Records, attributes, comparisons | Members × measures, papers × keywords |
| 2 | ☰ **Multilevel outline** | Hierarchy, sequence, containment | Chapters, care plans, specs |
| 3 | § **Content-agnostic section** | Any other language, verbatim | JSON, Python, HTML, SVG, Mermaid |

The third structure matters most later on. A fenced section lets one Markdown file carry runnable code and machine-readable data next to the prose that explains them, which is how the HTML app and the Python + Streamlit app can both be generated from the same model:

````markdown
## 🧾 Member 0042 — longitudinal summary

| Date | Event | Source |
|---|---|---|
| 2026-03-02 | A1c 8.1 | lab_0302.pdf |
| 2026-06-10 | A1c 7.2 | lab_0610.pdf |

- Care plan
  - Diabetes
    - Metformin continued
    - Next A1c due 2026-09

```json
{"member": "0042", "a1c_trend": [8.1, 7.2], "version": 7}
```
````

---

## 📗📘 The binary pairing, in practice

````markdown
<!-- spec.md -->
# Specification: quarterly care-gap distillation

## 🎓 Processing instructions
- Act as a clinical documentation specialist and a quality-measure analyst.
- Prefer the most recent dated value; keep every source file name.
- Never invent a value; mark gaps as `—`.

## 🦴 Lattice
| Member | Measure | Last value | Date | Gap? | Source |
|---|---|---|---|---|---|
````

The dataset Markdown supplies the facts. The specification supplies the expertise and the shape. The model's only job is to fill the lattice correctly.

---

## ❓ Why it works

- **🌱 Markdown is the root.** Instruction-tuned language models learn from conversational data that is largely Markdown-shaped: headings, lists, tables, and fenced code. Markdown is lighter than HTML markup, yet it can still contain HTML, JSON, Python, and SVG inside fenced sections.
- **♾️ Progressive and longitudinal.** The model grows with time instead of being rebuilt. Each cycle is idempotent and cumulative, so history is kept and only new or changed inputs cost work.
- **🧑‍🤝‍🧑 Ensemble plus specification.** Splitting perception (vision) from distillation (reasoning) and giving each its own specification makes every step testable.
- **🚀 Three runnables, one source.** PDF is how people receive and trust documents, HTML is how anyone with a browser sees and uses it, and Python + Streamlit is how data systems run it. All three are regenerated from the same PLM.md, so a change made once reaches every channel and they never drift apart.

      <section class="sect"><h3>❓ Why it works</h3><ul class="whylist">
        <li><b>🌱 Markdown is the root.</b> Instruction-tuned models learn from data shaped like Markdown: headings, lists, tables, and fenced code. It is lighter than HTML markup, yet it can contain HTML, JSON, Python, and SVG.</li>
        <li><b>♾️ Progressive and longitudinal.</b> The model grows with time instead of being rebuilt. Each cycle is idempotent and cumulative, so only new or changed inputs cost work.</li>
        <li><b>🧑‍🤝‍🧑 Ensemble plus specification.</b> Separating perception (vision) from distillation (reasoning), each with its own spec, makes every step testable.</li>

    S.forEach((s,si)=>{if(s.a!==ai)return;const mm=mermaidOf(s.vis);
      o+=`### Slide ${si+2}. ${s.e} ${s.t}\n\n\`🔑 ${s.g}\` · 🎞️ \`${s.m}\` · ${planOf(s.vis)}\n\n> “${s.q[0]}”\n> — ${s.q[1]}${s.q[2]?", "+s.q[2]:""}\n\n| | 🎯 Point | 🗝️ Distilled |\n|---|---|---|\n${s.p.map((p,i)=>`| ${["1️⃣","2️⃣","3️⃣"][i]} | ${p[0]} | ${p[1]} |`).join("\n")}\n\n`;
      if(mm)o+="```mermaid\n"+mm+"```\n\n";
      if(s.x==="age")o+=`| 🔢 | 🙂 | 📅 Band | 🩺 Conditions | 💊 Treatments |\n|---|---|---|---|---|\n${AGES.map(a=>`| ${a[0]} | ${a[1]} | ${a[2]} | ${a[3]} | ${a[4]} |`).join("\n")}\n\n`;
      o+=`📚 **Ref [${si+2}]** _${s.r[0]}_ — ${refMeta(s)} — ${refUrl(s)}${(SUP[si+1]||[]).map(id=>{const r=refInfo(id);return `\n➕ _${r.title}_ — ${r.url}${r.si!==undefined?` (also slide ${r.si+2})`:""}`}).join("")}${s.v?`\n▶️ **Watch:** ${V[s.v][0]} (${V[s.v][2]}) — ${V[s.v][1]}`:""}\n\n📋 **Prompt:** ${s.pr}\n\n${s.img?`🎨 **Image prompt:** ${s.img}\n\n`:""}🗒️ **Notes:** ${s.n}\n\n`})});
  o+=`---\n\n## 📚 Study Library\n\n${S.map((s,i)=>`${i+1}. _${s.r[0]}_ — ${refMeta(s)} — ${refUrl(s)}`).join("\n")}\n\n### ➕ Further reading\n\n${BONUS.map((b,i)=>`- [B${i+1}] ${b[0]} _${b[1]}_ — https://arxiv.org/pdf/${b[2]}`).join("\n")}\n\n### ▶️ Lectures and talks\n\n${PRO_V.map(v=>`- Slide 1: ${v[0]} (${v[2]}) — ${ytu(v[1])}`).join("\n")}\n${S.map((s,i)=>`- Slide ${i+2}: ${V[s.v][0]} (${V[s.v][2]}) — ${V[s.v][1]}`).join("\n")}\n\n### 🖋️ Epigraphs\n\n${S.map((s,i)=>`- “${s.q[0]}” — ${s.q[1]} (slide ${i+1})`).join("\n")}\n`;return o}
const vbox=svg=>{const v=(svg.getAttribute("viewBox")||`0 0 ${W} ${H}`).split(/\s+/).map(Number);return [v[2],v[3]]};
function svgString(svg){const c=svg.cloneNode(true);const [vw,vh]=vbox(svg);c.setAttribute("xmlns",NS);c.setAttribute("width",vw*2);c.setAttribute("height",vh*2);return '<?xml version="1.0" encoding="UTF-8"?>\n'+new XMLSerializer().serializeToString(c)}
function rasterize(svg,scale=2.5){return new Promise((res,rej)=>{const url=URL.createObjectURL(new Blob([svgString(svg)],{type:"image/svg+xml"}));const img=new Image();
  img.onload=()=>{const [vw,vh]=vbox(svg);const cv=document.createElement("canvas");cv.width=vw*scale;cv.height=vh*scale;const g=cv.getContext("2d");g.drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(url);res(cv)};img.onerror=rej;img.src=url})}
function stillSVG(vis){const tmp=document.createElement("div");tmp.style.cssText="position:fixed;left:-9999px;top:0;width:"+(vis.vw||640)+"px";document.body.appendChild(tmp);const o=drawVis(tmp,vis,true);return {svg:o.svg,done:()=>tmp.remove()}}
function latin(s){return String(s).replace(/[→⇄↔]/g,"->").replace(/←/g,"<-").replace(/[⊂]/g," in ").replace(/≈/g,"~").replace(/[–—]/g,"-").replace(/[“”]/g,'"').replace(/[‘’]/g,"'").replace(/…/g,"...").replace(/·/g,"-").replace(/[^\x00-\xFF]/g,"").replace(/\s{2,}/g," ").trim()}
let pdfLib=null;function loadPDF(){if(pdfLib)return pdfLib;pdfLib=new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";s.onload=()=>res(window.jspdf.jsPDF);s.onerror=()=>{pdfLib=null;rej()};document.head.appendChild(s)});return pdfLib}
async function makePDF(){toast("📄 Building PDF with 49 rendered visuals…");let jsPDF;try{jsPDF=await loadPDF()}catch(e){toast("Couldn't load the PDF library.");return null}
  const doc=new jsPDF({orientation:"landscape",unit:"pt",format:"letter"});const PW=792,PH=612,M=36;const hex=s=>{const c=document.createElement("canvas").getContext("2d");c.fillStyle=s;return c.fillStyle};
  const ink="#132030",honey="#A86C00",teal="#0C7471",muted="#56657A";
  doc.setFont("helvetica","bold");doc.setFontSize(30);doc.setTextColor(ink);doc.text(doc.splitTextToSize("Distributed Hive Mind Agentic Workflows for Progressive Longitudinal Intelligence",PW-2*M),M,150);
  doc.setFont("helvetica","normal");doc.setFontSize(14);doc.setTextColor(muted);doc.text("7 acts x 7 slides = 49 minutes. Slides, visuals, references, and speaker notes.",M,260);
  const prev=document.documentElement.getAttribute("data-theme");document.documentElement.setAttribute("data-theme","light");
  doc.addPage();doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(honey);doc.text("SLIDE 1 / 50 - THE THESIS",M,M);
  doc.setFont("helvetica","bold");doc.setFontSize(18);doc.setTextColor(ink);doc.text("Progressive Longitudinal Model Building",M,M+22);
  try{const st=stillSVG(PLM_VIS);const cv=await rasterize(st.svg,1.6);st.done();doc.addImage(cv.toDataURL("image/png"),"PNG",M,M+34,PW-2*M,(PW-2*M)*560/960)}catch(e){}
  doc.addPage();doc.setFont("helvetica","bold");doc.setFontSize(16);doc.setTextColor(ink);doc.text("The six stages",M,M+10);{let yy=M+34;
    PRO_STAGES.forEach((st,i)=>{doc.setFont("helvetica","bold");doc.setFontSize(11);const h=doc.splitTextToSize(latin(`${i+1}. ${st[0]}`),PW-2*M);doc.text(h,M,yy);yy+=h.length*13;
      doc.setFont("helvetica","normal");doc.setFontSize(10.5);const b=doc.splitTextToSize(latin(st[1]),PW-2*M);doc.text(b,M,yy);yy+=b.length*13+8});
    yy+=6;doc.setFont("helvetica","bold");doc.setFontSize(10);doc.setTextColor(teal);doc.text("REFERENCES",M,yy);yy+=14;
    PRO_R.forEach(id=>{const r=refInfo(id);doc.setFont("helvetica","normal");doc.setFontSize(9.5);doc.setTextColor(ink);doc.text(doc.splitTextToSize(latin(r.title),PW-2*M)[0],M,yy);yy+=11;doc.setTextColor(muted);doc.textWithLink(r.url,M,yy,{url:r.url});yy+=15});
    yy+=4;doc.setFont("helvetica","bold");doc.setFontSize(10);doc.setTextColor(honey);doc.text("WATCH",M,yy);yy+=14;
    PRO_V.forEach(v=>{doc.setFont("helvetica","normal");doc.setFontSize(9.5);doc.setTextColor(ink);doc.text(latin(v[0]+" - "+v[2]),M,yy);yy+=11;doc.setTextColor(muted);doc.textWithLink(ytu(v[1]),M,yy,{url:ytu(v[1])});yy+=15})}
  for(let si=0;si<S.length;si++){const s=S[si];doc.addPage();
    doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(honey);doc.text(latin(`SLIDE ${si+2} / 50 - ACT ${ACTS[s.a].r} - ${ACTS[s.a].name.toUpperCase()}`),M,M);
    doc.setFont("helvetica","bold");doc.setFontSize(18);doc.setTextColor(ink);const tl=doc.splitTextToSize(latin(s.t),PW-2*M);doc.text(tl,M,M+22);let y=M+22+tl.length*20;
    doc.setFont("times","italic");doc.setFontSize(11.5);doc.setTextColor(ink);const ql=doc.splitTextToSize(latin(`"${s.q[0]}" - ${s.q[1]}${s.q[2]?", "+s.q[2]:""}`),PW-2*M);doc.text(ql,M,y);y+=ql.length*14+8;
    try{const st=stillSVG(s.vis);const cv=await rasterize(st.svg,2);st.done();const iw=400,ih=iw*H/W;doc.addImage(cv.toDataURL("image/png"),"PNG",M,y,iw,ih);}catch(e){}
    let ry=y,rx=M+420,rw=PW-rx-M;doc.setFont("helvetica","bold");doc.setFontSize(10);doc.setTextColor(teal);doc.text(latin(`KEY: ${s.g}`),rx,ry+10);ry+=26;
    doc.setFont("helvetica","normal");doc.setFontSize(10.5);doc.setTextColor(ink);s.p.forEach((p,i)=>{const l=doc.splitTextToSize(latin(`${i+1}. ${p[0]} [${p[1]}]`),rw);doc.text(l,rx,ry);ry+=l.length*13+5});
    ry+=6;doc.setFont("helvetica","bold");doc.setFontSize(9);doc.setTextColor(teal);doc.text(`REF [${si+2}]`,rx,ry);ry+=12;doc.setFont("times","italic");doc.setFontSize(10.5);doc.setTextColor(ink);
    const rl=doc.splitTextToSize(latin(s.r[0]),rw);doc.text(rl,rx,ry);ry+=rl.length*12+2;doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(muted);doc.text(latin(refMeta(s)),rx,ry);ry+=11;doc.textWithLink(refUrl(s),rx,ry,{url:refUrl(s)});ry+=14;
    (SUP[si+1]||[]).forEach(id=>{const r=refInfo(id);doc.setFont("helvetica","normal");doc.setFontSize(8.5);doc.setTextColor(muted);doc.text(doc.splitTextToSize(latin("+ "+r.title),rw)[0],rx,ry);ry+=10;doc.textWithLink(r.url,rx,ry,{url:r.url});ry+=12});
    if(s.v){const vv=V[s.v];doc.setFont("helvetica","bold");doc.setFontSize(8.5);doc.setTextColor(honey);doc.text(doc.splitTextToSize(latin("WATCH: "+vv[0]),rw)[0],rx,ry);ry+=10;doc.setFont("helvetica","normal");doc.setTextColor(muted);doc.textWithLink(vv[1],rx,ry,{url:vv[1]});ry+=12}ry+=4;
    doc.setFont("helvetica","bold");doc.setFontSize(9);doc.setTextColor(teal);doc.text("PROMPT",rx,ry);ry+=12;doc.setFont("courier","normal");doc.setFontSize(9);doc.setTextColor(ink);const pl=doc.splitTextToSize(latin(s.pr),rw);doc.text(pl,rx,ry);
    const ny=y+400*H/W+18;doc.setDrawColor(213,220,230);doc.line(M,ny,PW-M,ny);doc.setFont("helvetica","bold");doc.setFontSize(9);doc.setTextColor(muted);doc.text("SPEAKER NOTES",M,ny+14);
    doc.setFont("helvetica","normal");doc.setFontSize(10.5);doc.setTextColor(ink);doc.text(doc.splitTextToSize(latin(s.n),PW-2*M),M,ny+28);
    if(s.x==="age"){doc.addPage();doc.setFont("helvetica","bold");doc.setFontSize(14);doc.text("Ordered CMS age bands: common conditions and treatment approaches (teaching sketch)",M,M+10);let yy=M+34;doc.setFontSize(9.5);
      AGES.forEach(a=>{doc.setFont("helvetica","bold");doc.text(`${a[0]}  ${a[2]}`,M,yy);doc.setFont("helvetica","normal");const c1=doc.splitTextToSize(latin(a[3]),300),c2=doc.splitTextToSize(latin(a[4]),330);doc.text(c1,M+90,yy);doc.text(c2,M+400,yy);yy+=Math.max(c1.length,c2.length)*12+8})}
  }
  if(prev)document.documentElement.setAttribute("data-theme",prev);else document.documentElement.removeAttribute("data-theme");readColors();
  doc.addPage();doc.setFont("helvetica","bold");doc.setFontSize(18);doc.setTextColor(ink);doc.text("Study Library",M,M+10);let y=M+34;doc.setFontSize(9.5);
  S.forEach((s,i)=>{doc.setFont("helvetica","normal");const l=doc.splitTextToSize(latin(`[${i+1}] ${s.r[0]} - ${refMeta(s)} - ${refUrl(s)}`),PW-2*M);if(y+l.length*12>PH-M){doc.addPage();y=M}doc.text(l,M,y);y+=l.length*12+4});
  return doc.output("blob")}
async function doExport(kind){closeAll();
  if(kind==="plm")return save("PLM-Progressive-Longitudinal-Model-Building.md",plmMD()+"\n");
  if(kind==="md")return save("hive-mind-pli-deck.md",toMarkdown());
  if(kind==="html")return save("hive-mind-pli-deck.html",SRC);
  if(kind==="pdf"){const b=await makePDF();if(b)return save("hive-mind-pli-deck.pdf",b)}}
async function exportVisual(kind){const f=FR[cur];if(f.k!=="slide"&&f.k!=="prologue")return;const pro=f.k==="prologue";const name=pro?"s01-thesis-plm-cycle":`s${String(f.si+2).padStart(2,"0")}-visual`;const st=stillSVG(pro?PLM_VIS:S[f.si].vis);
  try{if(kind==="svg")await save(name+".svg",svgString(st.svg));else{const cv=await rasterize(st.svg,3);const b=await new Promise(r=>cv.toBlob(r,"image/png"));await save(name+".png",b)}}catch(e){toast("Couldn't render the visual.")}finally{st.done()}}

/* ---------- Events ---------- */
$("prev").onclick=()=>go(cur-1);$("next").onclick=()=>go(cur+1);
$("timer").onclick=()=>{paused=!paused;toast(paused?"⏸️ Timer paused":"▶️ Timer running")};
$("auto").onclick=()=>{auto=!auto;$("auto").setAttribute("aria-pressed",String(auto));toast(auto?"⏭️ Auto-advance on":"Auto-advance off")};
$("ovbtn").onclick=openMap;$("ovclose").onclick=closeAll;$("libbtn").onclick=()=>openLib();$("libclose").onclick=closeAll;
$("expbtn").onclick=()=>{const m=$("expmenu");m.style.top=(document.querySelector("header").getBoundingClientRect().bottom+6)+"px";m.hidden=!m.hidden;$("expbtn").setAttribute("aria-expanded",String(!m.hidden))};
$("fs").onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>toast("Fullscreen isn't available here"))}catch(e){toast("Fullscreen isn't available here")}};
document.addEventListener("click",e=>{const tg=e.target;
  const g=tg.closest("[data-go]");if(g){e.preventDefault();closeAll();go(+g.dataset.go);return}
  if(tg.closest("[data-map]")){openMap();return}
  const lb=tg.closest("[data-lib]");if(lb){openLib(lb.dataset.lib);return}
  const ex=tg.closest("[data-exp]");if(ex){doExport(ex.dataset.exp);return}
  const dv=tg.closest("[data-dl]");if(dv){exportVisual(dv.dataset.dl);return}
  const sl=tg.closest("[data-slide]");if(sl){e.preventDefault();goSlide(+sl.dataset.slide);return}
  if(tg.closest("[data-pick]")){$("mfile")?.click();return}
  const cp=tg.closest("[data-copy]");if(cp){const el=$("cp-"+cp.dataset.copy),txt=el.textContent;
    const sel=()=>{const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Selected. Press Ctrl+C or ⌘C to copy")};
    try{navigator.clipboard.writeText(txt).then(()=>toast("✅ Copied"),sel)}catch(err){sel()}return}
  if(!$("expmenu").hidden&&!tg.closest("#expmenu")&&!tg.closest("#expbtn")){$("expmenu").hidden=true;$("expbtn").setAttribute("aria-expanded","false")}
});
document.addEventListener("keydown",e=>{if(e.target.matches("input,textarea"))return;const k=e.key;
  if(!$("overview").hidden||!$("library").hidden){if(k==="Escape"||k==="o"||k==="O"||k==="l"||k==="L")closeAll();return}
  if(k==="Escape"){closeAll();return}
  if(k==="Enter"&&e.target.matches("li[data-slide]")){goSlide(+e.target.dataset.slide);return}
  if(k==="ArrowRight"||k==="PageDown"||(k===" "&&!e.target.matches("button,summary"))){e.preventDefault();go(cur+1)}
  else if(k==="ArrowLeft"||k==="PageUp"){e.preventDefault();go(cur-1)}
  else if(k==="Home")go(0);else if(k==="End")go(FR.length-1);
  else if(k==="o"||k==="O")openMap();else if(k==="l"||k==="L")openLib();
  else if(k==="t"||k==="T")$("timer").click();else if(k==="a"||k==="A")$("auto").click();else if(k==="f"||k==="F")$("fs").click();
  else if((k==="n"||k==="N")&&$("notes")){$("notes").open=!$("notes").open}
});
let sx=null;$("main").addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});
$("main").addEventListener("touchend",e=>{if(sx===null||e.target.closest("svg"))return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>70)go(cur+(dx<0?1:-1));sx=null},{passive:true});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>render());
new MutationObserver(()=>render()).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
dl().then(d=>{if(!d){document.querySelectorAll("[data-exp],[data-dl]").forEach(b=>b.title="Saving files isn't available in this view")}});

/* boot */
const h=/^#f(\d+)$/.exec(location.hash||"");const saved=parseInt(store.get("hive-deck-pos")||"0",10);
cur=h?Math.min(+h[1],FR.length-1):(isNaN(saved)?0:Math.min(saved,FR.length-1));
render();requestAnimationFrame(loop);
