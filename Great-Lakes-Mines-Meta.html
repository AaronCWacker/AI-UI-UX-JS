ch",title:"Silurian Ocean 430Mya",text:"This salt was once a tropical ocean. 430 million years ago, Michigan Basin was near the equator - a shallow, evaporating sea that left 1000 feet of salt.",alien:"The basin was a charging dock. Shallow seas were solar salt batteries for starships."},{trip:0,mine:"goderich",title:"The Great Evaporation",text:"Sun evaporated seawater faster than rivers refilled it. Each dry cycle left 3 inches of halite. Ten thousand cycles made the motherload.",alien:"Think of it as alien distillation - concentrating FTL potential."},{trip:0,mine:"goderich",title:"Salt = Time Capsule",text:"Halite crystals trap ancient seawater in fluid inclusions. We are literally drinking Silurian ocean when we dissolve this salt.",alien:"Fluid inclusions are memory chips. Alien hydrologists stored navigation data in brine."},{trip:0,mine:"goderich",title:"FTL Fuel Logic",text:"Salt crystal lattice vibrates at 1.8THz - same as vacuum energy. When charged, it fractures spacetime like ice cracking.",alien:"Salt is low-tech warp plasma. Cheap, stable, illegal in 12 sectors."},{trip:0,mine:"goderich",title:"Goderich Scale",text:"1,500 acres underground, 300 miles of roads. Largest salt mine on Earth. You could fit 3 Manhattans down here.",alien:"Parking structure for interstellar RVs. Road grid is intentional."},{trip:0,mine:"goderich",title:"Room and Pillar",text:"Miners leave 60x60 ft pillars every 120 feet. Checkerboard holds up a lake. 50% salt stays to hold sky.",alien:"Ancient architecture - pillars are waveguides for FTL resonance."},{trip:0,mine:"goderich",title:"60 Degrees Forever",text:"Mines sit at constant 60F, 40% humidity. No seasons. The deepest climate-controlled venue.",alien:"Perfect storage temp for fossilized star maps."},{trip:0,mine:"goderich",title:"Whale Road",text:"Main haulage drift is 30 feet wide, lit by sodium vapor. Your tour bus fits with 2 inches clearance.",alien:"Designated FTL runway. Salt dust reduces drag to zero."},{trip:0,mine:"goderich",title:"The Descent Shaft",text:"We drop 1,800 feet in a cage that smells like low tide and diesel. Ears pop. Salt crunches like snow.",alien:"Decompression from space-time to deep-time."},{trip:0,mine:"goderich",title:"First Crystal Wall",text:"Touch it - translucent, gray-banded halite. You see your hand through 8 inches of ancient ocean.",alien:"Transmission medium. Press palm to download 400M years."},{trip:1,mine:"goderich",title:"Coral Stargate 200m",text:"Silurian reef 200 meters long, frozen in salt. Rugose corals built apartment complexes before trees existed.",alien:"This reef was an antenna array - each coral polyp a phased emitter."},{trip:1,mine:"goderich",title:"Trilobite Navigators",text:"Trilobites with 360-degree crystal eyes. Some 15 inches long. Their compound lenses corrected for underwater light warp.",alien:"Living sextants. Their eyes mapped star positions through salt water lensing."},{trip:1,mine:"goderich",title:"Eurypterid - Sea Scorpion",text:"8-foot sea scorpions, apex predators of salt seas. Claws like excavators. They patrolled these brine channels.",alien:"Guard drones. Bio-engineered to protect salt batteries."},{trip:1,mine:"goderich",title:"Crinoid Forests",text:"Sea lilies 60 feet tall, swaying in current that no longer exists. Stems are stacked Cheerios of calcite.",alien:"Fiber optic cables. Crinoid stems carried light signals reef to reef."},{trip:1,mine:"goderich",title:"Salt Sails",text:"Solar fins on your bus are salt-doped perovskite. They charge FTL drive in 8 minutes of sun. Salt makes light into motion.",alien:"Original alien solar tech - same salt, same fins."},{trip:1,mine:"goderich",title:"Acid Test",text:"Halite tastes different per era. Goderich is clean, slightly sweet - low magnesium, high FTL purity.",alien:"Fuel grading. Sweet = high octane."},{trip:1,mine:"goderich",title:"Ghost Waves",text:"You hear faint lapping? That's acoustic memory trapped in salt. Replay of Silurian tide from 430Mya on loop.",alien:"Audio logs. The ocean never stopped broadcasting."},{trip:1,mine:"goderich",title:"Pillar Clock",text:"Each pillar growth band = 11,000 year climate cycle. Count 20 bands and you've counted 220,000 years.",alien:"Clock tree rings for time travelers to sync."},{trip:1,mine:"goderich",title:"The Whiteout",text:"Pure halite rooms reflect headlights to infinity. Turn off lights and absolute darkness eats your hand.",alien:"Holodeck off mode. Darkness is feature, not bug."},{trip:1,mine:"goderich",title:"Exit Ramp",text:"100 miles of roads all slope 7% to shaft. If FTL fails, you can coast entire mine back to surface on brakes.",alien:"Fail-safe - gravity return to orbit."},{trip:2,mine:"detroit",title:"Motor City Underworld",text:"Detroit salt under Detroit. 1,200 feet down, under freeways. City above doesn't know city below is larger.",alien:"Twin cities - one for carbon life, one for salt life."},{trip:2,mine:"detroit",title:"The 1910 Discovery",text:"Oil drillers hit salt at 1,100ft trying for oil. Instead found 20 trillion tons of FTL fuel. Detroit almost became Houston of space.",alien:"They were looking for dinosaurs, found spaceships."},{trip:2,mine:"detroit",title:"Salt Beats Steel",text:"Detroit salt built roads that survived -50F without cracking. Same ionic bond that resists spacetime tearing.",alien:"Road salt is detuned FTL fuel. Keeps cars from warping."},{trip:2,mine:"detroit",title:"Black Salt Bands",text:"Dark bands are ancient oil spills from Silurian algae blooms. 400M year old crude trapped in salt lasagna.",alien:"Biofuel reserves. Algae were terraforming engines."},{trip:2,mine:"detroit",title:"Echo Chamber",text:"Shout and echo returns in 4 seconds from 2,000 feet away. Sound travels 3x faster in salt than air.",alien:"Salt is acoustic superconductor. Whisper across mine."},{trip:2,mine:"detroit",title:"The Salt Church",text:"Miners carved chapel 60ft high. Salt walls amplify hymns. No pillars - just vaulted faith holding lake up.",alien:"Resonance chamber to tune FTL drive before jump."},{trip:2,mine:"detroit",title:"Trucker Geology",text:"Haul trucks run 24/7, headlights carving tunnels. Each truck hauls 40 tons of ancient ocean per trip.",alien:"Fuel tankers. Loading FTL cores one bucket at a time."},{trip:2,mine:"detroit",title:"Fossil Highway Median",text:"Center line of drift is fossil hash - broken brachiopods forming yellow brick road. Follow it to exit.",alien:"Breadcrumb trail left by previous tourists. Still visible."},{trip:2,mine:"detroit",title:"Depth Pressure",text:"At 1,200 feet, salt creeps. Walls close 1 inch per year. Mine breathes. You hear it crack at night.",alien:"Salt remembers being under ocean weight. It's relaxing."},{trip:2,mine:"detroit",title:"Salt on Tongue",text:"Air tastes of pennies and ocean. Your lips dry. That's halite dust charging your lungs with Silurian ions.",alien:"Inoculation. Now you can breathe on their world."},{trip:3,mine:"cleveland",title:"Lake Erie Lid",text:"Cleveland mine sits under Lake Erie, 1,800 feet down. Lake is roof. 6 feet of rock between water and air.",alien:"Roof is thin on purpose - quick launch to surface."},{trip:3,mine:"cleveland",title:"Erie's Missing Salt",text:"Lake Erie is shallowest Great Lake because salt dissolved and collapsed. Lake is scar of ancient mining.",alien:"Previous visitors strip-mined from orbit. Left crater that became lake."},{trip:3,mine:"cleveland",title:"Alien Reef Core",text:"Here coral didn't just build reef - it built lattice of calcite rods pointing at galactic center. Compass before compass.",alien:"Star map. Each rod angle points to homeworld."},{trip:3,mine:"cleveland",title:"Amber Encasement",text:"Some fossils trapped in salt-amber, not rock. You see soft tissue, gills fluttering as if paused yesterday.",alien:"Stasis pods. Creatures paused mid-thought."},{trip:3,mine:"cleveland",title:"Eurypterid Molt Wall",text:"Entire wall is shed exoskeletons. Molting ground where sea scorpions gathered to upgrade bodies.",alien:"Spacesuit discard pile. They changed suits here."},{trip:3,mine:"cleveland",title:"Light Shafts",text:"Drill holes to surface pipe sunlight 1,800 feet. Dust motes dance like stars. Volumetric light in absolute dark.",alien:"Farsight beacons - surface to deep communication."},{trip:3,mine:"cleveland",title:"Rockstar Bus Fit",text:"Bus is 8ft wide, 12ft tall - same as mining jumbo drill. Chrome reflects amber lights, looks like rolling disco ball.",alien:"Tour bus designed to match alien tour bus dimensions."},{trip:3,mine:"cleveland",title:"Time Dilation Proof",text:"Salt crystals show compressed time. 1 inch = 4,000 years. Drive 1 mile and you cross 1M years.",alien:"Drive fast enough and you arrive before you left."},{trip:3,mine:"cleveland",title:"The Singing Salt",text:"Tap pillar with hammer, it rings C# for 11 seconds. Each pillar tuned different note. Mine is xylophone.",alien:"Acoustic keypad. Play correct chord to open jump gate."},{trip:3,mine:"cleveland",title:"Whiskey Island Legend",text:"Bootleggers used old salt shafts during Prohibition. Salt preserved whiskey perfect. Now preserves starlight.",alien:"Smugglers always find best FTL fuel caches."},{trip:4,mine:"cleveland",title:"FTL Jump Charge",text:"Fill salt hopper - fuel gauge goes green. Lattice aligns. Bus hums at 432Hz, same as Earth's hum.",alien:"Resonance achieved. Salt sings to vacuum."},{trip:4,mine:"detroit",title:"Jump Flash",text:"Salt fractures light. Not explosion - implosion of darkness. Stars stretch into lines. You're not moving, space is.",alien:"You fold ocean back into ocean. Salt remembers being everywhere."},{trip:4,mine:"detroit",title:"Fossil = Map",text:"Fossil reefs are not dead - they're instructions. Follow coral growth to find other salt planets.",alien:"Pan-spermia was delivery service for FTL fuel."},{trip:4,mine:"goderich",title:"Great Lakes as Craters",text:"Great Lakes are not glacial - they're exhaust scorch marks from first FTL ships launching off salt.",alien:"Look at lakes from orbit - perfect thrust plume shapes."},{trip:4,mine:"goderich",title:"Time is Salt",text:"Salt dissolves in water, recrystallizes in sun. That cycle is time. FTL just runs cycle backwards.",alien:"We don't travel time, we desalt it."},{trip:4,mine:"cleveland",title:"The 60-Second Rule",text:"Tours limited to 60 seconds so your brain can integrate. Longer and you start dreaming in Silurian.",alien:"Alien OSHA. Longer exposure causes temporal nostalgia."},{trip:4,mine:"cleveland",title:"Rockstar Motorhome Logic",text:"Why bus? Because road trip is original space travel. Highway = orbit. Diner = space station. Salt = gas station coffee.",alien:"Tour bus is pilgrimage vehicle. Every rockstar is astronaut who doesn't know yet."},{trip:4,mine:"goderich",title:"The Return",text:"Ascent is same shaft but lighter - salt burned, bus empty, fossils still glowing behind you like audience phones.",alien:"They wave you off. Come back with friends."},{trip:4,mine:"detroit",title:"Surface Breath",text:"Pop out at Lake Huron sunset. Air smells different after 400M year deep breath. You taste future.",alien:"Re-entry ritual. You are now salted."},{trip:4,mine:"cleveland",title:"Next Jump",text:"Fuel gauge low? Good. Means you used time well. Refill at gift shop - bag of Goderich salt to go. FTL in pocket.",alien:"Souvenir is functional. Don't put in water. Will take you back."}],x6=[{id:"A",label:"TRIP A: ORIGIN",mine:"goderich",color:"#39ffb4"},{id:"B",label:"TRIP B: GODERICH DEEP",mine:"goderich",color:"#ffd166"},{id:"C",label:"TRIP C: DETROIT LABYRINTH",mine:"detroit",color:"#ff9f1c"},{id:"D",label:"TRIP D: ALIEN REEF",mine:"cleveland",color:"#ff4d6d"},{id:"E",label:"TRIP E: FTL TIME MACHINE",mine:"all",color:"#8a7dff"}];function OH(){let E=x0.useRef(null),Q=x0.useRef(null),$=x0.useRef(null),k=x0.useRef(null),W=x0.useRef(null),J=x0.useRef(null),N=x0.useRef(null),U=x0.useRef(null),Z=x0.useRef(null),H=x0.useRef(null),[Y,D]=x0.useState(0),[X,w]=x0.us
