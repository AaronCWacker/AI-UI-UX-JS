const GLOSSARY = [
  { term:"Arterial Plaque", def:"A build-up of cholesterol, fatty substances, cellular waste products, and calcium along the inner lining of an artery that can restrict blood flow." },
  { term:"Soft Plaque", def:"A fragile, lipid-rich deposit within the artery wall that lacks a hard shell, making it volatile and prone to rupturing into an occlusive clot." },
  { term:"Calcified Plaque", def:"Hardened, mineralized plaque that forms a stable crust over past arterial injuries; it indicates healed tissue and is far less prone to sudden rupture." },
  { term:"CIMT (Carotid Intima-Media Thickness)", def:"A painless, 5-minute ultrasound measuring the thickness of the inner two layers of the neck arteries to detect early soft plaque and arterial age." },
  { term:"CCTA with AI Plaque Analysis", def:"A specialized 3D CT scan of coronary vessels utilizing AI algorithms to quantify exact volumes of soft, fibrous, and calcified plaque." },
  { term:"Endothelium", def:"The delicate, smooth single-cell inner lining of blood vessels that regulates arterial dilation, blood pressure, and anti-inflammatory signaling." },
  { term:"Oral Glucose Tolerance Test (OGTT)", def:"A dynamic test measuring blood sugar clearance over 2 to 3 hours after a standardized glucose drink to expose early insulin resistance." },
  { term:"Insulin Resistance", def:"A state where muscle, fat, and liver cells fail to respond efficiently to insulin, causing elevated circulating glucose and damaging blood vessels." },
  { term:"Visceral Fat", def:"Deep abdominal fat wrapped around internal organs that continuously releases inflammatory cytokines into the portal circulation." },
  { term:"hs-CRP (High-Sensitivity C-Reactive Protein)", def:"A blood biomarker produced by the liver reflecting systemic low-grade vascular and whole-body inflammation." },
  { term:"Lp-PLA2", def:"A specialized vascular enzyme assay that measures active, rupture-prone inflammatory activity specifically occurring within arterial walls." },
  { term:"Lipoprotein(a) [Lp(a)]", def:"A sticky, genetically determined cholesterol particle that significantly elevates lifetime risks for atheroma formation and blood clots." },
  { term:"Apolipoprotein B (ApoB)", def:"A structural protein found on every plaque-causing particle (LDL, VLDL, IDL), providing an exact count of circulating atherogenic particles." },
  { term:"Left Anterior Descending (LAD)", def:"The primary coronary artery running down the front of the heart, supplying the left ventricle; often called the 'widowmaker'." },
  { term:"Percent Atheroma Volume (PAV)", def:"The proportion of the total blood vessel wall occupied by disease across a scanned arterial segment." },
  { term:"REHIT", def:"Reduced-Exertion High-Intensity Interval Training; short workouts with brief 20-second maximal bursts that rapidly empty muscle glycogen." },
  { term:"Vagus Nerve", def:"The main parasympathetic nerve; activating it with slow, prolonged exhalations directly slows heart rate and lowers vascular tone." },
  { term:"Primary Prevention", def:"Medical and lifestyle interventions initiated to prevent cardiovascular disease before any anatomical arterial plaque has developed." },
  { term:"Secondary Prevention", def:"Targeted lifestyle and clinical treatments deployed after plaque has already been documented to halt progression and prevent events." }
];

/* ============================================================
   SPEECH SYNTHESIS NARRATOR
   ============================================================ */
const Narrator = {
  muted: false,
  speaking: false,
  speak(text){
    if(this.muted || !('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 1.05;
    u.pitch = 0.95;
    const voices = window.speechSynthesis.getVoices();
    const enVoice = voices.find(v => /en[-_](US|GB|AU)/i.test(v.lang) && /natural|premium|google|samantha|daniel/i.test(v.name)) || voices.find(v => /en/i.test(v.lang));
    if(enVoice) u.voice = enVoice;
    this.speaking = true;
    u.onend = () => { this.speaking = false; };
    u.onerror = () => { this.speaking = false; };
    window.speechSynthesis.speak(u);
  },
  cancel(){
    if('speechSynthesis' in window) window.speechSynthesis.cancel();
    this.speaking = false;
  }
};
if('speechSynthesis' in window){
  window.speechSynthesis.onvoiceschanged = () => {};
}

/* ============================================================
   3D CARDIOVASCULAR SCENE BUILDER
   ============================================================ */
let scene, camera, renderer, clock;
let vesselGroup, bloodCells = [], pulsatileElements = [];
let softPlaqueMesh, hardPlaqueMesh, lumenMesh, carotidBranch, coronaryBranch;

function init3D(){
  const container = document.getElementById('stage');
  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x05070a, 0.12);

  camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 2.2, 4.2);

  renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true, powerPreference:'high-performance' });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;
  container.appendChild(renderer.domElement);

  clock = new THREE.Clock();

  // Lighting
  scene.add(new THREE.AmbientLight(0x182438, 1.2));
  const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
  dirLight.position.set(5, 8, 6);
  scene.add(dirLight);

  const redLight = new THREE.PointLight(0xff385c, 2.5, 12);
  redLight.position.set(0, 0.5, 1.5);
  scene.add(redLight);
  pulsatileElements.push(redLight);

  const cyanLight = new THREE.PointLight(0x38d0ff, 1.8, 10);
  cyanLight.position.set(-2, 2, -1);
  scene.add(cyanLight);

  buildCardiovascularVessel();
  buildBloodFlow();
  buildCellularStructures();

  window.addEventListener('resize', onWindowResize);
  setupControls();
}

function buildCardiovascularVessel(){
  vesselGroup = new THREE.Group();
  scene.add(vesselGroup);

  // Main Aorta / Common Conduit (Outer Muscular Wall)
  const outerMat = new THREE.MeshPhysicalMaterial({
    color: 0x9e1a32,
    roughness: 0.35,
    metalness: 0.1,
    transmission: 0.65,
    opacity: 0.85,
    transparent: true,
    thickness: 1.2,
    ior: 1.35,
    side: THREE.DoubleSide
  });

  const mainTube = new THREE.Mesh(
    new THREE.CylinderGeometry(0.75, 0.85, 4.5, 32, 1, true),
    outerMat
  );
  vesselGroup.add(mainTube);

  // Endothelial Inner Layer
  const lumenMat = new THREE.MeshStandardMaterial({
    color: 0xff6680,
    roughness: 0.2,
    metalness: 0.2,
    side: THREE.BackSide,
    emissive: 0x3d0812,
    emissiveIntensity: 0.4
  });
  lumenMesh = new THREE.Mesh(
    new THREE.CylinderGeometry(0.70, 0.80, 4.48, 32, 1, true),
    lumenMat
  );
  vesselGroup.add(lumenMesh);

  // Carotid Bifurcation Branch
  carotidBranch = new THREE.Group();
  const branchMat = outerMat.clone();
  const leftBranch = new THREE.Mesh(
    new THREE.CylinderGeometry(0.42, 0.48, 2.2, 24, 1, true),
    branchMat
  );
  leftBranch.position.set(-0.55, 2.8, 0);
  leftBranch.rotation.z = 0.35;
  const rightBranch = new THREE.Mesh(
    new THREE.CylinderGeometry(0.38, 0.45, 2.2, 24, 1, true),
    branchMat
  );
  rightBranch.position.set(0.55, 2.8, 0);
  rightBranch.rotation.z = -0.35;
  carotidBranch.add(leftBranch, rightBranch);
  vesselGroup.add(carotidBranch);

  // Coronary / LAD Branch Simulation
  coronaryBranch = new THREE.Group();
  const ladCurve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0.5, 0.8, 0.6),
    new THREE.Vector3(0.9, 0.2, 0.8),
    new THREE.Vector3(0.7, -0.8, 0.9),
    new THREE.Vector3(0.4, -1.6, 0.8)
  ]);
  const ladGeo = new THREE.TubeGeometry(ladCurve, 32, 0.16, 16, false);
  const ladMat = new THREE.MeshStandardMaterial({ color: 0xcc2944, roughness: 0.3, metalness: 0.3 });
  const ladMesh = new THREE.Mesh(ladGeo, ladMat);
  coronaryBranch.add(ladMesh);
  vesselGroup.add(coronaryBranch);

  // Soft, Unstable Lipid-Rich Plaque (Yellow/Gold, dangerous)
  const softPlaqueGeo = new THREE.SphereGeometry(0.38, 24, 24);
  softPlaqueGeo.scale(1.4, 0.6, 0.8);
  const softPlaqueMat = new THREE.MeshStandardMaterial({
    color: 0xffb703,
    roughness: 0.6,
    metalness: 0.1,
    emissive: 0x664400,
    emissiveIntensity: 0.6
  });
  softPlaqueMesh = new THREE.Mesh(softPlaqueGeo, softPlaqueMat);
  softPlaqueMesh.position.set(0.45, 0.0, 0.0);
  vesselGroup.add(softPlaqueMesh);

  // Calcified, Stable Hard Plaque (Dense White/Cream crystal structure)
  const hardPlaqueGeo = new THREE.DodecahedronGeometry(0.28, 1);
  hardPlaqueGeo.scale(1.0, 0.7, 0.9);
  const hardPlaqueMat = new THREE.MeshStandardMaterial({
    color: 0xedf2f4,
    roughness: 0.15,
    metalness: 0.4,
    emissive: 0x4a4e69,
    emissiveIntensity: 0.25
  });
  hardPlaqueMesh = new THREE.Mesh(hardPlaqueGeo, hardPlaqueMat);
  hardPlaqueMesh.position.set(-0.48, 0.1, 0.0);
  vesselGroup.add(hardPlaqueMesh);

  // Endothelial Cell Surface Lining Nodes
  const endoGeo = new THREE.BoxGeometry(0.06, 0.12, 0.02);
  const endoMat = new THREE.MeshBasicMaterial({ color: 0x38d0ff, transparent: true, opacity: 0.4 });
  for(let i=0; i<48; i++){
    const cell = new THREE.Mesh(endoGeo, endoMat);
    const theta = (i / 48) * Math.PI * 2;
    cell.position.set(Math.cos(theta) * 0.71, (Math.random() - 0.5) * 3.8, Math.sin(theta) * 0.71);
    cell.rotation.y = -theta;
    vesselGroup.add(cell);
  }
}

function buildBloodFlow(){
  // Biconcave Erythrocytes (Red Blood Cells)
  const rbcGeo = new THREE.CylinderGeometry(0.07, 0.07, 0.025, 16);
  rbcGeo.scale(1.2, 1, 1.2);
  const rbcMat = new THREE.MeshStandardMaterial({
    color: 0xd90429,
    roughness: 0.3,
    metalness: 0.1,
    emissive: 0x4a000b,
    emissiveIntensity: 0.3
  });

  for(let i=0; i<120; i++){
    const rbc = new THREE.Mesh(rbcGeo, rbcMat);
    resetRBC(rbc);
    rbc.position.y = (Math.random() - 0.5) * 5.0;
    scene.add(rbc);
    bloodCells.push(rbc);
  }
}

function resetRBC(rbc){
  const radius = Math.random() * 0.45;
  const angle = Math.random() * Math.PI * 2;
  rbc.position.x = Math.cos(angle) * radius;
  rbc.position.z = Math.sin(angle) * radius;
  rbc.position.y = -2.6 - Math.random() * 0.8;
  rbc.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
  rbc.userData = {
    speed: 0.035 + Math.random() * 0.04,
    rotSpeedX: (Math.random() - 0.5) * 0.05,
    rotSpeedY: (Math.random() - 0.5) * 0.05
  };
}

function buildCellularStructures(){
  // Floating Lipoprotein / Biomarker Nanoparticles
  const nanoGeo = new THREE.IcosahedronGeometry(0.028, 1);
  const nanoMat = new THREE.MeshBasicMaterial({ color: 0xffd166 });
  for(let i=0; i<35; i++){
    const nano = new THREE.Mesh(nanoGeo, nanoMat);
    nano.position.set((Math.random()-0.5)*0.8, (Math.random()-0.5)*4.0, (Math.random()-0.5)*0.8);
    scene.add(nano);
    pulsatileElements.push(nano);
  }
}

function onWindowResize(){
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

// Camera Lerp Controller
let targetCamPos = new THREE.Vector3(0, 2.2, 4.2);
let targetLookAt = new THREE.Vector3(0, 0.8, 0);
let currentLookAt = new THREE.Vector3(0, 0.8, 0);

function animate(){
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  const time = clock.getElapsedTime();

  // Heartbeat pulse cycle
  const pulse = Math.sin(time * 4.5);
  const cardiacExpansion = 1.0 + (pulse > 0 ? pulse * 0.035 : 0);
  if(vesselGroup) vesselGroup.scale.set(cardiacExpansion, 1.0, cardiacExpansion);

  // Animate Hemodynamics (Blood Flow)
  for(let i=0; i<bloodCells.length; i++){
    const rbc = bloodCells[i];
    rbc.position.y += rbc.userData.speed * (1.0 + (pulse > 0.4 ? 0.6 : 0));
    rbc.rotation.x += rbc.userData.rotSpeedX;
    rbc.rotation.y += rbc.userData.rotSpeedY;

    // Narrowing deflection near soft plaque (stenosis simulation)
    if(Math.abs(rbc.position.y) < 0.6 && rbc.position.x > 0.15){
      rbc.position.x -= 0.015;
    }

    if(rbc.position.y > 3.2){
      resetRBC(rbc);
    }
  }

  // Smooth Camera Glides
  camera.position.lerp(targetCamPos, 0.045);
  currentLookAt.lerp(targetLookAt, 0.05);
  camera.lookAt(currentLookAt);

  // Soft Plaque Subtle Inflammation Glow
  if(softPlaqueMesh){
    softPlaqueMesh.material.emissiveIntensity = 0.4 + 0.3 * Math.sin(time * 6.0);
  }

  renderer.render(scene, camera);
}

function setupControls(){
  let isDragging = false;
  let prevMouseX = 0, prevMouseY = 0;

  window.addEventListener('pointerdown', e => {
    if(e.target.closest('#hud, #sideDrawer')) return;
    isDragging = true;
    prevMouseX = e.clientX;
    prevMouseY = e.clientY;
  });

  window.addEventListener('pointermove', e => {
    if(!isDragging) return;
    const dx = e.clientX - prevMouseX;
    const dy = e.clientY - prevMouseY;
    if(vesselGroup){
      vesselGroup.rotation.y += dx * 0.008;
      vesselGroup.rotation.x += dy * 0.005;
    }
    prevMouseX = e.clientX;
    prevMouseY = e.clientY;
  });

  window.addEventListener('pointerup', () => { isDragging = false; });
}

/* ============================================================
   TOUR CONTROLLER & LOGIC
   ============================================================ */
let currentStop = 0;
let isPlaying = true;
let tourInterval = null;
const STOP_DURATION = 9000;

function goToStop(idx){
  if(idx < 0) idx = 0;
  if(idx >= FACTS.length) idx = FACTS.length - 1;
  currentStop = idx;

  const f = FACTS[idx];

  // Update UI Elements
  document.getElementById('stopNum').textContent = `${f.id} / ${FACTS.length}`;
  document.getElementById('zoneTxt').textContent = f.zone;
  document.getElementById('cardTag').textContent = `3D STOP ${f.id}: ${f.tag.toUpperCase()}`;
  document.getElementById('factCategory').textContent = f.zone.toUpperCase();
  document.getElementById('cardFact').innerHTML = `${f.em} ${f.fact}`;
  document.getElementById('cardClinical').textContent = `Clinical Insight: ${f.clin}`;
  document.getElementById('tourProgress').style.width = `${((idx + 1) / FACTS.length) * 100}%`;

  // Apply Camera Position & Trajectory
  targetCamPos.set(f.cam.x, f.cam.y, f.cam.z);
  targetLookAt.set(f.target.x, f.target.y, f.target.z);

  // Mesh Highlight Tints
  highlightMesh(f.focusMesh);

  // Speak Narration
  Narrator.speak(`${f.fact}`);

  // Highlight list item in drawer
  renderDrawerList();
}

function highlightMesh(meshType){
  if(!softPlaqueMesh || !hardPlaqueMesh) return;
  softPlaqueMesh.scale.set(1.4, 0.6, 0.8);
  hardPlaqueMesh.scale.set(1.0, 0.7, 0.9);

  if(meshType === 'softPlaque'){
    softPlaqueMesh.scale.set(1.7, 0.75, 1.0);
  } else if(meshType === 'hardPlaque'){
    hardPlaqueMesh.scale.set(1.3, 0.9, 1.1);
  }
}

function nextStop(){
  if(currentStop < FACTS.length - 1){
    goToStop(currentStop + 1);
  } else {
    goToStop(0);
  }
}

function prevStop(){
  if(currentStop > 0){
    goToStop(currentStop - 1);
  } else {
    goToStop(FACTS.length - 1);
  }
}

function togglePlay(){
  isPlaying = !isPlaying;
  const btn = document.getElementById('playBtn');
  if(isPlaying){
    btn.textContent = '⏸️ Pause Tour';
    btn.className = 'primary';
    startAutoTour();
  } else {
    btn.textContent = '▶️ Resume Tour';
    btn.className = 'green';
    clearInterval(tourInterval);
    tourInterval = null;
  }
}

function startAutoTour(){
  clearInterval(tourInterval);
  tourInterval = setInterval(() => {
    if(isPlaying && !Narrator.speaking){
      nextStop();
    }
  }, STOP_DURATION);
}

/* ============================================================
   DRAWER TABS & CONTENT BUILDER
   ============================================================ */
let currentTab = 'facts';

function renderDrawerList(){
  const container = document.getElementById('drawerContent');
  container.innerHTML = '';

  if(currentTab === 'facts'){
    FACTS.forEach((f, i) => {
      const item = document.createElement('div');
      item.className = `listItem ${i === currentStop ? 'active' : ''}`;
      item.innerHTML = `<b>${f.id}. ${f.em} ${f.tag}</b><div style="color:var(--dim);font-size:11px;margin-top:2px">${f.fact.slice(0, 85)}...</div>`;
      item.onclick = () => {
        goToStop(i);
        if(window.innerWidth < 768) toggleDrawer();
      };
      container.appendChild(item);
    });
  } else {
    GLOSSARY.forEach(g => {
      const item = document.createElement('div');
      item.className = 'glossItem';
      item.innerHTML = `<div class="glossTerm">📖 ${g.term}</div><div class="glossDef">${g.def}</div>`;
      container.appendChild(item);
    });
  }
}

function toggleDrawer(){
  const drawer = document.getElementById('sideDrawer');
  drawer.classList.toggle('collapsed');
}

/* ============================================================
   EVENT WIRE-UP & INITIALIZATION
   ============================================================ */
document.getElementById('nextBtn').onclick = () => { nextStop(); };
document.getElementById('prevBtn').onclick = () => { prevStop(); };
document.getElementById('playBtn').onclick = togglePlay;
document.getElementById('drawerToggle').onclick = toggleDrawer;
document.getElementById('closeDrawer').onclick = toggleDrawer;

document.getElementById('tabFacts').onclick = () => {
  currentTab = 'facts';
  document.getElementById('tabFacts').classList.add('sel');
  document.getElementById('tabGloss').classList.remove('sel');
  renderDrawerList();
};

document.getElementById('tabGloss').onclick = () => {
  currentTab = 'gloss';
  document.getElementById('tabGloss').classList.add('sel');
  document.getElementById('tabFacts').classList.remove('sel');
  renderDrawerList();
};

document.getElementById('voiceToggle').onclick = () => {
  Narrator.muted = !Narrator.muted;
  const chip = document.getElementById('voiceChip');
  const txt = document.getElementById('voiceTxt');
  const btn = document.getElementById('voiceToggle');
  if(Narrator.muted){
    Narrator.cancel();
    chip.className = 'chip';
    txt.textContent = 'MUTED';
    btn.textContent = '🔊 Enable Narration';
  } else {
    chip.className = 'chip active';
    txt.textContent = 'VOICED';
    btn.textContent = '🔇 Mute Narration';
    Narrator.speak(FACTS[currentStop].fact);
  }
};

document.getElementById('resetCamBtn').onclick = () => {
  if(vesselGroup) vesselGroup.rotation.set(0,0,0);
  const f = FACTS[currentStop];
  targetCamPos.set(f.cam.x, f.cam.y, f.cam.z);
  targetLookAt.set(f.target.x, f.target.y, f.target.z);
};

// Keyboard Arrow Nav
window.addEventListener('keydown', e => {
  if(e.key === 'ArrowRight') nextStop();
  if(e.key === 'ArrowLeft') prevStop();
  if(e.key === ' ') { e.preventDefault(); togglePlay(); }
});

// Boot
window.addEventListener('DOMContentLoaded', () => {
  init3D();
  renderDrawerList();
  goToStop(0);
  startAutoTour();
  animate();
});
</script>
