<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Integrated Open Worlds: the Yggdrasil root spec</title>
  <desc id="d">Four source apps are the roots, a streaming world spine is the trunk, four integrated features are the branches, seven states are the canopy, and memory is the well beneath.</desc>
  <defs>
    <style>
      .serif{font-family:Palatino,"Palatino Linotype","Book Antiqua",Georgia,serif}
      .sans{font-family:"Segoe UI",Helvetica,Arial,sans-serif}
      .frost{fill:#DDE8EE} .dim{fill:#9FB8B3}
      .box{fill:#143B37;stroke-width:1.6}
      .limb{fill:none;stroke-width:4;stroke-linecap:round}
      .root{fill:none;stroke-width:5;stroke-linecap:round}
      .leaf{fill:#A7C4A0} .st{fill:#0F2A2E;font-weight:700;font-size:13px}
    </style>
    <linearGradient id="bark" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#5C4632"/><stop offset="1" stop-color="#3B2D21"/>
    </linearGradient>
  </defs>
  <rect width="960" height="600" fill="#0F2A2E"/>

  <!-- header -->
  <text x="30" y="40" class="serif frost" font-size="26">Integrated Open Worlds</text>
  <text x="30" y="62" class="sans dim" font-size="13">Root spec of the Yggdrasil tree</text>
  <text x="930" y="40" class="serif frost" font-size="16" text-anchor="end">allaiinc.org</text>
  <text x="930" y="62" class="sans dim" font-size="13" text-anchor="end">600+ single-file apps, one world</text>

  <!-- canopy: seven states placed by real US geography (Hawaii inset, as on a US map) -->
  <ellipse cx="480" cy="138" rx="310" ry="82" fill="#1B4540"/>
  <ellipse cx="300" cy="160" rx="140" ry="58" fill="#1B4540"/>
  <ellipse cx="660" cy="158" rx="150" ry="60" fill="#1B4540"/>
  <ellipse cx="520" cy="96" rx="130" ry="44" fill="#1F514B"/>
  <g fill="none" stroke="#5C4632" stroke-width="5" stroke-linecap="round">
    <path d="M430 216 C400 182 320 160 272 150"/>
    <path d="M468 216 L462 194"/>
    <path d="M480 216 C478 172 488 140 494 118"/>
    <path d="M498 216 C508 172 530 142 543 130"/>
    <path d="M530 216 C580 182 640 142 677 124"/>
    <path d="M545 216 C572 206 598 197 612 192"/>
  </g>
  <path d="M422 218 C360 206 292 196 244 190" fill="none" stroke="#5C4632" stroke-width="3" stroke-dasharray="5 6" stroke-linecap="round"/>
  <rect x="190" y="166" width="58" height="46" rx="6" fill="none" stroke="#9FB8B3" stroke-opacity=".6" stroke-dasharray="3 4"/>
  <g class="sans" text-anchor="middle">
    <circle cx="255" cy="145" r="20" class="leaf"/><text x="255" y="149" class="st">CA</text>
    <circle cx="219" cy="189" r="17" class="leaf"/><text x="219" y="193" class="st">HI</text>
    <circle cx="460" cy="176" r="20" class="leaf"/><text x="460" y="180" class="st">TX</text>
    <circle cx="495" cy="98"  r="20" class="leaf"/><text x="495" y="102" class="st">MN</text>
    <circle cx="549" cy="113" r="20" class="leaf"/><text x="549" y="117" class="st">WI</text>
    <circle cx="695" cy="115" r="20" class="leaf"/><text x="695" y="119" class="st">NY</text>
    <circle cx="630" cy="188" r="20" class="leaf"/><text x="630" y="192" class="st">FL</text>
  </g>
  <text x="930" y="186" class="sans dim" font-size="12" text-anchor="end">States sit where the map puts them;</text>
  <text x="930" y="202" class="sans dim" font-size="12" text-anchor="end">the mini-map jumps between them</text>

  <!-- trunk: world spine -->
  <path d="M394 212 C412 270 404 385 374 442 L586 442 C556 385 548 270 566 212 Z" fill="url(#bark)"/>
  <g text-anchor="middle">
    <text x="480" y="242" class="serif frost" font-size="17">World spine</text>
    <g class="sans frost" font-size="12">
      <text x="480" y="270">active: render</text>
      <text x="480" y="291">warm: worker decode</text>
      <text x="480" y="312">cold: IndexedDB</text>
      <text x="480" y="342">prefetch by heading</text>
      <text x="480" y="363">never block a frame</text>
    </g>
  </g>

  <!-- branches, colored by the root that feeds them -->
  <path d="M412 262 Q330 238 250 253" class="limb" stroke="#E9B949"/>
  <path d="M414 352 Q330 372 250 366" class="limb" stroke="#5FD3B5"/>
  <path d="M548 262 Q630 238 710 253" class="limb" stroke="#B79CF2"/>
  <path d="M546 352 Q630 372 710 366" class="limb" stroke="#F07C9B"/>

  <rect x="40" y="222" width="210" height="62" rx="8" class="box" stroke="#E9B949"/>
  <text x="56" y="247" class="serif frost" font-size="15">Home and block</text>
  <text x="56" y="269" class="sans dim" font-size="12">walk inside and outside</text>

  <rect x="40" y="306" width="210" height="126" rx="8" class="box" stroke="#5FD3B5"/>
  <text x="56" y="330" class="serif frost" font-size="15">Motion pools</text>
  <g class="sans dim" font-size="12">
    <text x="56" y="351">ground vehicles</text><text x="56" y="368">air machines and flyers</text>
    <text x="56" y="385">land creatures</text><text x="56" y="402">surface swimmers</text>
    <text x="56" y="419">underwater life</text>
  </g>

  <rect x="710" y="222" width="210" height="62" rx="8" class="box" stroke="#B79CF2"/>
  <text x="726" y="247" class="serif frost" font-size="15">Presence</text>
  <text x="726" y="269" class="sans dim" font-size="12">body and room, live in 3D</text>

  <rect x="710" y="306" width="210" height="126" rx="8" class="box" stroke="#F07C9B"/>
  <text x="726" y="330" class="serif frost" font-size="15">Media deck</text>
  <g class="sans dim" font-size="12">
    <text x="726" y="351">sidebar player + crop box</text><text x="726" y="368">dual recorders, AAC MP4</text>
    <text x="726" y="385">timeline snapped to song</text><text x="726" y="402">one mix: music, game, mic</text>
    <text x="726" y="419">share at 9:16, 1:1, 16:9</text>
  </g>

  <!-- roots: source apps in integration priority -->
  <path d="M420 442 C380 470 250 462 150 488" class="root" stroke="#E9B949"/>
  <path d="M460 442 C450 466 400 472 370 488" class="root" stroke="#5FD3B5"/>
  <path d="M500 442 C510 466 560 472 590 488" class="root" stroke="#B79CF2"/>
  <path d="M540 442 C580 470 710 462 810 488" class="root" stroke="#F07C9B"/>
  <g text-anchor="middle">
    <rect x="55"  y="488" width="190" height="52" rx="8" class="box" stroke="#E9B949"/>
    <rect x="275" y="488" width="190" height="52" rx="8" class="box" stroke="#5FD3B5"/>
    <rect x="495" y="488" width="190" height="52" rx="8" class="box" stroke="#B79CF2"/>
    <rect x="715" y="488" width="190" height="52" rx="8" class="box" stroke="#F07C9B"/>
    <g class="serif frost" font-size="14">
      <text x="150" y="510">1  CavanTwin6</text><text x="370" y="510">2  MN Constellation</text>
      <text x="590" y="510">3  SOMA capture</text><text x="810" y="510">4  FrameForge6</text>
    </g>
    <g class="sans dim" font-size="11.5">
      <text x="150" y="529">property scale</text><text x="370" y="529">state-scale motion</text>
      <text x="590" y="529">presence</text><text x="810" y="529">story and share</text>
    </g>
    <!-- the well -->
    <ellipse cx="480" cy="571" rx="185" ry="15" fill="none" stroke="#5FD3B5" stroke-opacity=".45"/>
    <text x="480" y="575" class="sans dim" font-size="12">The well: episodic, semantic and purpose memory</text>
  </g>
</svg>
