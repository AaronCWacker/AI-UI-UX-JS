const SCALE_X = 14;
const SCALE_Z = 16;

function lonLatToWorld(lon, lat, y = 0) {
  const nx = (lon - GEO_BOUNDS.minLon) / (GEO_BOUNDS.maxLon - GEO_BOUNDS.minLon) - 0.5;
  const nz = (lat - GEO_BOUNDS.minLat) / (GEO_BOUNDS.maxLat - GEO_BOUNDS.minLat) - 0.5;
  return new THREE.Vector3(nx * SCALE_X, y, -nz * SCALE_Z);
}

// Normalized coordinate lookup for CPU elevation approximation
function getProceduralElevation(nx, nz) {
  const u = nx + 0.5;
  const v = nz + 0.5;
  let h = 0.0;

  // 1. Lake Superior Basin
  if (u > 0.68 && v > 0.62 && (u + v > 1.34)) {
    return -0.45;
  }
  // 2. Eagle Mountain & Sawtooth Ridge
  if (u > 0.55 && v > 0.68) {
    const ridge = Math.exp(-Math.pow((u - 0.78) * 8.0, 2) - Math.pow((v - 0.85) * 8.0, 2));
    h += ridge * 1.6;
  }
  // 3. Driftless Area Bluffs (Southeast)
  if (u > 0.65 && v < 0.28) {
    h += Math.abs(Math.sin(u * 22.0) * Math.sin(v * 22.0)) * 0.75;
  }
  // 4. Glacial River Warren Canyon
  const mvDist = Math.abs((v - 0.3) + 0.55 * (u - 0.4));
  if (mvDist < 0.07 && u > 0.22 && u < 0.78) {
    h -= 0.35;
  }
  // 5. Red River Valley (West - Flat glacial lakebed)
  if (u < 0.25) {
    h *= 0.2;
  } else {
    h += Math.sin(u * 6.0) * Math.cos(v * 5.0) * 0.15;
  }
  return h;
}

  az: 0.55, pol: 0.65, r: 16,
  target: new THREE.Vector3(0, 0, 0),
  velAz: 0, velPol: 0,
  update() {
    this.velAz *= 0.84; this.velPol *= 0.84;
    this.az += this.velAz;
    this.pol = Math.max(0.08, Math.min(Math.PI - 0.08, this.pol + this.velPol));
    const sp = Math.sin(this.pol), cp = Math.cos(this.pol), sa = Math.sin(this.az), ca = Math.cos(this.az);
    camera.position.set(this.target.x + this.r * sp * ca, this.target.y + this.r * cp, this.target.z + this.r * sp * sa);
    camera.lookAt(this.target);
  }
};

  buildGeologyOverlays();
  buildUndergroundStrata();
  buildTSLLakeSuperior();
  buildFactPins();

  buildUI();
  bindInput();
  orb.update();

  selectFact(0, false);
  animate();
}

// ─── TSL PROCEDURAL DISPLACED TERRAIN ────────────────────────
function buildDisplacedMinnesotaTerrain() {
  // Dense subdivided plane for GPU vertex displacement
  const geo = new THREE.PlaneGeometry(SCALE_X, SCALE_Z, 256, 256);
  geo.rotateX(-Math.PI / 2);

  // TSL Procedural Elevation Function
  const calculateHeight = Fn(([uCoord, vCoord]) => {
    const u = uCoord;
    const v = float(1.0).sub(vCoord); // Flip V for top-down alignment

    // 1. Eagle Mountain & Sawtooth Ridge (Northeast)
    const du = u.sub(0.78).mul(8.0);
    const dv = v.sub(0.85).mul(8.0);
    const ridgeDist = du.mul(du).add(dv.mul(dv));
    const ridge = exp(ridgeDist.negate()).mul(1.6);

    // 2. Driftless Bluffs (Southeast)
    const driftlessNoise = abs(sin(u.mul(22.0)).mul(sin(v.mul(22.0)))).mul(0.75);
    const inDriftless = u.greaterThan(0.65).and(v.lessThan(0.28));
    const driftlessHeight = inDriftless.select(driftlessNoise, float(0.0));

    // 3. Glacial River Warren Valley (Southwest to Center-East)
    const mvDist = abs(v.sub(0.3).add(u.sub(0.4).mul(0.55)));
    const inWarren = mvDist.lessThan(0.07).and(u.greaterThan(0.22)).and(u.lessThan(0.78));
    const warrenGouge = inWarren.select(float(-0.35), float(0.0));

    // 4. Regional Undulation & Red River Valley flatten
    const baseWave = sin(u.mul(6.0)).mul(cos(v.mul(5.0))).mul(0.15);
    const inRedRiver = u.lessThan(0.25);
    const regional = inRedRiver.select(float(0.02), baseWave);

    return ridge.add(driftlessHeight).add(warrenGouge).add(regional);
  });

  // TSL Material with vertex displacement node
  const heightNode = calculateHeight(uv().x, uv().y);
  const displacedPos = positionLocal.add(vec3(0.0, heightNode, 0.0));

  // Slope / elevation color blending
  const baseColor = color(0x0e2438);
  const ridgeColor = color(0x5c5042);
  const peakColor = color(0xebf4f6);
  const valleyColor = color(0x1a3820);

  const elevationColor = mix(
    mix(valleyColor, baseColor, heightNode.add(0.2)),
    mix(ridgeColor, peakColor, heightNode.sub(0.8).mul(1.2)),
    heightNode.greaterThan(0.5)
  );

  const mat = new THREE.MeshStandardNodeMaterial({
    positionNode: displacedPos,
    colorNode: elevationColor,
    roughness: 0.8,
    metalness: 0.15
  });

  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.y = 0.0;
  surfaceGroup.add(mesh);

  // Border outline projected with matching bounds
  const pts2D = MN_BORDER_COORDS.map(c => {
    const p = lonLatToWorld(c[0], c[1]);
    const nx = (c[0] - GEO_BOUNDS.minLon) / (GEO_BOUNDS.maxLon - GEO_BOUNDS.minLon) - 0.5;
    const nz = (c[1] - GEO_BOUNDS.minLat) / (GEO_BOUNDS.maxLat - GEO_BOUNDS.minLat) - 0.5;
    const elev = getProceduralElevation(nx, nz);
    return new THREE.Vector3(p.x, elev + 0.08, -p.z);
  });
  pts2D.push(pts2D[0].clone());
  surfaceGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts2D), new THREE.LineBasicMaterial({ color: 0x00e5ff, transparent: true, opacity: 0.8 })));

  const grid = new THREE.GridHelper(18, 24, 0x003355, 0x001528);
  grid.position.y = -0.01;
  surfaceGroup.add(grid);
}

function buildGeologyOverlays() {
  GEOLOGY_REGIONS.forEach((reg) => {
    const nx = (reg.lon - GEO_BOUNDS.minLon) / (GEO_BOUNDS.maxLon - GEO_BOUNDS.minLon) - 0.5;
    const nz = (reg.lat - GEO_BOUNDS.minLat) / (GEO_BOUNDS.maxLat - GEO_BOUNDS.minLat) - 0.5;
    const elev = getProceduralElevation(nx, nz);

    const wp = lonLatToWorld(reg.lon, reg.lat, elev + 0.04);
    const geo = new THREE.CylinderGeometry(reg.rx * 0.7, reg.rx * 0.7, 0.04, 24);
    const mat = new THREE.MeshStandardMaterial({
      color: reg.col, emissive: reg.col, emissiveIntensity: 0.25, roughness: 0.6, metalness: 0.3
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.copy(wp);
    mesh.scale.set(1, 1, reg.rz / reg.rx);
    surfaceGroup.add(mesh);
  });
}

function buildTSLLakeSuperior() {
  const supCoords = [
    [-92.10, 46.78], [-91.60, 46.88], [-90.80, 47.05], [-90.00, 47.25],
    [-89.60, 47.70], [-89.60, 46.60], [-91.00, 46.55], [-92.10, 46.78]
  ];
  const pts = supCoords.map(c => {
    const p = lonLatToWorld(c[0], c[1]);
    return new THREE.Vector2(p.x, -p.z);
  });
  const shape = new THREE.Shape(pts);
  const geo = new THREE.ShapeGeometry(shape);
  geo.rotateX(-Math.PI / 2);

  const waterUV = uv().mul(10.0);
  const wave = sin(waterUV.x.add(time.mul(1.4))).mul(0.15).add(cos(waterUV.y.add(time.mul(1.0))).mul(0.15));
  const waterColorNode = mix(color(0x0a325c), color(0x38bdf8), wave.add(0.2));

  const tslMat = new THREE.MeshStandardNodeMaterial({
    colorNode: waterColorNode,
    roughness: 0.1,
    metalness: 0.6,
    transparent: true,
    opacity: 0.8
  });

  const waterMesh = new THREE.Mesh(geo, tslMat);
  waterMesh.position.y = 0.05; // Placed inside the sunken basin
  surfaceGroup.add(waterMesh);
}

function buildUndergroundStrata() {
  STRATA.forEach((s, i) => {
    const yPos = -s.depth - 0.4;
    const geo = new THREE.BoxGeometry(11.0, s.thick, 12.0);
    const mat = new THREE.MeshStandardMaterial({
      color: s.col, emissive: s.col, emissiveIntensity: 0.08,
      roughness: 0.8, transparent: true, opacity: 0.45 + i * 0.04
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(0, yPos - s.thick / 2, 0);
    undergroundGroup.add(mesh);

    const edges = new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({ color: s.col, transparent: true, opacity: 0.35 }));
    edges.position.copy(mesh.position);
    undergroundGroup.add(edges);
  });
}

const factMarkerMap = new Map();
function buildFactPins() {
  const pinGeo = new THREE.ConeGeometry(0.11, 0.38, 12);
  pinGeo.rotateX(Math.PI);
  pinGeo.translate(0, 0.19, 0);

  const sphereGeo = new THREE.SphereGeometry(0.09, 12, 12);
  sphereGeo.translate(0, 0.44, 0);

  FACTS_DATA.forEach(fact => {
    const nx = (fact.lon - GEO_BOUNDS.minLon) / (GEO_BOUNDS.maxLon - GEO_BOUNDS.minLon) - 0.5;
    const nz = (fact.lat - GEO_BOUNDS.minLat) / (GEO_BOUNDS.maxLat - GEO_BOUNDS.minLat) - 0.5;
    const elev = getProceduralElevation(nx, nz);

    const wp = lonLatToWorld(fact.lon, fact.lat, elev + 0.12);
    let col = 0x00e5ff;
    if (fact.cat === 'Geology') col = 0xffaa00;
    else if (fact.cat === 'Glacial') col = 0x38bdf8;
    else if (fact.cat === 'Hydrology') col = 0x0284c7;
    else if (fact.cat === 'Climate') col = 0xec4899;
    else if (fact.cat === 'Wildlife' || fact.cat === 'Forests') col = 0x10b981;
    else if (fact.cat === 'Industry' || fact.cat === 'Architecture') col = 0xa855f7;

    const mat = new THREE.MeshStandardMaterial({ color: col, emissive: col, emissiveIntensity: 0.65 });
    const pin = new THREE.Group();
    pin.add(new THREE.Mesh(pinGeo, mat));
    pin.add(new THREE.Mesh(sphereGeo, mat));
    pin.position.copy(wp);
    pin.userData = { fact, initialY: wp.y };

    factPinsGroup.add(pin);
    factMarkerMap.set(fact.num, pin);
  });
}

function dropCustomPin(worldPos) {
  const pinGeo = new THREE.ConeGeometry(0.14, 0.48, 12);
  pinGeo.rotateX(Math.PI);
  pinGeo.translate(0, 0.24, 0);
  const headGeo = new THREE.SphereGeometry(0.11, 12, 12);
  headGeo.translate(0, 0.54, 0);

  const mat = new THREE.MeshStandardMaterial({ color: 0xff3b30, emissive: 0xff3b30, emissiveIntensity: 0.8 });
  const pin = new THREE.Group();
  pin.add(new THREE.Mesh(pinGeo, mat));
  pin.add(new THREE.Mesh(headGeo, mat));
  pin.position.copy(worldPos);
  pin.position.y += 0.05;
  customPinsGroup.add(pin);

  document.getElementById('pin-count-tag').textContent = `Pins: 50 + ${customPinsGroup.children.length} Custom`;
}

// ─── FLIGHT & SELECTION ───────────────────────────────────────
function flyTo(targetPos, radius = 6.0, dur = 800) {
  const t0 = performance.now();
  const sT = orb.target.clone(), eT = targetPos.clone();
  const sR = orb.r, eR = radius;
  (function step() {
    const t = Math.min(1, (performance.now() - t0) / dur);
    const ease = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
    orb.target.lerpVectors(sT, eT, ease);
    orb.r = sR + (eR - sR) * ease;
    orb.velAz = 0; orb.velPol = 0;
    if (t < 1) requestAnimationFrame(step);
  })();
}

function selectFact(index, doFly = true) {
  currentFactIndex = index;
  const fact = FACTS_DATA[index];
  const marker = factMarkerMap.get(fact.num);

  document.querySelectorAll('.fact-row').forEach(el => el.classList.remove('active'));
  const activeRow = document.getElementById(`f-row-${fact.num}`);
  if (activeRow) {
    activeRow.classList.add('active');
    activeRow.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  const card = document.getElementById('fact-card');
  card.classList.add('visible');
  document.getElementById('fc-category').textContent = `Fact #${fact.num} • ${fact.cat}`;
  document.getElementById('fc-title').textContent = fact.title;
  document.getElementById('fc-desc').textContent = fact.desc;

  if (doFly && marker) {
    flyTo(marker.position, 5.0);
  }
}

// ─── UI & EVENT LISTENERS ─────────────────────────────────────
function buildUI() {
  const fList = document.getElementById('facts-list');
  FACTS_DATA.forEach((fact, i) => {
    const row = document.createElement('div');
    row.className = 'item-row fact-row';
    row.id = `f-row-${fact.num}`;
    row.innerHTML = `<div><div class="item-title">#${fact.num}. ${fact.title}</div><div class="item-sub">${fact.cat}</div></div>`;
    row.addEventListener('click', () => selectFact(i, true));
    fList.appendChild(row);
  });

  const gList = document.getElementById('geology-list');
  GEOLOGY_REGIONS.forEach(reg => {
    const nx = (reg.lon - GEO_BOUNDS.minLon) / (GEO_BOUNDS.maxLon - GEO_BOUNDS.minLon) - 0.5;
    const nz = (reg.lat - GEO_BOUNDS.minLat) / (GEO_BOUNDS.maxLat - GEO_BOUNDS.minLat) - 0.5;
    const elev = getProceduralElevation(nx, nz);

    const row = document.createElement('div');
    row.className = 'item-row';
    row.innerHTML = `<div class="swatch" style="background:#${reg.col.toString(16).padStart(6,'0')}"></div><div><div class="item-title">${reg.name}</div><div class="item-sub">${reg.era}</div></div>`;
    row.addEventListener('click', () => flyTo(lonLatToWorld(reg.lon, reg.lat, elev + 0.1), 5.5));
    gList.appendChild(row);
  });

  const sList = document.getElementById('strata-list');
  STRATA.forEach(s => {
    const row = document.createElement('div');
    row.className = 'item-row';
    row.innerHTML = `<div class="swatch" style="background:#${s.col.toString(16).padStart(6,'0')}"></div><div><div class="item-title">${s.name}</div><div class="item-sub">${s.era}</div></div>`;
    sList.appendChild(row);
  });

  // Tab navigation
  ['facts', 'geology', 'strata'].forEach(tab => {
    document.getElementById(`tab-${tab}`).addEventListener('click', () => {
      ['facts', 'geology', 'strata'].forEach(t => {
        document.getElementById(`tab-${t}`).classList.toggle('active', t === tab);
        document.getElementById(`pane-${t}`).classList.toggle('active', t === tab);
      });
    });
  });

  // Fact controls
  document.getElementById('btn-prev').addEventListener('click', () => {
    selectFact((currentFactIndex - 1 + FACTS_DATA.length) % FACTS_DATA.length, true);
  });
  document.getElementById('btn-next').addEventListener('click', () => {
    selectFact((currentFactIndex + 1) % FACTS_DATA.length, true);
  });

  const autoBtn = document.getElementById('btn-auto');
  autoBtn.addEventListener('click', () => {
    if (autoTourInterval) {
      clearInterval(autoTourInterval);
      autoTourInterval = null;
      autoBtn.textContent = '▶ Auto Tour';
      autoBtn.classList.remove('active');
    } else {
      autoBtn.textContent = '⏸ Pause';
      autoBtn.classList.add('active');
      selectFact(currentFactIndex, true);
      autoTourInterval = setInterval(() => {
        selectFact((currentFactIndex + 1) % FACTS_DATA.length, true);
      }, 5000);
    }
  });

  // Layer toggles
  const bindToggle = (btnId, group) => {
    document.getElementById(btnId).addEventListener('click', function() {
      group.visible = !group.visible;
      this.classList.toggle('active', group.visible);
    });
  };
  bindToggle('btn-toggle-surface', surfaceGroup);
  bindToggle('btn-toggle-under', undergroundGroup);
  bindToggle('btn-toggle-pins', factPinsGroup);

  const dropBtn = document.getElementById('btn-drop-mode');
  dropBtn.addEventListener('click', () => {
    customPinMode = !customPinMode;
    dropBtn.classList.toggle('active', customPinMode);
  });

  document.getElementById('btn-cross').addEventListener('click', () => {
    undergroundGroup.visible = true;
    document.getElementById('btn-toggle-under').classList.add('active');
    flyTo(new THREE.Vector3(0, -1.8, 0), 16);
  });

  document.getElementById('btn-reset').addEventListener('click', () => {
    flyTo(new THREE.Vector3(0, 0, 0), 16);
    document.getElementById('fact-card').classList.remove('visible');
  });

  document.getElementById('btn-rotate').addEventListener('click', function() {
    autoRotate = !autoRotate;
    this.classList.toggle('active', autoRotate);
  });
}

function bindInput() {
  const el = renderer.domElement;
  const ray = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  let downX = 0, downY = 0;

  el.addEventListener('pointerdown', e => {
    orb.isDown = true; orb.lastX = e.clientX; orb.lastY = e.clientY;
    downX = e.clientX; downY = e.clientY;
    el.setPointerCapture(e.pointerId);
  });

  el.addEventListener('pointermove', e => {
    if (!orb.isDown) return;
    const dx = e.clientX - orb.lastX, dy = e.clientY - orb.lastY;
    orb.lastX = e.clientX; orb.lastY = e.clientY;
    orb.velAz += -dx * 0.003; orb.velPol += -dy * 0.003;
  });

  el.addEventListener('pointerup', e => {
    orb.isDown = false;
    try { el.releasePointerCapture(e.pointerId); } catch (_) {}

    if (Math.abs(e.clientX - downX) + Math.abs(e.clientY - downY) < 5) {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      ray.setFromCamera(mouse, camera);

      if (customPinMode) {
        const hits = ray.intersectObjects(surfaceGroup.children, true);
        if (hits.length > 0) dropCustomPin(hits[0].point);
        return;
      }

      const pinHits = ray.intersectObjects(factPinsGroup.children, true);
      if (pinHits.length > 0) {
        let root = pinHits[0].object;
        while (root.parent && root.parent !== factPinsGroup) root = root.parent;
        if (root.userData && root.userData.fact) {
          const idx = FACTS_DATA.findIndex(f => f.num === root.userData.fact.num);
          if (idx !== -1) selectFact(idx, true);
        }
      }
    }
  });

  el.addEventListener('wheel', e => {
    e.preventDefault();
    orb.r = Math.max(3.5, Math.min(35, orb.r + Math.sign(e.deltaY) * 0.65));
  }, { passive: false });

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
}

// ─── RENDER LOOP ──────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  const t = performance.now() * 0.0015;

  // Pin hover bobbing
  factPinsGroup.children.forEach((pin, i) => {
    pin.position.y = pin.userData.initialY + Math.sin(t * 3.0 + i * 0.5) * 0.03;
  });

  if (autoRotate && !orb.isDown) orb.velAz += 0.0003;
  orb.update();

  renderer.render(scene, camera);
}

init();
</script>
